name: Catalog phase 3 keyless review batches v59

on:
  push:
    branches:
      - cook4me-catalog-phase3-staging-v59
    paths:
      - .github/workflows/catalog-phase3-keyless-loader-v59.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Add keyless source-field provenance
        run: python tools/patch_phase3_keyless_source_provenance_v59.py
      - name: Validate keyless provenance and review pipeline
        run: |
          python -m py_compile tools/prepare_release_catalog_v2_assembly.py tools/apply_release_catalog_reviews_v2.py tests/test_release_catalog_v2_assembly_prep.py tests/test_release_catalog_review_overlay.py
          python tests/test_release_catalog_v2_assembly_prep.py
          python tests/test_release_catalog_review_overlay.py
          git diff --check
      - name: Commit tested Phase 3 provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/prepare_release_catalog_v2_assembly.py tests/test_release_catalog_v2_assembly_prep.py
          git diff --cached --check
          git commit -m "Preserve keyless ingredient source provenance"
          git push origin HEAD:cook4me-catalog-phase3-staging-v59
