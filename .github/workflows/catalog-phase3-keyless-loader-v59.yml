name: Catalog phase 3 keyless review batches v59

on:
  push:
    branches:
      - cook4me-catalog-phase3-staging-v59
    paths:
      - .github/workflows/catalog-phase3-keyless-loader-v59.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Phase 3 catalog infrastructure
        run: |
          python -m py_compile \
            tools/prepare_release_catalog_v2_assembly.py \
            tools/apply_release_catalog_reviews_v2.py \
            tools/snapshot_release_catalog_keyless_queue_v59.py \
            tests/test_release_catalog_v2_assembly_prep.py \
            tests/test_release_catalog_review_overlay.py \
            tests/test_release_catalog_keyless_queue_snapshot_v59.py
          python tests/test_release_catalog_v2_assembly_prep.py
          python tests/test_release_catalog_review_overlay.py
          python tests/test_release_catalog_keyless_queue_snapshot_v59.py
          git diff --check
