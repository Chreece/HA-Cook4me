name: Mobile product editor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-product:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Real mobile product interactions
        run: python tests/browser_mobile_product_v269.py
