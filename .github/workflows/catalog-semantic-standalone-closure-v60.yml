name: Close remaining ingredient semantics conservatively v60

on:
  push:
    branches:
      - cook4me-ingredient-semantic-confirmation-v60
    paths:
      - '.github/workflows/catalog-semantic-standalone-closure-v60.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-standalone-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Snapshot exact unresolved review dispositions
        run: |
          set -Eeuo pipefail
          python tools/snapshot_semantic_standalone_dispositions_v60.py \
            --audit tools/remaining_semantic_ingredient_audit_v60.json \
            --output tools/release_catalog_semantic_standalone_dispositions.v1.json

      - name: Wire conservative closure into semantic compiler and CI
        run: |
          set -Eeuo pipefail
          python tools/fix_semantic_standalone_patch_helper_v60.py
          python tools/apply_semantic_standalone_closure_patch_v60.py
          python tools/fix_semantic_standalone_regression_v60.py

      - name: Run semantic closure regression suite
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_semantic_*v60.py' -v
          python -m unittest discover -s tests -p 'test_compile_release_catalog_semantics_v60.py' -v
          python tools/compile_release_catalog_semantics_v60.py \
            --reviews-dir tools \
            --output "$RUNNER_TEMP/semantic-closed.v60.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'semantic-closed.v60.json').read_text(
                  encoding='utf-8'
              )
          )
          summary = payload['summary']
          expected = {
              'needsSemanticConfirmationSourceLabels': 0,
              'standaloneConfirmedSourceLabels': 293,
              'reviewedAmbiguousSourceLabels': 28,
              'exactConfirmedSourceLabels': 115,
              'semanticEquivalentConfirmedSourceLabels': 7,
              'syntacticConfirmedSourceLabels': 84,
          }
          for key, value in expected.items():
              if int(summary.get(key) or 0) != value:
                  raise SystemExit(f'{key}: {summary.get(key)} != {value}')
          standalone = [
              concept
              for concept in payload.get('concepts') or []
              if concept.get('mergePolicy') in {
                  'reviewed-source-local-standalone',
                  'reviewed-ambiguous-source-fragment',
              }
          ]
          if len(standalone) != 293:
              raise SystemExit(f'unexpected standalone concept count: {len(standalone)}')
          for concept in standalone:
              if not str(concept.get('conceptId') or '').startswith('concept:source:'):
                  raise SystemExit('standalone disposition changed source-local concept identity')
              if concept.get('needsSemanticConfirmation') is not False:
                  raise SystemExit('standalone disposition remained pending')
              for key in ('nutritionEligible', 'dietEligible', 'allergenEligible'):
                  if concept.get(key) is not False:
                      raise SystemExit(f'standalone disposition gained {key}')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Commit tested non-workflow closure files
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Chreece@users.noreply.github.com'

          cp .github/workflows/catalog-semantic-confirmation-apply-v60.yml \
            tools/generated_catalog_semantic_confirmation_apply_v60.yml
          cp .github/workflows/catalog-semantic-remaining-audit-v60.yml \
            tools/generated_catalog_semantic_remaining_audit_v60.yml
          git restore -- \
            .github/workflows/catalog-semantic-confirmation-apply-v60.yml \
            .github/workflows/catalog-semantic-remaining-audit-v60.yml

          git rm -f \
            tools/apply_semantic_standalone_closure_patch_v60.py \
            tools/fix_semantic_standalone_patch_helper_v60.py \
            tools/fix_semantic_standalone_regression_v60.py
          git add \
            tools/compile_release_catalog_semantics_v60.py \
            tools/release_catalog_semantic_standalone_dispositions.v1.json \
            tests/test_compile_release_catalog_semantics_v60.py \
            tests/test_semantic_standalone_dispositions_v60.py \
            tools/generated_catalog_semantic_confirmation_apply_v60.yml \
            tools/generated_catalog_semantic_remaining_audit_v60.yml
          git diff --cached --check
          git commit -m 'Close remaining ingredient semantics conservatively v60'
          git pull --rebase origin cook4me-ingredient-semantic-confirmation-v60
          git push origin HEAD:cook4me-ingredient-semantic-confirmation-v60
