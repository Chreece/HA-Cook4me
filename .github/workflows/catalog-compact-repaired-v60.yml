name: Compact repaired progressive catalog v60

on:
  push:
    branches:
      - cook4me-progressive-catalog-activation-v60
    paths:
      - .github/workflows/catalog-compact-repaired-v60.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  REPAIR_RUN_ID: '34837322277'
  REPAIR_ARTIFACT: 'repaired-progressive-catalog-v60-f0f5185240239e656655b5026627727a7976084d'

jobs:
  compact-repaired-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download validated repaired catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-compact-v60"
          mkdir -p "$BUILD/source"
          gh run download "$REPAIR_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$REPAIR_ARTIFACT" --dir "$BUILD/source"
          test -f "$BUILD/source/repaired-catalog.v60.json"
      - name: Compact build-only duplication and rebuild derived indexes
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-compact-v60"
          python tools/compact_release_catalog_runtime_v60.py \
            --catalog "$BUILD/source/repaired-catalog.v60.json" \
            --output "$BUILD/compact-catalog.v60.json" \
            --summary "$BUILD/compact-summary.v60.json"
      - name: Independently validate exact compact artifact
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-compact-v60"
          python tools/validate_release_catalog_v60.py "$BUILD/compact-catalog.v60.json" \
            | tee "$BUILD/compact-validation.v60.json"
      - name: Prove counts, size and multilingual prefix search
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-compact-v60"
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cook4me-compact-v60'
          sys.path.insert(0, str(Path.cwd() / 'custom_components' / 'cook4me'))
          import catalog_search_index as search

          path = root / 'compact-catalog.v60.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          prepared = search.prepare_search_index(payload.get('searchIndex') or {})
          def q(value, language='el'):
              result = search.search_index(prepared, value, language=language, strict_language=False, page=0, size=20)
              return {'query': value, 'total': int(result.get('total') or 0), 'indices': list(result.get('indices') or [])}
          source = payload.get('source') if isinstance(payload.get('source'), dict) else {}
          facts = {
              'complete': payload.get('complete') is True,
              'catalogBytes': path.stat().st_size,
              'recipes': len(payload.get('recipes') or []),
              'variants': sum(len(r.get('variants') or []) for r in payload.get('recipes') or [] if isinstance(r, dict)),
              'ingredients': len(payload.get('ingredients') or []),
              'failedDetailCount': int(source.get('failedDetailCount') or 0),
              'detailNotFoundCount': int(source.get('detailNotFoundCount') or 0),
              'prefixPostingsPersisted': bool((payload.get('searchIndex') or {}).get('prefixPostings')),
              'runtimeRecipeNutritionOnDemand': source.get('runtimeRecipeNutritionOnDemand') is True,
              'latinRisotto': q('risotto'),
              'greekRisotto': q('ριζότο'),
              'prefixRiso': q('riso', 'it'),
          }
          if not facts['complete']:
              raise SystemExit('compact catalog lost complete=true')
          if (facts['recipes'], facts['variants'], facts['ingredients']) != (16952, 32163, 11748):
              raise SystemExit('compact catalog changed release counts')
          if facts['failedDetailCount'] != 0 or facts['detailNotFoundCount'] != 1485:
              raise SystemExit('compact catalog changed detail accounting')
          if facts['prefixPostingsPersisted']:
              raise SystemExit('compact catalog still persists prefix postings')
          if not facts['runtimeRecipeNutritionOnDemand']:
              raise SystemExit('compact catalog did not enable runtime nutrition calculation')
          if facts['catalogBytes'] >= 95_000_000:
              raise SystemExit(f"compact catalog is still too large: {facts['catalogBytes']} bytes")
          if facts['latinRisotto']['total'] <= 0 or facts['greekRisotto']['total'] <= 0 or facts['prefixRiso']['total'] <= 0:
              raise SystemExit('compact multilingual/prefix search regression')
          (root / 'compact-facts.v60.json').write_text(json.dumps(facts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(facts, ensure_ascii=False, indent=2))
          PY
      - name: Upload validated compact catalog
        uses: actions/upload-artifact@v4
        with:
          name: compact-progressive-catalog-v60-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cook4me-compact-v60/compact-catalog.v60.json
            ${{ runner.temp }}/cook4me-compact-v60/compact-summary.v60.json
            ${{ runner.temp }}/cook4me-compact-v60/compact-validation.v60.json
            ${{ runner.temp }}/cook4me-compact-v60/compact-facts.v60.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
