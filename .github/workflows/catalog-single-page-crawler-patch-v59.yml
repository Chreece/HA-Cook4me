name: Catalog single-page crawler patch v59

on:
  push:
    branches:
      - cook4me-catalog-pagination-probe-v59
    paths:
      - .github/workflows/catalog-single-page-crawler-patch-v59.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply proven single-page crawl contract
        run: python tools/patch_catalog_single_page_v59.py
      - name: Validate crawler contract
        run: |
          python -m py_compile tools/crawl_release_catalog_v2.py tests/test_release_catalog_v2_crawler.py
          python tests/test_release_catalog_v2_crawler.py
          python tests/test_release_catalog_v2_assembly_prep.py
          git diff --check
      - name: Commit tested crawler repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/crawl_release_catalog_v2.py tests/test_release_catalog_v2_crawler.py
          git diff --cached --check
          git commit -m "Use proven stable single-page release catalog crawl"
          git push origin HEAD:cook4me-catalog-pagination-probe-v59
