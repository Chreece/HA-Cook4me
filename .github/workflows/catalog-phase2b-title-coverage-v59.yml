name: Catalog Phase 2B title coverage v59

on:
  push:
    branches:
      - cook4me-release-catalog-cache-progress-v59
    paths:
      - .github/workflows/catalog-phase2b-title-coverage-v59.yml
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify every fresh residual title has one loaded review
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from collections import Counter
          from pathlib import Path
          import sys

          root = Path('.').resolve()
          script = root / 'tools' / 'apply_release_catalog_reviews_v2.py'
          spec = importlib.util.spec_from_file_location('apply_release_catalog_reviews_v2_phase2b_check', script)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          reviews = module._recipe_title_reviews()
          snapshot = json.loads((root / 'tools' / 'release_catalog_pending_recipe_titles_v59.json').read_text(encoding='utf-8'))
          tasks = [row for row in snapshot.get('tasks', []) if isinstance(row, dict)]
          missing = []
          for row in tasks:
              lang = module._text(row.get('sourceLanguage')).lower()
              source = module._text(row.get('sourceText'))
              review = reviews.get((lang, module._norm(source)))
              if not review:
                  missing.append({'language': lang, 'source': source})
          if missing:
              counts = Counter(row['language'] for row in missing)
              raise SystemExit(f'missing reviewed title coverage: total={len(missing)} byLanguage={dict(sorted(counts.items()))} examples={missing[:10]}')
          print(json.dumps({'freshResidualTasks': len(tasks), 'covered': len(tasks), 'missing': 0}, ensure_ascii=False))
          PY
