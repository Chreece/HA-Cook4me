name: Catalog pagination probe cleanup v59

on:
  push:
    branches:
      - cook4me-catalog-pagination-probe-v59
    paths:
      - .github/workflows/catalog-pagination-probe-cleanup-v59.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary pagination probe scaffolding
        run: |
          set -Eeuo pipefail
          git rm -f \
            .github/workflows/catalog-pagination-probe-cleanup-v59.yml \
            .github/workflows/catalog-pagination-size-probe-v59.yml \
            .github/workflows/catalog-pagination-all28-probe-v59.yml \
            .github/workflows/catalog-single-page-crawler-patch-v59.yml \
            tools/catalog_pagination_size_probe_v59.json \
            tools/catalog_pagination_all28_probe_v59.json \
            tools/patch_catalog_single_page_v59.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "Remove temporary catalog pagination probe scaffolding"
          git push origin HEAD:cook4me-catalog-pagination-probe-v59
