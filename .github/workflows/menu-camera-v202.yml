name: Menu gaps and scanner layout
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: menu-camera-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  menu-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Partial menus and selected-first filters
        run: |
          python tests/test_menu_gaps_v202.py
          node --test tests/test_menu_camera_v202.mjs
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Portrait, landscape and live rotation
        run: python tests/browser_menu_camera_v202.py
      - name: Source syntax
        run: |
          python -m compileall -q custom_components/cook4me
          node --check custom_components/cook4me/frontend/filter-selection-v202.js
          node --check custom_components/cook4me/frontend/recipe-gaps-v202.js
          node --check custom_components/cook4me/frontend/scanner-camera-v202.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v180.js
