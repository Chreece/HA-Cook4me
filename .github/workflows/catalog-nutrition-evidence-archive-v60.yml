name: Archive immutable nutrition evidence v60

on:
  push:
    branches:
      - cook4me-nutrition-enrichment-post-activation-v60
    paths:
      - .github/workflows/catalog-nutrition-evidence-archive-v60.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  archive-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_TAG: nutrition-evidence-v60-archive
      OLD_EVIDENCE_SHA: 8beb71a92432c46c6b452f3ce75a92a51e5f15285357ed17898409c8ee597423
      PINNED_EVIDENCE_SHA: c26ca11a83b592737417181ca5fcbf4b092d2c176e98192334577ac8367bc46b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download original post-activation evidence snapshot
        uses: actions/download-artifact@v4
        with:
          name: nutrition-enrichment-evidence-v60-98a0b0e284749622787ff251340d0100b650e2c4
          path: /tmp/evidence-old
          repository: Chreece/HA-Cook4me
          run-id: 34847903376
          github-token: ${{ github.token }}

      - name: Download byte-pinned post-activation evidence snapshot
        uses: actions/download-artifact@v4
        with:
          name: nutrition-enrichment-evidence-v60-80145ccdb07c452c721abce3b1585fb8be4d0d6c
          path: /tmp/evidence-pinned
          repository: Chreece/HA-Cook4me
          run-id: 34853007338
          github-token: ${{ github.token }}

      - name: Verify and compress immutable evidence bytes
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/nutrition-evidence-archive

          OLD=/tmp/evidence-old/fdc-candidate-evidence.v60.json
          PINNED=/tmp/evidence-pinned/fdc-candidate-evidence.v60.json
          test "$(sha256sum "$OLD" | awk '{print $1}')" = "$OLD_EVIDENCE_SHA"
          test "$(sha256sum "$PINNED" | awk '{print $1}')" = "$PINNED_EVIDENCE_SHA"

          cp "$OLD" "/tmp/nutrition-evidence-archive/fdc-candidate-evidence-v60-${OLD_EVIDENCE_SHA}.json"
          cp "$PINNED" "/tmp/nutrition-evidence-archive/fdc-candidate-evidence-v60-${PINNED_EVIDENCE_SHA}.json"

          gzip -n -9 "/tmp/nutrition-evidence-archive/fdc-candidate-evidence-v60-${OLD_EVIDENCE_SHA}.json"
          gzip -n -9 "/tmp/nutrition-evidence-archive/fdc-candidate-evidence-v60-${PINNED_EVIDENCE_SHA}.json"

          cat > /tmp/nutrition-evidence-archive/README.txt <<EOF
          HA-Cook4me v60 immutable nutrition evidence archive.

          Original post-activation evidence SHA-256:
          ${OLD_EVIDENCE_SHA}

          Byte-pinned post-activation evidence SHA-256:
          ${PINNED_EVIDENCE_SHA}

          The SHA values name the uncompressed JSON bytes. These snapshots are
          evidence only; candidate rank, singleton status, aliases, and literal
          matches are not nutrition identity proof and are never auto-selected.
          EOF

      - name: Create or update draft evidence release
        run: |
          set -Eeuo pipefail
          NOTES=/tmp/nutrition-evidence-archive/release-notes.md
          cat > "$NOTES" <<'EOF'
          # Cook4Me v60 immutable nutrition evidence

          Internal provenance archive for reviewed nutrition bindings.

          This is intentionally a **draft release** so it does not appear as a
          public Cook4Me software release. The assets preserve exact candidate-
          evidence JSON generations after GitHub Actions artifacts expire.

          Candidate evidence remains non-binding. Human review and the committed
          review-decision files are required before any FDC identity is trusted.
          EOF

          if ! gh release view "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ARCHIVE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Cook4Me v60 nutrition evidence archive" \
              --notes-file "$NOTES"
          fi

          gh release upload "$ARCHIVE_TAG" \
            /tmp/nutrition-evidence-archive/fdc-candidate-evidence-v60-${OLD_EVIDENCE_SHA}.json.gz \
            /tmp/nutrition-evidence-archive/fdc-candidate-evidence-v60-${PINNED_EVIDENCE_SHA}.json.gz \
            /tmp/nutrition-evidence-archive/README.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify draft release assets
        run: |
          set -Eeuo pipefail
          gh release view "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,name,tagName \
            | tee /tmp/evidence-release.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/evidence-release.json').read_text(encoding='utf-8'))
          if data.get('isDraft') is not True:
              raise SystemExit('nutrition evidence archive must remain a draft release')
          names = {asset.get('name') for asset in data.get('assets') or []}
          expected = {
              f"fdc-candidate-evidence-v60-{os.environ['OLD_EVIDENCE_SHA']}.json.gz",
              f"fdc-candidate-evidence-v60-{os.environ['PINNED_EVIDENCE_SHA']}.json.gz",
              'README.txt',
          }
          missing = sorted(expected - names)
          if missing:
              raise SystemExit(f'missing evidence archive assets: {missing}')
          print(json.dumps({'draft': True, 'assets': sorted(expected)}, indent=2))
          PY
