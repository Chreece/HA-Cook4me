name: Export Batch 41 state artifact

on:
  push:
    branches:
      - cook4me-nutrition-batch41-discovery-v60
    paths:
      - '.github/workflows/batch41-discover.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact current review-state receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import sys

          root = Path.cwd()
          tools = root / 'tools'
          sys.path.insert(0, str(tools))
          import classify_nutrition_review_queue_v60 as classifier
          import nutrition_review_holds_v60 as holds
          import snapshot_nutrition_review_checkpoint_v60 as checkpoint

          cp = checkpoint.build_checkpoint(tools)
          hold_doc = holds.load_holds()
          rules_doc, compiled = classifier._load_rules()
          out = {
              'schemaVersion': 1,
              'kind': 'cook4me-batch41-current-review-state-v60',
              'sourceCommit': cp['sourceCommit'],
              'checkpointSummary': cp['summary'],
              'reviewFilesSha256': cp['reviewFilesSha256'],
              'recordedBindingsSha256': cp['recordedBindingsSha256'],
              'recordedReviewTargetIds': sorted({row['reviewTargetId'] for row in cp['recordedBindings']}),
              'heldReviewTargetIds': sorted(hold_doc['targets']),
              'bulkRuleSourceEvidenceSha256': rules_doc['sourceEvidenceSha256'],
              'bulkRuleReferenceManifestSha256': rules_doc['referenceManifestSha256'],
              'bulkRules': [
                  {
                      'ruleId': rule['ruleId'],
                      'pattern': rule['pattern'],
                      'tier': rule['tier'],
                      'fdcId': rule['fdcId'],
                      'fdcDescription': rule['fdcDescription'],
                      'contract': rule['contract'],
                  }
                  for rule, _regex in compiled
              ],
          }
          Path('batch41-state-export.json').write_text(
              json.dumps(out, sort_keys=True, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          print(f"recorded={len(out['recordedReviewTargetIds'])}")
          print(f"held={len(out['heldReviewTargetIds'])}")
          print(f"rules={len(out['bulkRules'])}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch41-current-review-state
          path: batch41-state-export.json
          if-no-files-found: error
          retention-days: 1
