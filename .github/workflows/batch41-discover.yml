name: Discover Batch 41 nutrition candidates

on:
  push:
    branches:
      - cook4me-nutrition-batch41-discovery-v60
    paths:
      - '.github/workflows/batch41-discover.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize exact historical candidate evidence
        env:
          HISTORICAL_COMMIT: d4addcce84b9a51170a831ce5bc39862fcf0ad65
          HISTORICAL_BRANCH: cook4me-v60-offline-fdc-candidates-2
          HISTORICAL_PATH: tests/fixtures/nutrition-candidate-evidence-v60.json
        run: |
          git fetch --no-tags origin "$HISTORICAL_BRANCH"
          git cat-file -e "$HISTORICAL_COMMIT^{commit}"
          test "$(git rev-parse FETCH_HEAD)" = "$HISTORICAL_COMMIT" || {
            echo "Historical evidence branch moved; refusing to substitute evidence."
            exit 1
          }
          git show "$HISTORICAL_COMMIT:$HISTORICAL_PATH" > "$RUNNER_TEMP/nutrition-candidate-evidence-v60.json"
          test -s "$RUNNER_TEMP/nutrition-candidate-evidence-v60.json"
      - name: Classify current queue from exact historical evidence
        env:
          HISTORICAL_COMMIT: d4addcce84b9a51170a831ce5bc39862fcf0ad65
          HISTORICAL_PATH: tests/fixtures/nutrition-candidate-evidence-v60.json
          EXPECTED_SOURCE_SHA: e3b22f9b0834a79ffcc471d7bc61c07f08ce1f63da312c2ac36e84633c2931ac
        run: |
          python - <<'PY'
          from __future__ import annotations
          from collections import defaultdict
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          ROOT = Path.cwd()
          TOOLS = ROOT / 'tools'
          EVIDENCE = Path(os.environ['RUNNER_TEMP']) / 'nutrition-candidate-evidence-v60.json'
          sys.path.insert(0, str(TOOLS))

          import classify_nutrition_review_queue_v60 as classifier
          import snapshot_nutrition_review_checkpoint_v60 as checkpoint

          expected_source_sha = os.environ['EXPECTED_SOURCE_SHA']
          evidence_doc, evidence_source_sha = checkpoint._read(EVIDENCE)
          raw_sha = hashlib.sha256(EVIDENCE.read_bytes()).hexdigest()
          if evidence_source_sha != expected_source_sha:
              raise SystemExit(
                  f'historical evidence lineage differs: {evidence_source_sha} != {expected_source_sha}'
              )

          # classify() revalidates holds, all explicit review rows, every bulk-family
          # registry, and the evidence lineage against the current branch. It never
          # creates or approves a binding.
          result = classifier.classify(EVIDENCE, review_root=TOOLS)
          if result['sourceEvidenceSha256'] != expected_source_sha:
              raise SystemExit('classifier returned a different evidence lineage')
          summary = result['summary']

          expected_summary = {
              'recordedReviewTargetCount': 5071,
              'remainingReviewTargetCount': 1248,
              'manualFamilyCandidateCount': 416,
              'contextHeavyCount': 832,
              'unreviewedRuleMatchCount': 0,
              'bindingsApprovedByClassifier': 0,
              'networkRequestsPerformed': False,
          }
          mismatches = {
              key: {'expected': expected, 'actual': summary.get(key)}
              for key, expected in expected_summary.items()
              if summary.get(key) != expected
          }
          if mismatches:
              raise SystemExit(f'Batch 40 post-state drifted before Batch 41 discovery: {mismatches}')

          manual = result['tierBManual']
          context = result['tierCContext']
          rule_unreviewed = result['ruleCoveredButUnreviewed']

          def text(value):
              return str(value or '').strip()

          def usage(row):
              for key in ('usageCountSum', 'usageCount', 'recipeUsageCount'):
                  value = row.get(key)
                  if isinstance(value, int):
                      return value
              return 0

          def candidate_projection(candidate):
              return {
                  'localEvidenceRank': candidate.get('localEvidenceRank'),
                  'fdcId': candidate.get('fdcId'),
                  'description': candidate.get('description'),
                  'dataType': candidate.get('dataType'),
                  'score': candidate.get('score'),
              }

          manual_rows = []
          by_top_fdc = defaultdict(list)
          by_top_description = defaultdict(list)
          by_first_token = defaultdict(list)
          for row in manual:
              candidates = row.get('candidates') or []
              projected = {
                  'reviewTargetId': row['reviewTargetId'],
                  'canonicalEnglishName': row['canonicalEnglishName'],
                  'reviewTargetKind': row.get('reviewTargetKind'),
                  'usageCount': usage(row),
                  'candidateCount': len(candidates),
                  'topCandidates': [candidate_projection(c) for c in candidates[:5]],
              }
              manual_rows.append(projected)
              if candidates:
                  top = candidates[0]
                  by_top_fdc[str(top.get('fdcId'))].append(projected)
                  by_top_description[text(top.get('description'))].append(projected)
              token_match = re.search(r"[A-Za-zÀ-ÖØ-öø-ÿ]+", row['canonicalEnglishName'])
              if token_match:
                  by_first_token[token_match.group(0).casefold()].append(projected)

          def summarize_group(key, rows):
              ordered = sorted(
                  rows,
                  key=lambda item: (
                      -item['usageCount'],
                      item['canonicalEnglishName'].casefold(),
                      item['reviewTargetId'],
                  ),
              )
              return {
                  'key': key,
                  'targetCount': len(rows),
                  'usageCount': sum(item['usageCount'] for item in rows),
                  'targets': [
                      {
                          'reviewTargetId': item['reviewTargetId'],
                          'canonicalEnglishName': item['canonicalEnglishName'],
                          'usageCount': item['usageCount'],
                          'topCandidate': item['topCandidates'][0] if item['topCandidates'] else None,
                      }
                      for item in ordered
                  ],
              }

          repeated_top_fdc = [
              summarize_group(key, rows)
              for key, rows in by_top_fdc.items()
              if len(rows) >= 2
          ]
          repeated_top_fdc.sort(
              key=lambda group: (-group['usageCount'], -group['targetCount'], group['key'])
          )

          repeated_top_description = [
              summarize_group(key, rows)
              for key, rows in by_top_description.items()
              if len(rows) >= 2
          ]
          repeated_top_description.sort(
              key=lambda group: (-group['usageCount'], -group['targetCount'], group['key'].casefold())
          )

          first_token_groups = [
              summarize_group(key, rows)
              for key, rows in by_first_token.items()
              if len(rows) >= 2
          ]
          first_token_groups.sort(
              key=lambda group: (-group['usageCount'], -group['targetCount'], group['key'])
          )

          manual_rows.sort(
              key=lambda row: (
                  -row['usageCount'],
                  row['canonicalEnglishName'].casefold(),
                  row['reviewTargetId'],
              )
          )

          out = {
              'schemaVersion': 1,
              'kind': 'cook4me-batch41-discovery-v60',
              'baseCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'sourceHistoricalCommit': os.environ['HISTORICAL_COMMIT'],
              'sourceHistoricalPath': os.environ['HISTORICAL_PATH'],
              'sourceEvidenceRawSha256': raw_sha,
              'sourceEvidenceSha256': expected_source_sha,
              'policy': {
                  'discoveryOnly': True,
                  'createsBindings': False,
                  'candidateRankIsIdentityProof': False,
                  'providerIdentityInference': False,
                  'automaticRuleExpansionForbidden': True,
                  'networkRequestsPerformed': False,
                  'contextHeavyTargetsRemainUntouched': True,
              },
              'classifierSummary': summary,
              'counts': {
                  'manual': len(manual_rows),
                  'context': len(context),
                  'ruleCoveredButUnreviewed': len(rule_unreviewed),
                  'repeatedTopFdcGroups': len(repeated_top_fdc),
                  'repeatedTopDescriptionGroups': len(repeated_top_description),
                  'firstTokenGroups': len(first_token_groups),
              },
              'repeatedTopFdcGroups': repeated_top_fdc,
              'repeatedTopDescriptionGroups': repeated_top_description,
              'firstTokenGroups': first_token_groups,
              'manualCandidates': manual_rows,
              'ruleCoveredButUnreviewed': [
                  {
                      'reviewTargetId': row['reviewTargetId'],
                      'canonicalEnglishName': row['canonicalEnglishName'],
                      'matchedRuleId': row.get('matchedRuleId'),
                      'usageCount': usage(row),
                  }
                  for row in rule_unreviewed
              ],
          }
          Path('.batch41-discovery.json').write_text(
              json.dumps(out, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'sourceHistoricalCommit': out['sourceHistoricalCommit'],
              'sourceHistoricalPath': out['sourceHistoricalPath'],
              'sourceEvidenceRawSha256': raw_sha,
              'sourceEvidenceSha256': expected_source_sha,
              'classifierSummary': summary,
              'counts': out['counts'],
              'topRepeatedFdcGroups': repeated_top_fdc[:20],
              'topManualCandidates': manual_rows[:30],
          }, indent=2, ensure_ascii=False))
          PY
      - name: Commit discovery artifact
        run: |
          git add .batch41-discovery.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Batch 41 nutrition discovery' || exit 0
          git push origin HEAD:cook4me-nutrition-batch41-discovery-v60
