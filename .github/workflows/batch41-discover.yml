name: Export Batch 41 reviewed corpus

on:
  push:
    branches:
      - cook4me-nutrition-batch41-discovery-v60
    paths:
      - '.github/workflows/batch41-discover.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact current reviewed corpus
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import sys

          root = Path.cwd()
          tools = root / 'tools'
          sys.path.insert(0, str(tools))
          import nutrition_review_holds_v60 as holds
          import snapshot_nutrition_review_checkpoint_v60 as checkpoint

          cp = checkpoint.build_checkpoint(tools)
          hold_doc = holds.load_holds()
          blocker_path = tools / 'release_catalog_nutrition_review_blockers.v1.json'
          blocker_doc, blocker_sha = checkpoint._read(blocker_path)
          out = {
              'schemaVersion': 1,
              'kind': 'cook4me-batch41-current-reviewed-corpus-v60',
              'sourceCommit': cp['sourceCommit'],
              'checkpointSummary': cp['summary'],
              'reviewFilesSha256': cp['reviewFilesSha256'],
              'recordedBindingsSha256': cp['recordedBindingsSha256'],
              'recordedBindings': cp['recordedBindings'],
              'heldReviewTargetIds': sorted(hold_doc['targets']),
              'blockerLedgerSha256': blocker_sha,
              'blockers': blocker_doc.get('items', []),
          }
          Path('batch41-reviewed-corpus.json').write_text(
              json.dumps(out, sort_keys=True, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          print(f"recorded={len(out['recordedBindings'])}")
          print(f"held={len(out['heldReviewTargetIds'])}")
          print(f"blockers={len(out['blockers'])}")
          print(f"recorded_bindings_sha256={out['recordedBindingsSha256']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch41-reviewed-corpus
          path: batch41-reviewed-corpus.json
          if-no-files-found: error
          retention-days: 1
