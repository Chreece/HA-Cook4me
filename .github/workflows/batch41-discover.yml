name: Export Batch 41 recorded IDs

on:
  push:
    branches:
      - cook4me-nutrition-batch41-discovery-v60
    paths:
      - '.github/workflows/batch41-discover.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: cook4me-nutrition-batch41-discovery-v60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export exact recorded target IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          root = Path.cwd()
          tools = root / 'tools'
          sys.path.insert(0, str(tools))
          import snapshot_nutrition_review_checkpoint_v60 as checkpoint
          cp = checkpoint.build_checkpoint(tools)
          ids = sorted({row['reviewTargetId'] for row in cp['recordedBindings']})
          Path('.batch41-recorded-ids.txt').write_text('\n'.join(ids) + '\n', encoding='utf-8')
          print(f'recorded_ids={len(ids)}')
          print(f'recorded_bindings_sha256={cp["recordedBindingsSha256"]}')
          PY
      - name: Commit ID receipt
        run: |
          git add .batch41-recorded-ids.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Export Batch 41 recorded target IDs' || exit 0
          git push origin "HEAD:$BRANCH"
