name: Chunk Batch 41 recorded IDs

on:
  push:
    branches:
      - cook4me-nutrition-batch41-discovery-v60
    paths:
      - '.github/workflows/batch41-discover.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: cook4me-nutrition-batch41-discovery-v60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export exact recorded IDs in bounded chunks
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import sys

          root = Path.cwd()
          tools = root / 'tools'
          sys.path.insert(0, str(tools))
          import snapshot_nutrition_review_checkpoint_v60 as checkpoint

          cp = checkpoint.build_checkpoint(tools)
          ids = sorted({row['reviewTargetId'] for row in cp['recordedBindings']})
          out = Path('.batch41-recorded')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()
          size = 500
          for index in range(0, len(ids), size):
              part = ids[index:index + size]
              (out / f'part-{index // size:03d}.txt').write_text(
                  '\n'.join(part) + '\n', encoding='utf-8')
          print(f'recorded_ids={len(ids)}')
          print(f'parts={(len(ids) + size - 1) // size}')
          print(f'recorded_bindings_sha256={cp["recordedBindingsSha256"]}')
          PY
      - name: Commit bounded receipts
        run: |
          rm -f .batch41-recorded-ids.txt
          git add -A .batch41-recorded .batch41-recorded-ids.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Chunk Batch 41 recorded target IDs' || exit 0
          git push origin "HEAD:$BRANCH"
