name: Scan remaining catalog title candidates v59

on:
  push:
    branches:
      - cook4me/catalog-it-title-probe-v59
    paths:
      - .github/workflows/catalog-title-candidate-scan-v59.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  title-candidate-scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install standalone catalog requirements
        run: python -m pip install --disable-pip-version-check 'curl-cffi==0.13.0' 'websocket-client==1.8.0'
      - name: Scan live provider search catalogs
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import re
          import time
          import unicodedata
          from collections import defaultdict
          from pathlib import Path
          import tools.crawl_release_catalog_v2 as crawler

          def text(value):
              return re.sub(r'\s+', ' ', str(value or '').strip())

          def norm(value):
              return re.sub(r'\s+', ' ', unicodedata.normalize('NFKC', text(value))).casefold()

          cfg = crawler.c4m.read_apk_config(None)
          tokens = {}
          pcfg = crawler.catalog._platform_context(cfg, 'DE', 'de', crawler.APP_VERSION)

          def search(language, country):
              last = None
              for attempt in range(1, 4):
                  try:
                      rows = crawler._search_catalog(
                          cfg, tokens, pcfg,
                          language=language,
                          country=country,
                          configured_language='de',
                          configured_country='DE',
                      )
                      return crawler._dedupe_search_rows(rows)[0]
                  except Exception as exc:
                      last = exc
                      print(f'{language}/{country} attempt {attempt}/3 failed: {type(exc).__name__}: {exc}', flush=True)
                      if attempt < 3:
                          time.sleep(attempt * 5)
              raise last

          reviewed = defaultdict(set)
          for path in sorted(Path('tools').glob('release_catalog_reviewed_recipe_titles*.v1.json')):
              value = json.loads(path.read_text(encoding='utf-8'))
              if value.get('kind') != 'cook4me-reviewed-recipe-title-english':
                  continue
              for row in value.get('items') or []:
                  if not isinstance(row, dict):
                      continue
                  language = text(row.get('language')).lower()
                  source = text(row.get('source'))
                  if language and source:
                      reviewed[language].add(norm(source))

          catalogs = {}
          for language, country in crawler.AUDITED_CATALOGS:
              print(f'[candidate-search] {language}/GS_{country}', flush=True)
              catalogs[language] = search(language, country)

          english_groups = {
              text(row.get('groupingFunctionalId'))
              for row in catalogs.get('en', [])
              if text(row.get('groupingFunctionalId'))
          }

          by_language = {}
          for language, country in crawler.AUDITED_CATALOGS:
              if language == 'en':
                  continue
              candidates = {}
              for row in catalogs.get(language, []):
                  title = text(row.get('title'))
                  if not title or norm(title) in reviewed[language]:
                      continue
                  grouping = text(row.get('groupingFunctionalId'))
                  if grouping and grouping in english_groups:
                      continue
                  key = norm(title)
                  item = candidates.setdefault(key, {
                      'source': title,
                      'variantIds': set(),
                      'groupingFunctionalIds': set(),
                  })
                  variant = text(row.get('variantId'))
                  if variant:
                      item['variantIds'].add(variant)
                  if grouping:
                      item['groupingFunctionalIds'].add(grouping)
              ordered = []
              for key in sorted(candidates, key=lambda k: candidates[k]['source'].casefold()):
                  item = candidates[key]
                  ordered.append({
                      'source': item['source'],
                      'variantIds': sorted(item['variantIds']),
                      'groupingFunctionalIds': sorted(item['groupingFunctionalIds']),
                  })
              by_language[language] = {
                  'country': country,
                  'uniqueSearchVariants': len(catalogs.get(language, [])),
                  'reviewedSourceTitles': len(reviewed[language]),
                  'candidateTitles': len(ordered),
                  'items': ordered[:100],
              }

          payload = {
              'schemaVersion': 1,
              'kind': 'cook4me-search-title-candidate-scan-v59',
              'providerSecretsUsed': False,
              'searchOnlyEvidence': True,
              'mustMatchAuthoritativeQueueBeforeMerge': True,
              'englishUniqueSearchVariants': len(catalogs.get('en', [])),
              'candidateCounts': {
                  language: data['candidateTitles']
                  for language, data in by_language.items()
                  if data['candidateTitles']
              },
              'languages': by_language,
          }
          Path('tools/release_catalog_pending_title_search_scan_v59.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'englishUniqueSearchVariants': payload['englishUniqueSearchVariants'],
              'candidateCounts': payload['candidateCounts'],
          }, ensure_ascii=False), flush=True)
          PY
      - name: Commit evidence-only title scan
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/release_catalog_pending_title_search_scan_v59.json
          git diff --cached --check
          git commit -m "Snapshot remaining catalog title search candidates v59"
          git push origin HEAD:cook4me/catalog-it-title-probe-v59
