name: Validate

on:
  push:
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Minimal source validation
        run: |
          python scripts/version.py validate
          python -m compileall -q custom_components/cook4me
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("custom_components/cook4me/manifest.json").read_text())
          print("manifest JSON OK")
          PY
          python tools/build_frontend_bundle_v125.py --check
          node --check custom_components/cook4me/frontend/cook4me-panel-v125.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v125-bundle.js
          python tests/test_filter_footer_v125.py
