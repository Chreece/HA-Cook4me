name: Validate

on:
  push:
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Minimal source validation
        run: |
          python scripts/version.py validate
          python -m compileall -q custom_components/cook4me
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("custom_components/cook4me/manifest.json").read_text())
          print("manifest JSON OK")
          PY
          python tools/build_frontend_bundle_v126.py --check
          node --check custom_components/cook4me/frontend/cook4me-panel-v126.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v126-bundle.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v127.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v128.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v129.js
          python tests/test_menu_footer_v126.py
          python tests/test_announcement_settings_v127.py
          python tests/test_nutrient_scopes_v128.py
          python tests/test_delivery_queue_v129.py
