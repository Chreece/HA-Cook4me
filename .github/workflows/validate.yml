name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate version, JSON, Python, and frontend syntax
        run: |
          python scripts/version.py validate
          python -m compileall -q custom_components/cook4me tests
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('JSON OK')
          PY
          node --check custom_components/cook4me/frontend/cook4me-panel-v3.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v4.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v5.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v6.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v7.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v8.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v9.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v10.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v11.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v12.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v13.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v14.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v15.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v16.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v17.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v18.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v19.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v20.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v21.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v22.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v23.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v24.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v25.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v26.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v27.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v28.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v29.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v30.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v31.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v32.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v33.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v34.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v35.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v36.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v37.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v38.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v39.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v40.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v41.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v42.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v43.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v44.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v45.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v46.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v47.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v48.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v49.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v50.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v51.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v52.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v53.js
      - name: Instantiate Recipe Hub in a DOM runtime
        run: |
          npm install --no-save --package-lock=false linkedom@0.18.12
          node --experimental-default-type=module tests/frontend_panel_smoke.mjs
          node --experimental-default-type=module tests/frontend_menu_smoke.mjs
          timeout 15s node --experimental-default-type=module tests/frontend_startup_stability_smoke.mjs
          timeout 15s node --experimental-default-type=module tests/frontend_orchestration_smoke.mjs
          timeout 15s node --experimental-default-type=module tests/frontend_lazy_startup_contract_smoke.mjs
      - name: Run focused tests
        run: python -m unittest discover -s tests -v
