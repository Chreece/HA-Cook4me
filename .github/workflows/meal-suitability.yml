name: Automatic meal suitability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: meal-suitability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suitability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Meal eligibility and current shipped catalog
        run: python tests/test_meal_suitability_v206.py
      - name: Actual generator, replacements and search boundaries
        run: python tests/test_meal_selection_routes_v206.py
      - name: Vegetarian fish substitutions stay complete and visible
        run: |
          python tests/test_diet_substitution_guard_v250.py
          node tests/test_diet_substitution_guard_v250.mjs
      - name: All restricted diets receive complete replacements
        run: |
          python tests/test_all_diet_substitutions_v251.py
          node tests/test_all_diet_substitutions_v251.mjs
      - name: Catalog-owned multi-candidate substitutions
        run: |
          python tests/test_catalog_owned_substitutions_v253.py
          node tests/test_catalog_owned_substitutions_v253.mjs
      - name: Allergy-aware catalog substitutions
        run: |
          python tests/test_allergy_catalog_substitutions_v254.py
          node tests/test_allergy_catalog_substitutions_v254.mjs
      - name: Ingredient substitution metadata audit
        run: python tests/audit_ingredient_substitution_metadata_v253.py
      - name: Generate exact substitution binding proposals
        run: |
          python tools/generate_provider_substitution_bindings_v258.py \
            --output "$RUNNER_TEMP/provider-substitution-bindings-v258.json"
          python tools/generate_concept_substitution_bindings_v258.py \
            --output "$RUNNER_TEMP/concept-substitution-bindings-v258.json"
      - name: Upload exact substitution binding proposals
        uses: actions/upload-artifact@v4
        with:
          name: substitution-bindings-v258
          path: |
            ${{ runner.temp }}/provider-substitution-bindings-v258.json
            ${{ runner.temp }}/concept-substitution-bindings-v258.json
          if-no-files-found: error
          retention-days: 3
      - name: Catalog-wide unresolved diet substitution audit
        run: python tests/audit_diet_substitution_catalog_v252.py
      - name: Retained progress, cancellation and variety
        run: |
          python tests/test_week_progress_v200.py
          python tests/test_weekly_responsive_variety_v181.py
      - name: Source syntax
        run: python -m compileall -q custom_components/cook4me
