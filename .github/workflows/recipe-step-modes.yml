name: Recipe step cooking modes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: step-modes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  step-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source program evidence and translations
        run: python tests/test_recipe_step_modes_v204.py
      - name: Step mode localization
        run: node --test tests/test_recipe_step_modes_v204.mjs
      - name: Browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Current full frontend and original step handlers
        run: python tests/browser_recipe_step_modes_v204.py --full-chain
      - name: Syntax
        run: |
          python -m compileall -q custom_components/cook4me
          node --check custom_components/cook4me/frontend/recipe-step-modes-v204.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v180.js
