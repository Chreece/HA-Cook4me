name: Weekly generation progress

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: weekly-progress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  weekly-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker cancellation and empty-week generation
        run: python tests/test_week_progress_v200.py
      - name: Stage counters and honest time estimates
        run: node --test tests/test_week_progress_v200.mjs
      - name: Browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Mobile and desktop progress card
        run: python tests/browser_week_progress_v200.py
      - name: Source syntax
        run: |
          python -m compileall -q custom_components/cook4me
          node --check custom_components/cook4me/frontend/weekly-progress-v200.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v180.js
