name: Catalog maintenance smoke

on:
  push:
    branches:
      - cook4me-release-catalog-cache-progress-v59
    paths:
      - .github/workflows/catalog-maintenance-smoke.yml
      - tools/crawl_release_catalog_v2.py
      - custom_components/cook4me/vendor/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tokenless-catalog-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install standalone catalog requirements
        run: python -m pip install --disable-pip-version-check 'curl-cffi==0.13.0' 'websocket-client==1.8.0'
      - name: Probe one catalog and one detail without provider tokens
        run: |
          mkdir -p "$RUNNER_TEMP/cook4me-empty-home"
          python tools/crawl_release_catalog_v2.py \
            --storage-home "$RUNNER_TEMP/cook4me-empty-home" \
            --cache-db "$RUNNER_TEMP/cook4me-smoke.sqlite3" \
            --output "$RUNNER_TEMP/cook4me-smoke.json.gz" \
            --failures "$RUNNER_TEMP/cook4me-smoke-failures.json" \
            --configured-language de \
            --configured-country DE \
            --workers 1 \
            --max-catalogs 1 \
            --max-variants-per-catalog 1 \
            --verbose
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook4me-tokenless-catalog-smoke
          path: |
            ${{ runner.temp }}/cook4me-smoke.json.gz
            ${{ runner.temp }}/cook4me-smoke-failures.json
          if-no-files-found: warn
