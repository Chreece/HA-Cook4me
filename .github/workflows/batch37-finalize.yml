name: Finalize and validate Batch 37

on:
  pull_request:
    paths:
      - '.batch37-bootstrap/**'
      - '.github/workflows/batch37-*.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: batch37-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hydrate any missing verified transport blobs
        if: hashFiles('.batch37-bootstrap/materialize.py') != ''
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request, hashlib
          blobs = {
            'chunk-002':'0519daf9bd27efbd2f147eabaf15b56983284a1c','chunk-003':'c3f8bc89797983f2011a7c6c6cb0f985663a4cb6','chunk-004':'5c98764d7715643da8d8ea548cf30756b65bdc8a','chunk-005':'8b7d06679952563ac723ca0536ac518a97927ba1','chunk-006':'b76f00702331b6fc79749de2c2f473902ee40caf','chunk-007':'073ff065a22fa1865c1eade4e78f08c00436238a','chunk-008':'3a84373089ecbd4fc2e3a8755b408db3250e423b','chunk-009':'47b108dfa308831dbaf975d1ef5b6645611e8375','chunk-010':'4965d818ff16ff554b4b7fce9e7f87b0d7baa367','chunk-011':'0251c1e3eabada5147397ccf02d3232b67ecc074','chunk-012':'d96d19b23da962b06560873d545d0b5144ed5ffa','chunk-013':'4407570cf7cf8c2cf601dc7c7d1154458727ebb4','chunk-014':'939b8d44399a8ed4468c0206c2a8dd72670159c2','chunk-015-0':'60d08fb7a75fdfdd6249bfb8f12dbb3604ae341a','chunk-015-1':'2bc29ca2e8e91ae19898196ae3d9ef40c451e28c','chunk-015-2':'b4aee815ae401c8a44cc5c9e0b42cd46c646eba3','chunk-016-0':'d32f85f9713e3f6472aa088a327a7a5e77a37172','chunk-016-1':'806c4f7945472977d77c10aceb29a314930c67d1','chunk-016-2':'f8b0b7f45999bd7623fc4a1d22abe2d7d1250944','chunk-017-0':'bb1f049fd7b64a9ca91cfb471e2fe9c13a16fc11','chunk-017-1':'920b63c0b4c7746c81353fffc4c0ab6eaf9d4ab2'}
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; out=pathlib.Path('.batch37-bootstrap/chunks'); out.mkdir(parents=True,exist_ok=True)
          for name,sha in blobs.items():
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as resp: data=json.load(resp)
              raw=base64.b64decode(data['content']); actual=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
              if actual!=sha: raise SystemExit(f'blob hash mismatch {name}: {actual} != {sha}')
              (out/name).write_bytes(raw)
          PY
          python .batch37-bootstrap/materialize.py
      - name: Confirm materialized Batch 37 source exists
        run: |
          test -f tools/release_catalog_reviewed_nutrition_targets_041.v1.json
          test -f tools/release_catalog_reviewed_nutrition_targets_041f.v1.json
          test -f tools/release_catalog_nutrition_bulk_family_rules.v1.json
          test -f tools/classify_nutrition_review_queue_v60.py
          test -f tests/test_release_catalog_nutrition_review_batch37_v60.py
      - name: Validate exact materialized source
        run: |
          export TMPDIR="$RUNNER_TEMP"
          python -m compileall -q custom_components tools tests
          find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n
          find custom_components -name '*.js' -print0 | xargs -0 -r -n1 node --check
          python -m unittest discover -s tests -v
      - name: Remove transport, commit exact reviewed source, and push
        run: |
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$HEAD_BRANCH)" || { echo 'Branch advanced; newer synchronize run will finalize it'; exit 78; }
          rm -rf .batch37-bootstrap .github/workflows/batch37-materialize.yml .github/workflows/batch37-hydrate.yml .github/workflows/batch37-finalize.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && { echo 'No finalization changes'; exit 1; }
          git commit -m 'Materialize and validate Batch 37 bulk nutrition reviews'
          git push origin "HEAD:$HEAD_BRANCH"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Merge exact validated PR head
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; pr=os.environ['PR_NUMBER']; sha=os.environ['FINAL_SHA']; token=os.environ['GH_TOKEN']
          body=json.dumps({'sha':sha,'merge_method':'merge','commit_title':'Merge Batch 37 bulk deterministic nutrition reviews'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/pulls/{pr}/merge',data=body,method='PUT',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as resp: data=json.load(resp)
          if not data.get('merged'): raise SystemExit(f'merge failed: {data}')
          print(f"merged {pr} at validated head {sha}: {data.get('sha')}")
          PY
