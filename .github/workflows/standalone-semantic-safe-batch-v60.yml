name: Merge safe standalone ingredient semantics v60

on:
  push:
    branches:
      - cook4me-ingredient-semantic-confirmation-v60
    paths:
      - '.github/workflows/standalone-semantic-safe-batch-v60.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-safe-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile baseline semantics
        run: |
          set -Eeuo pipefail
          python tools/compile_release_catalog_semantics_v60.py \
            --reviews-dir tools \
            --output "$RUNNER_TEMP/semantic-before.json" \
            > "$RUNNER_TEMP/semantic-before-summary.json"

      - name: Apply evidence-pinned safe merge batch
        run: |
          set -Eeuo pipefail
          python tools/apply_safe_standalone_semantic_batch_v60.py
          git diff --check

      - name: Run semantic regressions
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_compile_release_catalog_semantics_v60.py'
          python -m unittest discover -s tests -p 'test_semantic_standalone_dispositions_v60.py'

      - name: Prove exact semantic delta
        run: |
          set -Eeuo pipefail
          python tools/compile_release_catalog_semantics_v60.py \
            --reviews-dir tools \
            --output "$RUNNER_TEMP/semantic-after.json" \
            > "$RUNNER_TEMP/semantic-after-summary.json"
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          before = json.loads(Path(os.environ['RUNNER_TEMP'], 'semantic-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path(os.environ['RUNNER_TEMP'], 'semantic-after.json').read_text(encoding='utf-8'))

          helper_path = root / 'tools/apply_safe_standalone_semantic_batch_v60.py'
          spec = importlib.util.spec_from_file_location('cook4me_safe_semantic_batch_check', helper_path)
          helper = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(helper)
          decisions = helper.DECISIONS
          expected_delta = len(decisions)
          if expected_delta != 19:
              raise SystemExit(f'unexpected decision count: {expected_delta}')

          before_summary = before['summary']
          after_summary = after['summary']
          if before_summary['needsSemanticConfirmationSourceLabels'] != 0:
              raise SystemExit('baseline semantic closure was not zero-pending')
          if after_summary['needsSemanticConfirmationSourceLabels'] != 0:
              raise SystemExit('safe merge batch reopened semantic pending work')
          if (
              before_summary['standaloneConfirmedSourceLabels']
              - after_summary['standaloneConfirmedSourceLabels']
              != expected_delta
          ):
              raise SystemExit('standalone decrement is not exactly the reviewed batch size')
          if (
              after_summary['semanticEquivalentConfirmedSourceLabels']
              - before_summary['semanticEquivalentConfirmedSourceLabels']
              != expected_delta
          ):
              raise SystemExit('manual semantic-equivalence increment mismatch')
          if (
              before_summary['semanticConcepts']
              - after_summary['semanticConcepts']
              != expected_delta
          ):
              raise SystemExit('semantic concept consolidation count mismatch')
          if after_summary['reviewedAmbiguousSourceLabels'] != before_summary['reviewedAmbiguousSourceLabels']:
              raise SystemExit('ambiguous reviewed closure count changed')

          mapping = after['sourceIdentityToConcept']
          standalone = json.loads(
              (root / 'tools/release_catalog_semantic_standalone_dispositions.v1.json').read_text(encoding='utf-8')
          )
          standalone_ids = {
              row['sourceIngredientId'] for row in standalone.get('items') or []
              if isinstance(row, dict)
          }
          confirmations = json.loads(
              (root / 'tools/release_catalog_semantic_confirmations.v1.json').read_text(encoding='utf-8')
          )
          confirmation_rows = {
              row['sourceIngredientId']: row for row in confirmations.get('items') or []
              if isinstance(row, dict) and row.get('sourceIngredientId')
          }
          for decision in decisions:
              source_id = decision['sourceIngredientId']
              if source_id in standalone_ids:
                  raise SystemExit(f'merged source still exists in standalone ledger: {source_id}')
              if mapping.get(source_id) != decision['confirmedConceptId']:
                  raise SystemExit(f'merged source mapped to wrong concept: {source_id}')
              row = confirmation_rows.get(source_id)
              if not row or row.get('manualSemanticEquivalence') is not True:
                  raise SystemExit(f'manual semantic-equivalence receipt missing: {source_id}')
              if row.get('sourceReviewedEnglish') != decision['sourceReviewedEnglish']:
                  raise SystemExit(f'source English receipt drift: {source_id}')
              if row.get('targetCanonicalEnglish') != decision['targetCanonicalEnglish']:
                  raise SystemExit(f'target English receipt drift: {source_id}')

          print(json.dumps({
              'mergedFromStandalone': expected_delta,
              'standaloneBefore': before_summary['standaloneConfirmedSourceLabels'],
              'standaloneAfter': after_summary['standaloneConfirmedSourceLabels'],
              'semanticEquivalenceBefore': before_summary['semanticEquivalentConfirmedSourceLabels'],
              'semanticEquivalenceAfter': after_summary['semanticEquivalentConfirmedSourceLabels'],
              'semanticConceptsBefore': before_summary['semanticConcepts'],
              'semanticConceptsAfter': after_summary['semanticConcepts'],
              'pendingAfter': after_summary['needsSemanticConfirmationSourceLabels'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit validated semantic merges
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/release_catalog_semantic_confirmations.v1.json \
            tools/release_catalog_semantic_standalone_dispositions.v1.json \
            tests/test_semantic_standalone_dispositions_v60.py
          git diff --cached --check
          git commit -m 'Merge first safe standalone ingredient semantics v60'
          git push origin HEAD:cook4me-ingredient-semantic-confirmation-v60
