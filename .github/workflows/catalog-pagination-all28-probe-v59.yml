name: Catalog pagination all-28 probe v59

on:
  push:
    branches:
      - cook4me-catalog-pagination-probe-v59
    paths:
      - .github/workflows/catalog-pagination-all28-probe-v59.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'curl-cffi==0.13.0' 'websocket-client==1.8.0'
      - name: Prove single-page stability across all 28 catalog mappings
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path('.').resolve()
          for path in (root / 'tools', root / 'custom_components' / 'cook4me', root / 'custom_components' / 'cook4me' / 'vendor'):
              sys.path.insert(0, str(path))
          import crawl_release_catalog_v2 as cr
          import cook4me_phonefree as c4m
          import cook4me_recipe_catalog as catalog

          cfg = c4m.read_apk_config(None)
          pcfg = catalog._platform_context(cfg, 'DE', 'de', cr.APP_VERSION)
          url = cfg['platform_base_url'].rstrip('/') + '/common-api/v4/search/recipes'
          result = {'schema':1,'kind':'cook4me-recipe-search-single-page-all28-proof-v59','credentialsUsed':False,'requestedSize':5000,'catalogs':[]}
          failures = []
          for language, country in cr.AUDITED_CATALOGS:
              market = f'GS_{country}'
              repeats = []
              for repeat in range(2):
                  payload, auth = catalog._http_json(
                      'POST', url,
                      headers_iter=cr._headers(cfg, {}, 'DE', 'de', url, pcfg),
                      params={'lang':language,'market':market,'page':0,'size':5000,'q':'','groupBy':'','myUniverse':'false','myOwnRecipe':'false','withAutomaticSpellcheck':'true'},
                      body=cr._search_body(language, market), timeout=30,
                  )
                  content = payload.get('content') if isinstance(payload, dict) and isinstance(payload.get('content'), list) else []
                  ids = []
                  for raw in content:
                      if not isinstance(raw, dict):
                          continue
                      ident = raw.get('identifier') if isinstance(raw.get('identifier'), dict) else {}
                      fid = cr._fid(ident) or cr._fid(raw.get('fid')) or cr._fid(raw.get('functionalId'))
                      if fid:
                          ids.append(fid)
                  page = payload.get('page') if isinstance(payload, dict) and isinstance(payload.get('page'), dict) else {}
                  total = int(page.get('totalElements') or 0)
                  pages = int(page.get('totalPages') or 0)
                  row = {
                      'repeat': repeat + 1, 'authMode': auth,
                      'contentRows': len(content), 'validIdRows': len(ids),
                      'uniqueFunctionalIds': len(set(ids)),
                      'totalElements': total, 'totalPages': pages,
                      'idSetSha256': hashlib.sha256('\n'.join(sorted(set(ids))).encode()).hexdigest(),
                  }
                  repeats.append(row)
              stable = repeats[0]['idSetSha256'] == repeats[1]['idSetSha256'] and repeats[0]['contentRows'] == repeats[1]['contentRows']
              complete = all(r['totalPages'] <= 1 and r['contentRows'] == r['totalElements'] and r['validIdRows'] == r['contentRows'] and r['uniqueFunctionalIds'] == r['contentRows'] for r in repeats)
              entry = {'language':language,'market':market,'stable':stable,'completeSinglePage':complete,'repeats':repeats}
              result['catalogs'].append(entry)
              if not stable or not complete:
                  failures.append(entry)
              print(f"{language}/{market} rows={repeats[0]['contentRows']} stable={stable} complete={complete}")
          result['all28Stable'] = not failures
          result['failureCount'] = len(failures)
          Path('tools/catalog_pagination_all28_probe_v59.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if failures:
              raise SystemExit(f'all-28 single-page proof failed for {len(failures)} mappings')
          PY
      - name: Commit all-28 pagination evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog_pagination_all28_probe_v59.json
          git diff --cached --check
          git commit -m "Prove single-page recipe search across all 28 catalogs"
          git push origin HEAD:cook4me-catalog-pagination-probe-v59
