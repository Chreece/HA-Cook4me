name: Temporary batch 21 materialize
on:
  push:
    branches:
      - cook4me-nutrition-review-batch21-v60
    paths:
      - .github/workflows/tmp-batch21-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cook4me-nutrition-review-batch21-v60
          fetch-depth: 0
      - name: Materialize frozen batch 21 files
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, tarfile
          payload = """"""
          raw = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as tf:
              tf.extractall(".")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/release_catalog_reviewed_nutrition_targets_027*.v1.json tests/test_release_catalog_nutrition_review_batch21_v60.py
          git diff --cached --quiet || git commit -m "Materialize remaining nutrition review batch 21 files"
          git push origin HEAD:cook4me-nutrition-review-batch21-v60
