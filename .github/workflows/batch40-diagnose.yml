name: Analyze Batch 40 source reconstruction

on:
  pull_request:
    paths:
      - '.github/workflows/batch40-diagnose.yml'

permissions:
  contents: write

jobs:
  analyze:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Infer exact Batch 40 shard construction
        run: |
          python - <<'PY'
          import gzip, json, re
          from pathlib import Path

          root = Path.cwd()
          tools = root / 'tools'
          shard_names = [
            'release_catalog_reviewed_nutrition_targets_044.v1.json',
            'release_catalog_reviewed_nutrition_targets_044b.v1.json',
            'release_catalog_reviewed_nutrition_targets_044c.v1.json',
          ]
          docs = {name: json.loads((tools / name).read_text()) for name in shard_names}
          rules_doc = json.loads((tools / 'release_catalog_nutrition_bulk_family_rules_batch40.v1.json').read_text())
          rules = rules_doc['rules']
          fixture = json.loads(gzip.decompress((root / 'tests/fixtures/nutrition-batch40-retained-reference-v60.json.gz').read_bytes()))
          targets = fixture['targets']
          sources = fixture['sources']
          target_map = {r['reviewTargetId']: r for r in targets}
          source_map = {r['reviewTargetId']: r for r in sources}
          order = [r['reviewTargetId'] for r in targets]
          pos = {rid: i for i, rid in enumerate(order)}

          all_existing = []
          shard_summary = {}
          top_levels = {}
          for name, doc in docs.items():
            ids = [r['reviewTargetId'] for r in doc['items']]
            all_existing += ids
            positions = [pos[i] for i in ids]
            shard_summary[name] = {
              'count': len(ids),
              'positions': positions,
              'contiguous': positions == list(range(min(positions), max(positions) + 1)) if positions else True,
              'first_id': ids[0] if ids else None,
              'last_id': ids[-1] if ids else None,
            }
            top_levels[name] = {k: v for k, v in doc.items() if k != 'items'}

          existing_set = set(all_existing)
          remaining_ids = [rid for rid in order if rid not in existing_set]

          before_contract = set()
          after_contract = set()
          row_keys = set()
          confidence_by_tier = {}
          field_mismatches = []
          joins = []
          for doc in docs.values():
            for row in doc['items']:
              row_keys.update(row)
              confidence_by_tier.setdefault(row['bulkFamilyTier'], set()).add(row['confidence'])
              matched = [r for r in rules if re.match(r['pattern'], row['canonicalEnglishName'], re.I)]
              if len(matched) != 1:
                field_mismatches.append({'id': row['reviewTargetId'], 'problem': f'rule_matches={len(matched)}'})
                continue
              rule = matched[0]
              contract = rule['contract']
              notes = row['notes']
              if contract not in notes:
                field_mismatches.append({'id': row['reviewTargetId'], 'problem': 'contract_missing_from_notes'})
              else:
                pre, post = notes.split(contract, 1)
                pre = pre.replace(row['bulkFamilyRuleId'], '<RULE>').replace(row['bulkFamilyTier'], '<TIER>')
                before_contract.add(pre)
                after_contract.add(post)

              target = target_map[row['reviewTargetId']]
              source = source_map.get(row['sourceEvidenceTargetId'])
              joins.append({
                'reviewTargetId': row['reviewTargetId'],
                'sourceEvidenceTargetId': row['sourceEvidenceTargetId'],
                'source_found': source is not None,
              })
              for key, expected in (
                ('canonicalEnglishName', target.get('canonicalEnglishName')),
                ('usageCountAtReview', target.get('usageCountSum')),
              ):
                if row.get(key) != expected:
                  field_mismatches.append({'id': row['reviewTargetId'], 'field': key, 'row': row.get(key), 'expected': expected})

          sample_existing = docs[shard_names[0]]['items'][0]
          sample_missing_id = remaining_ids[0]
          analysis = {
            'fixture_keys': sorted(fixture),
            'fixture_target_count': len(targets),
            'fixture_source_count': len(sources),
            'fixture_order_first_20': order[:20],
            'target_keys': sorted({k for r in targets for k in r}),
            'source_keys': sorted({k for r in sources for k in r}),
            'shards': shard_summary,
            'existing_count': len(all_existing),
            'existing_unique_count': len(existing_set),
            'remaining_count': len(remaining_ids),
            'remaining_ids': remaining_ids,
            'top_level_documents': top_levels,
            'row_keys': sorted(row_keys),
            'confidence_by_tier': {k: sorted(v) for k, v in confidence_by_tier.items()},
            'normalized_notes_prefixes': sorted(before_contract),
            'notes_suffixes': sorted(after_contract),
            'field_mismatches': field_mismatches,
            'source_join_failures': [j for j in joins if not j['source_found']],
            'sample_existing_row': sample_existing,
            'sample_existing_target': target_map[sample_existing['reviewTargetId']],
            'sample_existing_source': source_map.get(sample_existing['sourceEvidenceTargetId']),
            'sample_missing_target': target_map[sample_missing_id],
            'source_samples': sources[:3],
          }
          Path('.batch40-diagnostic.json').write_text(json.dumps(analysis, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
            'fixture_keys': analysis['fixture_keys'],
            'target_keys': analysis['target_keys'],
            'source_keys': analysis['source_keys'],
            'shards': shard_summary,
            'existing_count': len(all_existing),
            'remaining_count': len(remaining_ids),
            'remaining_ids': remaining_ids,
            'row_keys': sorted(row_keys),
            'confidence_by_tier': analysis['confidence_by_tier'],
            'normalized_notes_prefixes': sorted(before_contract),
            'notes_suffixes': sorted(after_contract),
            'field_mismatches': field_mismatches,
            'source_join_failures': analysis['source_join_failures'],
            'top_level_documents': top_levels,
            'sample_existing_row': sample_existing,
            'sample_existing_target': analysis['sample_existing_target'],
            'sample_existing_source': analysis['sample_existing_source'],
            'sample_missing_target': analysis['sample_missing_target'],
            'source_samples': sources[:3],
          }, indent=2, sort_keys=True))
          PY
      - name: Push reconstruction analysis
        run: |
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$HEAD_BRANCH)" || exit 78
          git add .batch40-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Analyze exact Batch 40 shard construction'
          git push origin "HEAD:$HEAD_BRANCH"
