name: Prove exact Batch 40 remainder contract

on:
  pull_request:
    paths:
      - '.github/workflows/batch40-diagnose.yml'

permissions:
  contents: write

jobs:
  analyze:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Prove remainder ordering and raw JSON layout
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, gzip, hashlib, io, json, re, tarfile
          from pathlib import Path

          root = Path.cwd()
          tools = root / 'tools'
          names = [
              'release_catalog_reviewed_nutrition_targets_044.v1.json',
              'release_catalog_reviewed_nutrition_targets_044b.v1.json',
              'release_catalog_reviewed_nutrition_targets_044c.v1.json',
          ]
          docs = {n: json.loads((tools / n).read_text(encoding='utf-8')) for n in names}
          raw = {n: (tools / n).read_bytes() for n in names}
          fixture = json.loads(gzip.decompress(
              (root / 'tests/fixtures/nutrition-batch40-retained-reference-v60.json.gz').read_bytes()
          ))

          actual_ids = {n: [r['reviewTargetId'] for r in docs[n]['items']] for n in names}
          selected_ids = [t['reviewTargetId'] for t in fixture['targets']]
          first40 = set(actual_ids[names[0]] + actual_ids[names[1]])
          remainder = sorted(rid for rid in selected_ids if rid not in first40)
          partitions = [remainder[i:i+20] for i in range(0, len(remainder), 20)]
          c_exact = partitions[0] == actual_ids[names[2]]

          # Inspect standard-json serialization and source key order for the
          # three intact shards. This tells us how missing shards must be emitted.
          serialization = {}
          for n in names:
              doc = docs[n]
              no_sort = (json.dumps(doc, indent=2) + '\n').encode()
              sorted_all = (json.dumps(doc, indent=2, sort_keys=True) + '\n').encode()
              row_key_orders = []
              for row in doc['items']:
                  keys = list(row)
                  if keys not in row_key_orders:
                      row_key_orders.append(keys)
              receipt_orders = []
              for receipt in doc['referenceReceipts'].values():
                  keys = list(receipt)
                  if keys not in receipt_orders:
                      receipt_orders.append(keys)
              serialization[n] = {
                  'sha256': hashlib.sha256(raw[n]).hexdigest(),
                  'no_sort_sha256': hashlib.sha256(no_sort).hexdigest(),
                  'no_sort_exact': no_sort == raw[n],
                  'sort_all_sha256': hashlib.sha256(sorted_all).hexdigest(),
                  'sort_all_exact': sorted_all == raw[n],
                  'top_key_order': list(doc),
                  'row_key_orders': row_key_orders,
                  'reference_receipt_key_order': list(doc['referenceReceipts']),
                  'receipt_value_key_orders': receipt_orders,
              }

          # Recover the readable prefix of the damaged original 044d and parse
          # complete item objects one at a time. These complete rows are used
          # only as an ordering/layout oracle; regenerated rows still come from
          # the verified fixture/rule/receipt evidence.
          transport_parts = [
              '.batch40-bootstrap/chunks/chunk-000','.batch40-bootstrap/chunks/chunk-001',
              '.batch40-bootstrap/chunks/chunk-002','.batch40-bootstrap/chunks/chunk-004',
              '.batch40-bootstrap/chunks/chunk-005','.batch40-bootstrap/chunks/chunk-006',
              '.batch40-bootstrap/chunks/chunk-007','.batch40-bootstrap/chunks/chunk-008',
              '.batch40-bootstrap/chunks/chunk-009','.batch40-bootstrap/chunks/chunk-010',
              '.batch40-bootstrap/chunks/chunk-011','.batch40-bootstrap/chunks/chunk-012',
              '.batch40-bootstrap/chunks/chunk-014','.batch40-bootstrap/chunks/chunk-015',
              '.batch40-bootstrap/repair/part-0','.batch40-bootstrap/repair/part-1',
              '.batch40-bootstrap/repair/part-2','.batch40-bootstrap/repair/part-3',
              '.batch40-bootstrap/repair/part-4','.batch40-bootstrap/repair/part-5',
              '.batch40-bootstrap/chunks/chunk-019',
          ]
          tail_fix = {
              '.batch40-bootstrap/repair/part-2': 'J',
              '.batch40-bootstrap/repair/part-5': 'P',
          }
          encoded = ''.join(
              (root / p).read_text(encoding='ascii') + tail_fix.get(p, '')
              for p in transport_parts
          )
          payload = base64.b64decode(encoded, validate=True)
          damaged_d = b''
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as tf:
              for member in tf.getmembers():
                  if member.name.endswith('release_catalog_reviewed_nutrition_targets_044d.v1.json'):
                      src = tf.extractfile(member)
                      damaged_d = src.read() if src is not None else b''
                      break
          if not damaged_d:
              raise SystemExit('damaged 044d oracle not found')
          damaged_text = damaged_d.decode('utf-8', errors='replace')

          # Top-level key order before the items array.
          prefix = damaged_text.split('"items"', 1)[0]
          damaged_top_keys = re.findall(r'^  "([^"]+)":', prefix, flags=re.M)

          # Decode complete item objects until corruption prevents further JSON.
          decoder = json.JSONDecoder()
          marker = '"items": ['
          cursor = damaged_text.find(marker)
          complete_rows = []
          parse_error = None
          if cursor >= 0:
              cursor += len(marker)
              while cursor < len(damaged_text):
                  while cursor < len(damaged_text) and damaged_text[cursor] in ' \r\n\t,':
                      cursor += 1
                  if cursor >= len(damaged_text) or damaged_text[cursor] == ']':
                      break
                  try:
                      obj, end = decoder.raw_decode(damaged_text, cursor)
                  except json.JSONDecodeError as exc:
                      parse_error = {'pos': exc.pos, 'msg': exc.msg, 'context': damaged_text[max(0, exc.pos-180):exc.pos+180]}
                      break
                  if not isinstance(obj, dict):
                      parse_error = {'pos': cursor, 'msg': f'non-object item {type(obj).__name__}'}
                      break
                  complete_rows.append(obj)
                  cursor = end

          damaged_ids = [r.get('reviewTargetId') for r in complete_rows]
          expected_d = partitions[1]
          expected_e = partitions[2]
          expected_f = partitions[3]
          oracle_prefix_match = damaged_ids == expected_d[:len(damaged_ids)]

          # Test whether intact c and complete damaged-d rows share one raw key layout.
          c_row_orders = [list(r) for r in docs[names[2]]['items']]
          d_row_orders = [list(r) for r in complete_rows]
          row_layout_matches_c = bool(d_row_orders) and all(order == c_row_orders[0] for order in d_row_orders)

          out = {
              'ordering': {
                  'selected_count': len(selected_ids),
                  'special_initial_count': len(first40),
                  'remainder_count': len(remainder),
                  'partition_sizes': [len(x) for x in partitions],
                  'c_equals_sorted_remainder_first20': c_exact,
                  'c_expected': partitions[0],
                  'c_actual': actual_ids[names[2]],
                  'd': expected_d,
                  'e': expected_e,
                  'f': expected_f,
                  'damaged_d_complete_ids': damaged_ids,
                  'damaged_d_is_exact_prefix_of_d': oracle_prefix_match,
              },
              'serialization': serialization,
              'damaged_d_layout': {
                  'byte_len': len(damaged_d),
                  'sha256': hashlib.sha256(damaged_d).hexdigest(),
                  'top_keys_before_items': damaged_top_keys,
                  'complete_row_count': len(complete_rows),
                  'complete_row_key_orders': d_row_orders,
                  'rows_match_c_key_layout': row_layout_matches_c,
                  'parse_error': parse_error,
              },
          }
          Path('.batch40-diagnostic.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, indent=2, sort_keys=True))

          if not c_exact:
              raise SystemExit('044c is not the first sorted remainder shard')
          if not oracle_prefix_match:
              raise SystemExit('damaged 044d does not continue the sorted remainder')
          PY
      - name: Push exact remainder proof
        run: |
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$HEAD_BRANCH)" || exit 78
          git add .batch40-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prove exact Batch 40 remainder contract'
          git push origin "HEAD:$HEAD_BRANCH"
