name: Diagnose Batch 40 transport

on:
  pull_request:
    paths:
      - '.github/workflows/batch40-diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Reconstruct Batch 40 from Git history
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, subprocess, tarfile
          from pathlib import Path

          target_sha = 'b37496856a690426c98e64553a5161998613d1e36aec341d42b07a9c2474bdf8'
          snapshots = {
            'initial_materializer': '4c54d010f2aa579b91c05f78d0f267f524f03da4',
            'anchored_chunks': '7d828e1862b7a1d6908dee2485a649d6684a7dac',
            'persistent_chunks_reader': '88c58f7ecfd209ff30c3350d3e0a8e690bbb218a',
            'assembled_repairs': '598dddc71ed25c4d36405c6a30f35c2fce08a02a',
            'fixed_part1': 'e3e3775d7cbb526c383099b7158f2f35a2b91e5b',
            'fixed_part2': 'bbd3dc477ff9e7baea528cf73dca3f733f8091ff',
            'appended_tail_bytes': '16c28c5538a0fbb4d80f12f5eddb4c9a7d9a3e42',
            'hash_authority': 'fbf91fb1502eb364a659c08d7b89692fe5a024cd',
          }
          expected_names = [
            'docs/nutrition-review-batch40-bulk-families-v60.md',
            'tests/fixtures/nutrition-batch40-retained-reference-v60.json.gz',
            'tests/test_release_catalog_nutrition_review_batch39_v60.py',
            'tests/test_release_catalog_nutrition_review_batch40_v60.py',
            'tools/classify_nutrition_review_queue_v60.py',
            'tools/release_catalog_nutrition_bulk_family_rules_batch40.v1.json',
            'tools/release_catalog_reviewed_nutrition_targets_044.v1.json',
            'tools/release_catalog_reviewed_nutrition_targets_044b.v1.json',
            'tools/release_catalog_reviewed_nutrition_targets_044c.v1.json',
            'tools/release_catalog_reviewed_nutrition_targets_044d.v1.json',
            'tools/release_catalog_reviewed_nutrition_targets_044e.v1.json',
            'tools/release_catalog_reviewed_nutrition_targets_044f.v1.json',
          ]

          def git_bytes(commit, path):
            p = subprocess.run(['git', 'show', f'{commit}:{path}'], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
            return p.stdout if p.returncode == 0 else None

          def inspect_payload(raw):
            info = {'decoded_len': len(raw), 'payload_sha256': hashlib.sha256(raw).hexdigest()}
            try:
              with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tf:
                members = tf.getmembers()
                info['tar_names'] = [m.name for m in members]
                info['tar_name_match'] = info['tar_names'] == expected_names
                info['tar_members'] = []
                for m in members:
                  row = {'name': m.name, 'size': m.size}
                  if m.isfile():
                    src = tf.extractfile(m)
                    if src is not None:
                      row['sha256'] = hashlib.sha256(src.read()).hexdigest()
                  info['tar_members'].append(row)
            except Exception as exc:
              info['tar_error'] = str(exc)
            return info

          out = {'target_payload_sha256': target_sha, 'snapshots': {}}
          exact_sources = []
          for label, commit in snapshots.items():
            row = {'commit': commit, 'chunks': []}
            chunk_data = []
            all_twenty = True
            for i in range(20):
              path = f'.batch40-bootstrap/chunks/chunk-{i:03d}'
              data = git_bytes(commit, path)
              if data is None:
                all_twenty = False
                row['chunks'].append({'name': f'chunk-{i:03d}', 'missing': True})
                continue
              row['chunks'].append({
                'name': f'chunk-{i:03d}',
                'len': len(data),
                'sha256': hashlib.sha256(data).hexdigest(),
                'head': data[:8].decode('ascii', 'replace'),
                'tail': data[-12:].decode('ascii', 'replace'),
              })
              chunk_data.append(data)

            row['all_twenty_chunks'] = all_twenty
            if all_twenty:
              encoded = b''.join(chunk_data)
              row['encoded_len'] = len(encoded)
              row['encoded_sha256'] = hashlib.sha256(encoded).hexdigest()
              try:
                raw = base64.b64decode(encoded, validate=True)
                row['payload'] = inspect_payload(raw)
                if row['payload']['payload_sha256'] == target_sha:
                  exact_sources.append({'label': label, 'commit': commit, 'mode': '20_chunks'})
              except Exception as exc:
                row['decode_error'] = str(exc)

            # Record historical repair pieces too, so we can see exactly when
            # each truncated/corrupt object entered the chain.
            repairs = []
            for i in range(6):
              path = f'.batch40-bootstrap/repair/part-{i}'
              data = git_bytes(commit, path)
              if data is not None:
                repairs.append({
                  'name': f'part-{i}',
                  'len': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'head': data[:8].decode('ascii', 'replace'),
                  'tail': data[-12:].decode('ascii', 'replace'),
                })
            row['repairs'] = repairs
            out['snapshots'][label] = row

          out['exact_sources'] = exact_sources
          Path('.batch40-diagnostic.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
            'target_payload_sha256': target_sha,
            'exact_sources': exact_sources,
            'snapshot_summary': {
              k: {
                'all_twenty_chunks': v['all_twenty_chunks'],
                'encoded_len': v.get('encoded_len'),
                'payload_sha256': v.get('payload', {}).get('payload_sha256'),
                'tar_name_match': v.get('payload', {}).get('tar_name_match'),
                'repair_lengths': [r['len'] for r in v['repairs']],
              }
              for k, v in out['snapshots'].items()
            },
          }, indent=2, sort_keys=True))
          PY
      - name: Push diagnostic only
        run: |
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$HEAD_BRANCH)" || exit 78
          git add .batch40-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Trace Batch 40 payload through Git history'
          git push origin "HEAD:$HEAD_BRANCH"
