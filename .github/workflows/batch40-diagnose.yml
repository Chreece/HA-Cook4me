name: Recover verified Batch 40 source

on:
  pull_request:
    paths:
      - '.github/workflows/batch40-diagnose.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Promote hash-verified Batch 40 members
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile

          root = pathlib.Path.cwd()
          parts = [
            '.batch40-bootstrap/chunks/chunk-000','.batch40-bootstrap/chunks/chunk-001',
            '.batch40-bootstrap/chunks/chunk-002','.batch40-bootstrap/chunks/chunk-004',
            '.batch40-bootstrap/chunks/chunk-005','.batch40-bootstrap/chunks/chunk-006',
            '.batch40-bootstrap/chunks/chunk-007','.batch40-bootstrap/chunks/chunk-008',
            '.batch40-bootstrap/chunks/chunk-009','.batch40-bootstrap/chunks/chunk-010',
            '.batch40-bootstrap/chunks/chunk-011','.batch40-bootstrap/chunks/chunk-012',
            '.batch40-bootstrap/chunks/chunk-014','.batch40-bootstrap/chunks/chunk-015',
            '.batch40-bootstrap/repair/part-0','.batch40-bootstrap/repair/part-1',
            '.batch40-bootstrap/repair/part-2','.batch40-bootstrap/repair/part-3',
            '.batch40-bootstrap/repair/part-4','.batch40-bootstrap/repair/part-5',
            '.batch40-bootstrap/chunks/chunk-019']
          tail_fix = {
            '.batch40-bootstrap/repair/part-2': 'J',
            '.batch40-bootstrap/repair/part-5': 'P',
          }
          expected = {
            'docs/nutrition-review-batch40-bulk-families-v60.md': ('c227c69267cd8b46e6cdbba5d381ae30442ce944bf20357f1c5c3c02a6c07236', 0o644),
            'tests/fixtures/nutrition-batch40-retained-reference-v60.json.gz': ('4d62f672b126228294a07997c3b3db4bf4234f4a4ebfed24033432a8ec4f1e5a', 0o644),
            'tests/test_release_catalog_nutrition_review_batch39_v60.py': ('73ccf64d67b74a08cc38ddf8ea8b13eec53a7072773c18813898fe83de8c7d9f', 0o644),
            'tests/test_release_catalog_nutrition_review_batch40_v60.py': ('6a0d54cef8f45bacef55dd3c43887141e8ec826cceac485a2d47dc29a3713a47', 0o644),
            'tools/classify_nutrition_review_queue_v60.py': ('5a501c7f34fdcad6a3f7c3b9bc4c59f6e0724f8d0b778a152847f9647b96d78b', 0o755),
            'tools/release_catalog_nutrition_bulk_family_rules_batch40.v1.json': ('1f9cc8b052ae8e06ebe22bc26953ea16e159df739e150deb563fa2623ec76ed1', 0o644),
            'tools/release_catalog_reviewed_nutrition_targets_044.v1.json': ('c0f706fd97e750259ba369bcb387074f5e49504fce5e522588c320ddf253b83e', 0o644),
            'tools/release_catalog_reviewed_nutrition_targets_044b.v1.json': ('9f808c7429547f8c5d89cc95edb215ca814641e2f100a8672ddb4fd4e839f6ea', 0o644),
            'tools/release_catalog_reviewed_nutrition_targets_044c.v1.json': ('3878be1b8960f6bb95368996e262365afaf500479f74d7da589fa810c8ac8b0f', 0o644),
          }

          encoded = ''.join((root / p).read_text(encoding='ascii') + tail_fix.get(p, '') for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          promoted = []
          seen = {}
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tf:
            for member in tf.getmembers():
              if not member.isfile() or member.name not in expected:
                continue
              src = tf.extractfile(member)
              if src is None:
                continue
              data = src.read()
              got = hashlib.sha256(data).hexdigest()
              seen[member.name] = got
              want, mode = expected[member.name]
              if got != want:
                raise SystemExit(f'hash mismatch for supposedly verified member {member.name}: {got} != {want}')
              dest = root / member.name
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              os.chmod(dest, mode)
              promoted.append(member.name)

          if promoted != list(expected):
            missing = [p for p in expected if p not in promoted]
            raise SystemExit(f'expected verified members missing: {missing}')

          diagnostic = {
            'recovery': 'verified-prefix-materialization',
            'promoted': promoted,
            'verified_count': len(promoted),
            'source_payload_sha256': hashlib.sha256(raw).hexdigest(),
            'remaining_expected_files': [
              'tools/release_catalog_reviewed_nutrition_targets_044d.v1.json',
              'tools/release_catalog_reviewed_nutrition_targets_044e.v1.json',
              'tools/release_catalog_reviewed_nutrition_targets_044f.v1.json',
            ],
          }
          pathlib.Path('.batch40-diagnostic.json').write_text(json.dumps(diagnostic, indent=2) + '\n')
          print(json.dumps(diagnostic, indent=2))
          PY
      - name: Push verified source prefix
        run: |
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$HEAD_BRANCH)" || exit 78
          git add docs/nutrition-review-batch40-bulk-families-v60.md \
            tests/fixtures/nutrition-batch40-retained-reference-v60.json.gz \
            tests/test_release_catalog_nutrition_review_batch39_v60.py \
            tests/test_release_catalog_nutrition_review_batch40_v60.py \
            tools/classify_nutrition_review_queue_v60.py \
            tools/release_catalog_nutrition_bulk_family_rules_batch40.v1.json \
            tools/release_catalog_reviewed_nutrition_targets_044.v1.json \
            tools/release_catalog_reviewed_nutrition_targets_044b.v1.json \
            tools/release_catalog_reviewed_nutrition_targets_044c.v1.json \
            .batch40-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Recover hash-verified Batch 40 source prefix'
          git push origin "HEAD:$HEAD_BRANCH"
