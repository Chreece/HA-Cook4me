name: Prove Batch 40 shard partition contract

on:
  pull_request:
    paths:
      - '.github/workflows/batch40-diagnose.yml'

permissions:
  contents: write

jobs:
  analyze:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Prove ordering, serialization, and shard metadata
        run: |
          python - <<'PY'
          from __future__ import annotations
          import gzip, hashlib, json
          from pathlib import Path

          root = Path.cwd()
          tools = root / 'tools'
          names = [
            'release_catalog_reviewed_nutrition_targets_044.v1.json',
            'release_catalog_reviewed_nutrition_targets_044b.v1.json',
            'release_catalog_reviewed_nutrition_targets_044c.v1.json',
          ]
          docs = {n: json.loads((tools / n).read_text()) for n in names}
          fixture = json.loads(gzip.decompress((root / 'tests/fixtures/nutrition-batch40-retained-reference-v60.json.gz').read_bytes()))
          target_ids = [t['reviewTargetId'] for t in fixture['targets']]
          sorted_ids = sorted(target_ids)
          actual = {n: [r['reviewTargetId'] for r in docs[n]['items']] for n in names}
          partitions = [sorted_ids[i:i+20] for i in range(0, len(sorted_ids), 20)]

          top = {n: {k: v for k, v in docs[n].items() if k != 'items'} for n in names}
          all_top_keys = sorted(set().union(*(set(x) for x in top.values())))
          top_matrix = {}
          differing_top = {}
          for key in all_top_keys:
            vals = {n: top[n].get(key, '<MISSING>') for n in names}
            top_matrix[key] = vals
            enc = {json.dumps(v, sort_keys=True, ensure_ascii=True) for v in vals.values()}
            if len(enc) > 1:
              differing_top[key] = vals

          reconstruction = {}
          for idx, n in enumerate(names):
            regenerated = dict(top[n])
            regenerated['items'] = docs[n]['items']
            payload = (json.dumps(regenerated, indent=2, sort_keys=True) + '\n').encode()
            original = (tools / n).read_bytes()
            reconstruction[n] = {
              'byte_exact_own_top': payload == original,
              'sha256': hashlib.sha256(payload).hexdigest(),
              'original_sha256': hashlib.sha256(original).hexdigest(),
              'actual_equals_sorted_partition': actual[n] == partitions[idx],
              'actual_ids': actual[n],
              'sorted_partition': partitions[idx],
            }

          # Summarize reference receipt maps rather than dumping every record.
          receipt_summary = {}
          for n in names:
            rr = top[n].get('referenceReceipts', {})
            receipt_summary[n] = {
              'count': len(rr),
              'keys': sorted(rr),
              'sha256': hashlib.sha256((json.dumps(rr, sort_keys=True, separators=(',', ':')) + '\n').encode()).hexdigest(),
            }

          # Look for fields that follow a simple shard-index pattern.
          concise_top = {}
          for n in names:
            concise_top[n] = {
              k: v for k, v in top[n].items()
              if k != 'referenceReceipts'
            }

          out = {
            'sorted_partition_proof': {
              'total': len(sorted_ids),
              'partition_sizes': [len(x) for x in partitions],
              'known_reconstruction': reconstruction,
              'future_partitions': {
                '044d': partitions[3],
                '044e': partitions[4],
                '044f': partitions[5],
              },
            },
            'differing_top_level_fields': differing_top,
            'concise_top_level_docs': concise_top,
            'reference_receipt_summary': receipt_summary,
          }
          Path('.batch40-diagnostic.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
      - name: Push shard-partition proof
        run: |
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$HEAD_BRANCH)" || exit 78
          git add .batch40-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prove Batch 40 shard partition contract'
          git push origin "HEAD:$HEAD_BRANCH"
