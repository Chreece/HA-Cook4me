name: Validate and clean Batch 40 recovery

on:
  pull_request:
    paths:
      - '.github/workflows/batch40-diagnose.yml'

permissions:
  contents: write

concurrency:
  group: batch40-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate recovered Batch 40 source
        run: |
          export TMPDIR="$RUNNER_TEMP"
          python scripts/version.py validate
          python -m compileall -q custom_components/cook4me tests tools
          python - <<'PY'
          import json
          from pathlib import Path

          count = 0
          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts:
                  continue
              json.loads(path.read_text(encoding='utf-8'))
              count += 1
          print(f'JSON OK: {count}')
          PY
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n
          for f in custom_components/cook4me/frontend/cook4me-panel-v*.js; do
            node --check "$f"
          done
          python -m unittest discover -s tests -v
      - name: Remove recovery-only transport and diagnostics
        run: |
          rm -rf .batch40-bootstrap
          rm -f .batch40-diagnostic.json
          rm -f .github/workflows/batch40-finalize.yml
      - name: Push clean validated Batch 40 source
        run: |
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$HEAD_BRANCH)" || { echo 'Branch advanced during validation'; exit 78; }
          git add -A
          git diff --cached --quiet && { echo 'No cleanup changes to commit'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate Batch 40 and remove recovery transport'
          git push origin "HEAD:$HEAD_BRANCH"
