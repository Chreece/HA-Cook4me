name: Catalog global variant-ID guard v59

on:
  push:
    branches:
      - cook4me-catalog-global-id-guard-v59
    paths:
      - .github/workflows/catalog-global-id-guard-v59.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply global variant identity guard
        run: python tools/patch_catalog_global_id_guard_v59.py
      - name: Validate identity guards and catalog boundaries
        run: |
          python -m py_compile \
            tools/crawl_release_catalog_v2.py \
            tools/build_release_catalog.py \
            tests/test_release_catalog_global_variant_guard_v59.py
          python tests/test_release_catalog_global_variant_guard_v59.py
          python tests/test_release_catalog_v2_crawler.py
          python tests/test_v59_architecture_contract.py
          git diff --check
      - name: Commit tested global variant identity guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/crawl_release_catalog_v2.py \
            tools/build_release_catalog.py \
            tests/test_release_catalog_global_variant_guard_v59.py
          git diff --cached --check
          git commit -m "Fail closed on cross-catalog provider variant reuse"
          git push origin HEAD:cook4me-catalog-global-id-guard-v59
