name: Fix reviewed title task removal v59

on:
  push:
    branches:
      - cook4me-release-catalog-cache-progress-v59

permissions:
  contents: write

jobs:
  fix-title-task-removal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply fail-safe task removal fix
        run: python tools/fix_review_title_task_removal_v59.py
      - name: Run review overlay regressions
        run: |
          python -m py_compile tools/apply_release_catalog_reviews_v2.py
          python -m unittest discover -s tests -p 'test_release_catalog_recipe_title_reviews_v59.py' -v
          python -m unittest discover -s tests -p 'test_release_catalog_review_overlay.py' -v
          python -m unittest discover -s tests -p 'test_release_catalog_entry_meal_title_reviews_v59.py' -v
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/apply_release_catalog_reviews_v2.py
          git diff --cached --check
          git commit -m "Preserve unknown recipe title queue tasks"
          git push origin HEAD:cook4me-release-catalog-cache-progress-v59
