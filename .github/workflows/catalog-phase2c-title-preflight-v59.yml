name: Catalog Phase 2C title preflight v59

on:
  push:
    branches:
      - cook4me-catalog-phase2c-title-preflight-v59
    paths:
      - .github/workflows/catalog-phase2c-title-preflight-v59.yml

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'curl-cffi==0.13.0' 'websocket-client==1.8.0'
      - name: Build complete search-manifest title preflight
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import importlib.util
          import json
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          import sys

          root = Path('.').resolve()
          for path in (root / 'tools', root / 'custom_components' / 'cook4me', root / 'custom_components' / 'cook4me' / 'vendor'):
              sys.path.insert(0, str(path))
          import crawl_release_catalog_v2 as cr
          import cook4me_phonefree as c4m
          import cook4me_recipe_catalog as catalog

          spec = importlib.util.spec_from_file_location('review_overlay_preflight', root / 'tools' / 'apply_release_catalog_reviews_v2.py')
          review = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          sys.modules[spec.name] = review
          spec.loader.exec_module(review)
          title_reviews = review._recipe_title_reviews()
          entry_reviews = review._entry_meal_reviews()

          cfg = c4m.read_apk_config(None)
          pcfg = catalog._platform_context(cfg, 'DE', 'de', cr.APP_VERSION)
          rows = []
          catalogs = []
          missing_group = []
          missing_title = []
          for language, country in cr.AUDITED_CATALOGS:
              part = cr._search_catalog(
                  cfg, {}, pcfg,
                  language=language, country=country,
                  configured_language='de', configured_country='DE',
              )
              catalogs.append({'language': language, 'market': f'GS_{country}', 'rows': len(part)})
              for row in part:
                  item = dict(row)
                  item['sourceCatalogLanguage'] = language
                  item['sourceCatalogMarket'] = f'GS_{country}'
                  rows.append(item)
                  if not review._text(item.get('groupingFunctionalId')):
                      missing_group.append(item)
                  if not review._text(item.get('title')):
                      missing_title.append(item)

          # This is deliberately only a preflight. It predicts the detail-based
          # title queue only when search DTOs already expose the exact grouping,
          # title and language needed by the canonical-title algorithm.
          groups = defaultdict(list)
          for row in rows:
              grouping = review._text(row.get('groupingFunctionalId'))
              if not grouping:
                  continue
              groups[grouping].append(row)

          tasks = []
          resolved_official_english = 0
          resolved_entry_review = 0
          resolved_title_review = 0
          for grouping, variants in groups.items():
              variants = sorted(variants, key=lambda r: review._text(r.get('variantId')))
              if any(review._text(r.get('language')).lower() == 'en' and review._text(r.get('title')) for r in variants):
                  resolved_official_english += 1
                  continue
              entry = entry_reviews.get(grouping)
              if entry and review._text(entry.get('englishTitle')):
                  resolved_entry_review += 1
                  continue
              representative = variants[0]
              language = review._text(representative.get('language')).lower()
              source = review._text(representative.get('title'))
              if source and title_reviews.get((language, review._norm(source))):
                  resolved_title_review += 1
                  continue
              tasks.append({
                  'type': 'recipe_title_english',
                  'sourceLanguage': language,
                  'sourceText': source,
                  'groupingFunctionalId': grouping,
                  'representativeVariantId': review._text(representative.get('variantId')),
                  'variantCount': len(variants),
              })

          tasks.sort(key=lambda r: (r['sourceLanguage'], r['sourceText'].casefold(), r['groupingFunctionalId']))
          counts = Counter(r['sourceLanguage'] for r in tasks)
          payload = {
              'schema': 1,
              'kind': 'cook4me-release-catalog-single-page-title-preflight-v59',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'credentialsUsed': False,
              'singlePageSize': cr.PAGE_SIZE,
              'catalogCount': len(catalogs),
              'searchRows': len(rows),
              'groupCount': len(groups),
              'missingGroupingRows': len(missing_group),
              'missingTitleRows': len(missing_title),
              'resolvedByOfficialEnglishSibling': resolved_official_english,
              'resolvedByEntryReview': resolved_entry_review,
              'resolvedByTitleReview': resolved_title_review,
              'predictedTitleTasksRemaining': len(tasks),
              'remainingByLanguage': dict(sorted(counts.items())),
              'catalogs': catalogs,
              'tasks': tasks,
          }
          Path('tools/release_catalog_title_preflight_single_page_v59.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({k: payload[k] for k in ('searchRows','groupCount','missingGroupingRows','missingTitleRows','predictedTitleTasksRemaining','remainingByLanguage')}, ensure_ascii=False))
          PY
      - name: Commit preflight evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/release_catalog_title_preflight_single_page_v59.json
          git diff --cached --check
          git commit -m "Preflight complete single-page recipe title coverage"
          git push origin HEAD:cook4me-catalog-phase2c-title-preflight-v59
