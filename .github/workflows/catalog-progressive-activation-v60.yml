name: Build progressive multilingual catalog v60

on:
  push:
    branches:
      - cook4me-progressive-catalog-activation-v60
    paths:
      - .github/workflows/catalog-progressive-activation-v60.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-progressive-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install standalone catalog requirements
        run: python -m pip install --disable-pip-version-check 'curl-cffi==0.13.0' 'websocket-client==1.8.0'
      - name: Capture all audited catalogs once with progressive nutrition
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-v60"
          HOME_EMPTY="$RUNNER_TEMP/cook4me-empty-home"
          mkdir -p "$BUILD" "$HOME_EMPTY"
          python tools/run_release_catalog_v60_capture_once.py \
            --catalog-version "2026-09-14-v60-progressive" \
            --storage-home "$HOME_EMPTY" \
            --configured-language de \
            --configured-country DE \
            --workers 8 \
            --build-dir "$BUILD" \
            --nutrition-cache "$BUILD/fdc-nutrition-reviewed-v60.json" \
            --review-root tools
      - name: Independently validate progressive candidate
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-v60"
          python tools/validate_release_catalog_v60.py "$BUILD/candidate-catalog.v60.json" \
            | tee "$BUILD/validation.v60.json"
      - name: Prove all-language search and record Greek risotto result
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-v60"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'cook4me-progressive-v60'
          component = Path.cwd() / 'custom_components' / 'cook4me'
          sys.path.insert(0, str(component))
          import catalog_search_index as search

          payload = json.loads((root / 'candidate-catalog.v60.json').read_text(encoding='utf-8'))
          prepared = search.prepare_search_index(payload.get('searchIndex') or {})

          def query(value):
              result = search.search_index(
                  prepared,
                  value,
                  language='el',
                  strict_language=False,
                  page=0,
                  size=20,
              )
              samples = []
              recipes = payload.get('recipes') or []
              for index in result.get('indices') or []:
                  if not isinstance(index, int) or not (0 <= index < len(recipes)):
                      continue
                  recipe = recipes[index] if isinstance(recipes[index], dict) else {}
                  variants = []
                  for variant in recipe.get('variants') or []:
                      if not isinstance(variant, dict):
                          continue
                      variants.append({
                          'language': variant.get('language') or variant.get('originalLanguage'),
                          'title': variant.get('title') or variant.get('originalTitle'),
                          'variantId': variant.get('variantId') or variant.get('recipeFunctionalId'),
                      })
                  samples.append({
                      'recipeIndex': index,
                      'canonicalEnglish': recipe.get('canonicalEnglish') or recipe.get('canonicalName') or recipe.get('title'),
                      'variants': variants[:12],
                  })
              return {
                  'query': value,
                  'total': int(result.get('total') or 0),
                  'samples': samples,
              }

          source = payload.get('source') if isinstance(payload.get('source'), dict) else {}
          summary = {
              'catalogVersion': payload.get('catalogVersion'),
              'complete': payload.get('complete') is True,
              'recipes': len(payload.get('recipes') or []),
              'ingredients': len(payload.get('ingredients') or []),
              'auditedCatalogCount': int(source.get('auditedCatalogCount') or 0),
              'sourceCatalogCount': int(source.get('sourceCatalogCount') or 0),
              'nutritionRequiredForComplete': source.get('nutritionRequiredForComplete'),
              'reviewedNutritionResolvedCount': int(source.get('reviewedNutritionResolvedCount') or 0),
              'reviewedNutritionRequiredCount': int(source.get('reviewedNutritionRequiredCount') or 0),
              'recipeVariantNutritionFullyCoveredCount': int(source.get('recipeVariantNutritionFullyCoveredCount') or 0),
              'ingredientIntelligenceComplete': source.get('ingredientIntelligenceComplete') is True,
              'dietAllergyIntelligenceComplete': source.get('dietAllergyIntelligenceComplete') is True,
              'searchIndexStats': (payload.get('searchIndex') or {}).get('stats') or {},
              'greekRisotto': query('ριζότο'),
              'latinRisotto': query('risotto'),
          }
          (root / 'progressive-catalog-summary.v60.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not summary['complete']:
              raise SystemExit('progressive catalog is not capture-complete')
          if summary['recipes'] <= 0 or summary['ingredients'] <= 0:
              raise SystemExit('progressive catalog has no usable data')
          if summary['auditedCatalogCount'] != 28:
              raise SystemExit('progressive catalog did not audit all 28 mappings')
          if summary['nutritionRequiredForComplete'] is not False:
              raise SystemExit('progressive catalog still blocks activation on nutrition')
          PY
      - name: Verify persisted artifacts contain no secrets
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-v60"
          ! grep -R -Eiq 'access[_-]?token|refresh[_-]?token|authorization|bearer |password|api[_-]?key|client[_-]?secret' \
            "$BUILD/candidate-catalog.v60.json" \
            "$BUILD/release-manifest.v60.json" \
            "$BUILD/progressive-catalog-summary.v60.json"
      - name: Upload validated progressive catalog
        uses: actions/upload-artifact@v4
        with:
          name: progressive-catalog-v60-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cook4me-progressive-v60/candidate-catalog.v60.json
            ${{ runner.temp }}/cook4me-progressive-v60/captured-semantic-catalog.v60.json
            ${{ runner.temp }}/cook4me-progressive-v60/nutrition-queue-summary.v60.json
            ${{ runner.temp }}/cook4me-progressive-v60/nutrition-pending.v60.json
            ${{ runner.temp }}/cook4me-progressive-v60/release-manifest.v60.json
            ${{ runner.temp }}/cook4me-progressive-v60/validation.v60.json
            ${{ runner.temp }}/cook4me-progressive-v60/progressive-catalog-summary.v60.json
          if-no-files-found: error
          retention-days: 7
