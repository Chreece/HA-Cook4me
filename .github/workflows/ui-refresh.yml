name: App-wide interface refresh

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Presentation boundaries and runtime activation
        run: |
          python tests/test_recipe_stock_nutrition_v218.py
          node --test tests/test_app_design_v203.mjs
          node --test tests/test_catalog_identity_index_v219.mjs
          node --test tests/test_ingredient_names_v221.mjs
          node --test tests/test_ingredient_season_v223.mjs
          python tests/test_ingredient_season_v223.py
          python tests/test_product_save_v224.py
          python tests/test_catalog_amounts_v225.py
          python tools/build_frontend_bundle_v126.py --check
          node --check custom_components/cook4me/frontend/app-design-v203.js
          node --check custom_components/cook4me/frontend/app-theme-v203.js
          node --check custom_components/cook4me/frontend/ux-fixes-v218.js
          node --check custom_components/cook4me/frontend/interaction-position-v220.js
          node --check custom_components/cook4me/frontend/ingredient-names-v221.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v180.js
          python -m py_compile custom_components/cook4me/panel.py
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual frontend chain on desktop and mobile
        run: python tests/browser_ui_refresh_v203.py
      - name: Stock view with full-size ingredient catalog
        run: python tests/browser_stock_responsiveness_v219.py
      - name: Interaction position in page and Home Assistant scroll containers
        run: python tests/browser_interaction_position_v220.py
      - name: Recipe and ingredient-info language order
        run: python tests/browser_ingredient_names_v221.py
      - name: Seasonal ingredient choices and supermarket languages
        run: python tests/browser_ingredient_season_v223.py
      - name: Product saves during background work
        run: python tests/browser_product_save_v224.py
      - name: Catalog quantity cleanup and saved ingredient aliases
        run: python tests/browser_catalog_amounts_v225.py
      - name: Greek vegetable peppers and pepper spices
        run: python tests/browser_greek_peppers_v226.py
      - name: Reviewed catalog seasons and product opening guidance
        run: python tests/browser_catalog_lifecycle_v227.py
      - name: Seasonal boundaries and canned-product opening ranges
        run: python tests/browser_catalog_lifecycle_v228.py
      - name: Navigation hover and keyboard focus regression
        run: python tests/browser_navigation_hover_v205.py
