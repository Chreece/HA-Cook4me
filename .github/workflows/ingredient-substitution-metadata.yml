name: Ingredient substitution metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ingredient-substitution-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resolve catalog substitution metadata
        run: python tests/audit_ingredient_substitution_metadata_v253.py
