name: Finalize Batch 41 nutrition triage hardening

on:
  push:
    branches:
      - cook4me-nutrition-batch41-triage-hardening-v60
    paths:
      - '.github/workflows/batch41-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: cook4me-nutrition-batch41-triage-hardening-v60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Harden context/composition triage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/classify_nutrition_review_queue_v60.py')
          text = path.read_text(encoding='utf-8')
          old = '''COMPLEX = re.compile(
              r"\\b(?:and|or|mix|blend|seasoning|spices?|stock|bouillon|broth|sauce|paste|roux|soup|"
              r"brine|soak(?:ed|ing)?|marinat(?:ed|ing)|cured|smoked|cooked|boiled|fried|roasted|"
              r"toasted|dehydrated|dried|frozen|canned|pickled|preserve|syrup|extract|flavou?r|"
              r"concentrat(?:e|ed)|liquid|cream|fat|combined|stuffed|ready-made|store-bought|"
              r"commercial|unknown|water or|or water)\\b",
              re.IGNORECASE,
          )'''.replace('          ', '')
          new = '''COMPLEX = re.compile(
              r"\\b(?:and|or|mix(?:ed|ing|tures?)?|blend(?:ed|ing)?|seasoning|spices?|stock|bouillon|broth|"
              r"sauce|paste|roux|soup|consomm[eé]|brine|soak(?:ed|ing)?|marinat(?:ed|ing)|marinades?|"
              r"cured|smoked|cooked|pre[- ]?cooked|boiled|fried|roasted|toasted|dehydrated|"
              r"rehydrat(?:ed|ing)?|dried|frozen|canned|pickled|preserv(?:e|ed|es|ing)|ferment(?:ed|ing)?|"
              r"syrup|extract|flavou?r(?:ed|ing|ings)?|concentrat(?:e|ed)|liquid|cream|fat|combined|stuffed|"
              r"ready-made|store-bought|commercial|unknown|water or|or water|slurry|pur[eé]e?s?|compotes?|"
              r"coulis|mousses?|vinaigrettes?|dressings?|starters?|dumplings?|meatballs?|candied|glazed|"
              r"food colou?r(?:ing)?|bouquet(?: garni)?|spreads?|puddings?|dough|etc)\\b|&",
              re.IGNORECASE,
          )'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy COMPLEX block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          doc = Path('docs/nutrition-review-batch41-triage-hardening-v60.md')
          body = doc.read_text(encoding='utf-8')
          body = body.replace(
              'The retained Batch 41 regression fixture is only a compact projection of the 416 pre-Batch-41 manual rows (`reviewTargetId`, canonical name, candidate count and usage count). It deliberately does not copy the multi-megabyte candidate evidence snapshot or approve any candidate.',
              'The retained Batch 41 regression fixture stores every one of the 77 rows moved by this change plus representative rows for seven canonical names that must remain manual (`reviewTargetId`, canonical name, candidate count and usage count). The 416/832 baseline and 339/909 result were independently reproduced against the exact frozen evidence snapshot before the compact fixture was generated. The fixture deliberately does not copy the multi-megabyte candidate evidence snapshot or approve any candidate.',
          )
          body = body.replace(
              'The regression fixture pins the entire 416-row pre-change manual lane so CI proves the exact 77-row movement and also checks representative simple identity controls',
              'The regression fixture pins all 77 rows that move so CI proves the exact reclassification set and also checks representative simple identity controls',
          )
          doc.write_text(body, encoding='utf-8')
          PY
      - name: Install compact Batch 41 regression contract
        run: |
          cat > tests/test_release_catalog_nutrition_review_batch41_v60.py <<'PYTEST'
          from __future__ import annotations

          import gzip
          import hashlib
          import json
          from pathlib import Path
          import sys
          import unittest

          ROOT = Path(__file__).resolve().parents[1]
          TOOLS = ROOT / "tools"
          sys.path.insert(0, str(TOOLS))

          import classify_nutrition_review_queue_v60 as classifier  # noqa: E402
          import snapshot_nutrition_review_checkpoint_v60 as cp  # noqa: E402

          FIXTURE = ROOT / "tests/fixtures/nutrition-batch41-manual-classifier-regression-v60.json.gz"
          FIXTURE_SHA = "9f41226124c0cf14c076d2614cf036fa0ba6d6e824ca12b907c54240bca4b27a"
          EVIDENCE_SHA = "e3b22f9b0834a79ffcc471d7bc61c07f08ce1f63da312c2ac36e84633c2931ac"
          REFERENCE_MANIFEST_SHA = "e135d4235a897688e37f8561602820bb84d186e91c09d9f654f52bf0d8fab29d"


          class Batch41ClassifierHardeningTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  cls.fixture = json.loads(gzip.decompress(FIXTURE.read_bytes()))
                  cls.moved = cls.fixture["movedRows"]
                  cls.controls = cls.fixture["manualControls"]
                  _rules_doc, cls.compiled = classifier._load_rules()

              def partition(self, rows):
                  return classifier._partition_remaining(
                      rows,
                      self.compiled,
                      has_candidates=lambda row: row["candidateCount"] > 0,
                  )

              def test_fixture_pins_exact_evidence_and_batch40_baseline(self):
                  self.assertEqual(hashlib.sha256(FIXTURE.read_bytes()).hexdigest(), FIXTURE_SHA)
                  self.assertEqual(self.fixture["sourceEvidenceSha256"], EVIDENCE_SHA)
                  self.assertEqual(self.fixture["referenceManifestSha256"], REFERENCE_MANIFEST_SHA)
                  self.assertEqual(self.fixture["baseManualFamilyCandidateCount"], 416)
                  self.assertEqual(self.fixture["baseContextHeavyCount"], 832)
                  self.assertEqual(self.fixture["remainingReviewTargetCount"], 1248)
                  self.assertEqual(self.fixture["bindingsCreatedByBatch41"], 0)
                  self.assertEqual(len(self.moved), 77)
                  self.assertEqual(len({row["reviewTargetId"] for row in self.moved}), 77)
                  self.assertEqual(len(self.controls), 8)
                  self.assertEqual(len({row["canonicalEnglishName"] for row in self.controls}), 7)
                  self.assertTrue(all(row["candidateCount"] > 0 for row in self.moved + self.controls))

              def test_all_77_retained_escape_rows_move_to_context(self):
                  matched, manual, context = self.partition(self.moved)
                  self.assertEqual(matched, [])
                  self.assertEqual(manual, [])
                  self.assertEqual(len(context), 77)
                  self.assertEqual(sum(row["usageCountSum"] for row in context), 675)
                  self.assertEqual(self.fixture["expectedMovedToContextCount"], 77)
                  self.assertEqual(self.fixture["expectedManualFamilyCandidateCount"], 339)
                  self.assertEqual(self.fixture["expectedContextHeavyCount"], 909)
                  self.assertEqual(self.fixture["baseManualFamilyCandidateCount"] - len(context), 339)
                  self.assertEqual(self.fixture["baseContextHeavyCount"] + len(context), 909)
                  self.assertEqual(339 + 909, self.fixture["remainingReviewTargetCount"])

              def test_new_context_forms_are_explicitly_regressed(self):
                  examples = {
                      "Mixed herbs",
                      "Oil, mixed with yogurt",
                      "Pistachio flavoring",
                      "Vanilla flavouring",
                      "Earl Grey tea-flavoured water (1 tea bag for 2 people)",
                      "Oil marinade from feta",
                      "Starch slurry (starch:water 1:1)",
                      "Purée",
                      "Fruit compote",
                      "Fruit coulis",
                      "Fruit mousse",
                      "Vinaigrette",
                      "Dressing",
                      "Sourdough starter",
                      "Pike dumplings",
                      "Beef meatballs",
                      "Precooked ramen",
                      "Knotted kombu, rehydrated in water",
                      "Preserved lemon, diced",
                      "Salted fermented shrimp",
                      "Candied chestnuts for decorating",
                      "Glazed chestnuts, crushed",
                      "Green food coloring",
                      "Beef consommé cube",
                      "Herb bouquet",
                      "Chestnut spread",
                      "White pudding",
                      "Matazeez dough",
                      "Salt & pepper",
                      "Herbs (thyme, rosemary, etc.)",
                  }
                  names = {row["canonicalEnglishName"] for row in self.moved}
                  self.assertFalse(examples - names)

              def test_simple_identity_controls_remain_manual(self):
                  expected = {
                      "Guinea fowl",
                      "Nigella seeds",
                      "Parsley root",
                      "Fresh sage leaves",
                      "Sage leaves, thinly sliced",
                      "Vanilla pod",
                      "Zucchini flowers",
                  }
                  self.assertEqual({row["canonicalEnglishName"] for row in self.controls}, expected)
                  matched, manual, context = self.partition(self.controls)
                  self.assertEqual(matched, [])
                  self.assertEqual(context, [])
                  self.assertEqual({row["canonicalEnglishName"] for row in manual}, expected)

              def test_hardening_does_not_create_or_move_recorded_bindings(self):
                  checkpoint = cp.build_checkpoint(TOOLS)
                  self.assertEqual(checkpoint["summary"]["recordedReviewTargetCount"], 5071)
                  self.assertEqual(self.fixture["bindingsCreatedByBatch41"], 0)
                  self.assertEqual(self.fixture["remainingReviewTargetCount"], 1248)


          if __name__ == "__main__":
              unittest.main()
          PYTEST
      - name: Validate focused nutrition contracts
        run: |
          gzip -t tests/fixtures/nutrition-batch41-manual-classifier-regression-v60.json.gz
          python scripts/version.py validate
          python -m compileall -q tools/classify_nutrition_review_queue_v60.py tests/test_release_catalog_nutrition_review_batch40_v60.py tests/test_release_catalog_nutrition_review_batch41_v60.py
          python -m unittest \
            tests.test_release_catalog_nutrition_review_batch40_v60 \
            tests.test_release_catalog_nutrition_review_batch41_v60 \
            -v
      - name: Push validated source and remove one-shot workflow
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)" || {
            echo 'Branch advanced during validation'
            exit 78
          }
          rm .github/workflows/batch41-finalize.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden Batch 41 nutrition review triage'
          git push origin "HEAD:$BRANCH"
