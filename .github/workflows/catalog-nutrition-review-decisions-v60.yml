name: Validate post-activation nutrition review decisions v60

on:
  push:
    branches:
      - cook4me-nutrition-enrichment-post-activation-v60
    paths:
      - .github/workflows/catalog-nutrition-review-decisions-v60.yml
      - tools/compile_release_catalog_fdc_review_decisions_v60.py
      - tools/compile_release_catalog_fdc_retained_review_decisions_v60.py
      - tools/verify_post_activation_nutrition_review_decisions_v60.py
      - tools/snapshot_nutrition_review_checkpoint_v60.py
      - tools/resolve_reviewed_release_catalog_nutrition_targets_v60.py
      - tools/release_catalog_reviewed_nutrition_targets_*.v1.json
      - tools/nutrition_review_validation_request.v1.json
      - tests/test_compile_release_catalog_fdc_review_decisions_v60.py
      - tests/test_compile_release_catalog_fdc_retained_review_decisions_v60.py
      - tests/test_verify_post_activation_nutrition_review_decisions_v60.py
      - tests/test_nutrition_review_checkpoint_v60.py
  workflow_dispatch:

concurrency:
  group: catalog-nutrition-review-decisions-v60-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  validate-review-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_TAG: nutrition-evidence-v60-archive
      ACTIVATION_BRANCH: cook4me-nutrition-enrichment-post-activation-v60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile review-decision tooling
        run: |
          set -Eeuo pipefail
          python -m py_compile tools/compile_release_catalog_fdc_review_decisions_v60.py tools/compile_release_catalog_fdc_retained_review_decisions_v60.py tools/verify_post_activation_nutrition_review_decisions_v60.py tools/snapshot_nutrition_review_checkpoint_v60.py tools/resolve_reviewed_release_catalog_nutrition_targets_v60.py

      - name: Run fail-closed review-decision regressions
        run: |
          set -Eeuo pipefail
          python -m unittest tests.test_compile_release_catalog_fdc_review_decisions_v60 tests.test_compile_release_catalog_fdc_retained_review_decisions_v60 tests.test_verify_post_activation_nutrition_review_decisions_v60 tests.test_nutrition_review_checkpoint_v60 -v

      - name: Prove complete global review corpus uniqueness
        run: |
          set -Eeuo pipefail
          python -c 'from pathlib import Path; import sys; sys.path.insert(0,"tools"); import snapshot_nutrition_review_checkpoint_v60 as c; print(c.build_checkpoint(Path("tools"))["summary"])'

      - name: Select verification scope
        id: scope
        run: |
          set -Eeuo pipefail
          CHANGED="$(git diff --name-only HEAD^ HEAD || true)"
          printf '%s\n' "$CHANGED"
          CORE_RE='^(tools/(compile_release_catalog_fdc_review_decisions_v60.py|compile_release_catalog_fdc_retained_review_decisions_v60.py|verify_post_activation_nutrition_review_decisions_v60.py|snapshot_nutrition_review_checkpoint_v60.py|resolve_reviewed_release_catalog_nutrition_targets_v60.py)|tests/test_(compile_release_catalog_fdc_review_decisions_v60|compile_release_catalog_fdc_retained_review_decisions_v60|verify_post_activation_nutrition_review_decisions_v60|nutrition_review_checkpoint_v60).py)$'
          if printf '%s\n' "$CHANGED" | grep -Eq "$CORE_RE"; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$CHANGED" | sed -nE 's#^tools/release_catalog_(nutrition_review_decisions_post_activation|reviewed_nutrition_targets)_([0-9]+)\.v1\.json$#\2#p' | sort -nu > /tmp/changed-batches.txt
          REQUEST_CHANGED=false
          if printf '%s\n' "$CHANGED" | grep -Fxq 'tools/nutrition_review_validation_request.v1.json'; then
            REQUEST_CHANGED=true
            jq -r '.batches[]' tools/nutrition_review_validation_request.v1.json >> /tmp/changed-batches.txt
            sort -nu /tmp/changed-batches.txt -o /tmp/changed-batches.txt
          fi
          if printf '%s\n' "$CHANGED" | grep -Eq '^tools/release_catalog_reviewed_nutrition_targets_[0-9]+\.v1\.json$' || [ "$REQUEST_CHANGED" = true ]; then
            echo "activation_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "activation_required=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed batches:"
          cat /tmp/changed-batches.txt || true

      - name: Prepare decision subset and evidence list
        id: subset
        run: |
          set -Eeuo pipefail
          MODE="${{ steps.scope.outputs.mode }}"
          DECISION_ROOT=/tmp/nutrition-review-decisions
          REVIEW_ROOT=/tmp/nutrition-review-files
          mkdir -p "$DECISION_ROOT" "$REVIEW_ROOT"
          if [ "$MODE" = "full" ]; then
            cp tools/release_catalog_nutrition_review_decisions_post_activation_*.v1.json "$DECISION_ROOT/"
            cp tools/release_catalog_reviewed_nutrition_targets*.v1.json "$REVIEW_ROOT/"
          else
            while IFS= read -r BATCH; do
              test -n "$BATCH"
              cp "tools/release_catalog_nutrition_review_decisions_post_activation_${BATCH}.v1.json" "$DECISION_ROOT/"
              cp "tools/release_catalog_reviewed_nutrition_targets_${BATCH}.v1.json" "$REVIEW_ROOT/"
            done < /tmp/changed-batches.txt
          fi
          COUNT="$(find "$DECISION_ROOT" -maxdepth 1 -type f -name 'release_catalog_nutrition_review_decisions_post_activation_*.v1.json' | wc -l)"
          echo "decision_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            : > /tmp/nutrition-review-evidence-shas.txt
            exit 0
          fi
          python -c 'import json,re,sys; from pathlib import Path; root=Path(sys.argv[1]); shas=sorted({str(json.loads(p.read_text(encoding="utf-8")).get("sourceEvidenceSha256") or "").strip() for p in root.glob("release_catalog_nutrition_review_decisions_post_activation_*.v1.json")}); bad=[x for x in shas if not re.fullmatch(r"[0-9a-f]{64}",x)]; assert not bad,bad; Path("/tmp/nutrition-review-evidence-shas.txt").write_text("".join(x+chr(10) for x in shas),encoding="utf-8"); print("required immutable evidence snapshots:",len(shas))' "$DECISION_ROOT"
          cat /tmp/nutrition-review-evidence-shas.txt

      - name: Download only required immutable evidence snapshots
        if: steps.subset.outputs.decision_count != '0'
        run: |
          set -Eeuo pipefail
          DEST=/tmp/nutrition-review-evidence
          mkdir -p "$DEST"
          test "$(gh release view "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"
          while IFS= read -r SHA; do
            test -n "$SHA"
            ASSET="fdc-candidate-evidence-v60-${SHA}.json.gz"
            JSON="$DEST/fdc-candidate-evidence-v60-${SHA}.json"
            gh release download "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$DEST" --pattern "$ASSET"
            gzip -cd "$DEST/$ASSET" > "$JSON"
            test "$(sha256sum "$JSON" | awk '{print $1}')" = "$SHA"
          done < /tmp/nutrition-review-evidence-shas.txt

      - name: Recompile and verify selected review batches
        if: steps.subset.outputs.decision_count != '0'
        run: |
          set -Eeuo pipefail
          DEST=/tmp/nutrition-review-evidence
          ARGS=()
          while IFS= read -r SHA; do
            ARGS+=(--evidence "$DEST/fdc-candidate-evidence-v60-${SHA}.json")
          done < /tmp/nutrition-review-evidence-shas.txt
          python tools/verify_post_activation_nutrition_review_decisions_v60.py "${ARGS[@]}" --decision-root /tmp/nutrition-review-decisions --review-root /tmp/nutrition-review-files --output /tmp/post-activation-review-verification.v60.json
          cat /tmp/post-activation-review-verification.v60.json

      - name: Dispatch activation only for verified changed review batches
        if: steps.scope.outputs.activation_required == 'true'
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$GITHUB_SHA"
          if git diff --name-only HEAD^ HEAD | grep -Fxq 'tools/nutrition_review_validation_request.v1.json'; then
            REQUEST_SHA="$(jq -r '.activationSourceSha // empty' tools/nutrition_review_validation_request.v1.json)"
            if [ -n "$REQUEST_SHA" ]; then
              SOURCE_SHA="$REQUEST_SHA"
            fi
          fi
          test -n "$SOURCE_SHA"
          gh workflow run catalog-post-activation-nutrition-activate-v60.yml --repo "$GITHUB_REPOSITORY" --ref "$ACTIVATION_BRANCH" -f source_sha="$SOURCE_SHA"
          echo "Dispatched nutrition activation for verified review-batch SHA $SOURCE_SHA"
