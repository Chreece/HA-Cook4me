name: Validate post-activation nutrition review decisions v60

on:
  push:
    branches:
      - cook4me-nutrition-enrichment-post-activation-v60
    paths:
      - .github/workflows/catalog-nutrition-review-decisions-v60.yml
      - tools/compile_release_catalog_fdc_review_decisions_v60.py
      - tools/compile_release_catalog_fdc_retained_review_decisions_v60.py
      - tools/verify_post_activation_nutrition_review_decisions_v60.py
      - tools/snapshot_nutrition_review_checkpoint_v60.py
      - tools/resolve_reviewed_release_catalog_nutrition_targets_v60.py
      - tools/release_catalog_nutrition_review_decisions_post_activation_*.v1.json
      - tools/release_catalog_reviewed_nutrition_targets_*.v1.json
      - tests/test_compile_release_catalog_fdc_review_decisions_v60.py
      - tests/test_compile_release_catalog_fdc_retained_review_decisions_v60.py
      - tests/test_verify_post_activation_nutrition_review_decisions_v60.py
      - tests/test_nutrition_review_checkpoint_v60.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-review-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile review-decision tooling
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            tools/compile_release_catalog_fdc_review_decisions_v60.py \
            tools/compile_release_catalog_fdc_retained_review_decisions_v60.py \
            tools/verify_post_activation_nutrition_review_decisions_v60.py \
            tools/snapshot_nutrition_review_checkpoint_v60.py \
            tools/resolve_reviewed_release_catalog_nutrition_targets_v60.py

      - name: Run fail-closed review-decision regressions
        run: |
          set -Eeuo pipefail
          python -m unittest \
            tests.test_compile_release_catalog_fdc_review_decisions_v60 \
            tests.test_compile_release_catalog_fdc_retained_review_decisions_v60 \
            tests.test_verify_post_activation_nutrition_review_decisions_v60 \
            tests.test_nutrition_review_checkpoint_v60 -v

      - name: Download successful post-activation evidence
        uses: actions/download-artifact@v4
        with:
          name: nutrition-enrichment-evidence-v60-98a0b0e284749622787ff251340d0100b650e2c4
          path: /tmp/nutrition-evidence
          repository: Chreece/HA-Cook4me
          run-id: 34847903376
          github-token: ${{ github.token }}

      - name: Recompile and verify committed review batches
        run: |
          set -Eeuo pipefail
          python tools/verify_post_activation_nutrition_review_decisions_v60.py \
            --evidence /tmp/nutrition-evidence/fdc-candidate-evidence.v60.json \
            --decision-root tools \
            --review-root tools \
            --output /tmp/post-activation-review-verification.v60.json
          cat /tmp/post-activation-review-verification.v60.json
