name: Catalog Phase 2B cleanup v59

on:
  push:
    branches:
      - cook4me-release-catalog-cache-progress-v59
    paths:
      - .github/workflows/catalog-phase2b-cleanup-v59.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary Phase 2B review scaffolding
        run: |
          set -Eeuo pipefail
          git rm -f \
            .github/workflows/catalog-phase2b-cleanup-v59.yml \
            .github/workflows/catalog-phase2b-split-residual-titles-v59.yml \
            .github/workflows/catalog-phase2b-title-coverage-v59.yml \
            tools/release_catalog_pending_recipe_titles_v59_batches.json \
            tools/release_catalog_pending_recipe_titles_v59_batch_*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "Remove temporary Phase 2B title review scaffolding"
          git push origin HEAD:cook4me-release-catalog-cache-progress-v59
