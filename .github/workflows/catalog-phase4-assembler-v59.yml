name: Catalog phase 4 assembler v59

on:
  push:
    branches:
      - cook4me-catalog-phase4-staging-v59
    paths:
      - .github/workflows/catalog-phase4-assembler-v59.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate reviewed catalog assembler
        run: |
          python -m py_compile tools/assemble_release_catalog_v3.py tests/test_assemble_release_catalog_v3.py
          python tests/test_assemble_release_catalog_v3.py
          python tests/test_release_catalog.py
          git diff --check
