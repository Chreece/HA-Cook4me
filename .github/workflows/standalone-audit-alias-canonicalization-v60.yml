name: Canonicalize standalone semantic audit targets v60

on:
  push:
    branches:
      - cook4me-ingredient-semantic-confirmation-v60
    paths:
      - '.github/workflows/standalone-audit-alias-canonicalization-v60.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch standalone audit to canonical semantic targets
        run: |
          set -Eeuo pipefail
          python tools/patch_standalone_audit_alias_canonicalization_v60.py
          git diff --check
      - name: Run audit canonicalization regression
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_audit_standalone_semantic_merge_candidates_v60.py' -v
          python tools/audit_standalone_semantic_merge_candidates_v60.py \
            --review-root tools \
            --output "$RUNNER_TEMP/standalone-audit.json" \
            --high-output "$RUNNER_TEMP/standalone-high.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['RUNNER_TEMP'], 'standalone-audit.json').read_text(encoding='utf-8'))
          policy = result['policy']
          if policy.get('highConfidenceTargetsCanonicalizedThroughCompiledSemanticGraph') is not True:
              raise SystemExit('audit did not use compiled canonical semantic graph')
          if policy.get('collapsedHighConfidenceAliasTargetsExcluded') is not True:
              raise SystemExit('audit did not prove collapsed alias exclusion')
          if result['summary'].get('reviewedAmbiguousCount') != 28:
              raise SystemExit('reviewed ambiguous count changed unexpectedly')
          print(json.dumps(result['summary'], ensure_ascii=False, indent=2))
          PY
      - name: Commit validated audit fix
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/audit_standalone_semantic_merge_candidates_v60.py \
            tests/test_audit_standalone_semantic_merge_candidates_v60.py
          git diff --cached --check
          git commit -m 'Canonicalize standalone audit semantic targets v60'
          git push origin HEAD:cook4me-ingredient-semantic-confirmation-v60
