name: Build post-activation nutrition evidence v60

on:
  push:
    branches:
      - cook4me-nutrition-enrichment-post-activation-v60
    paths:
      - .github/workflows/catalog-nutrition-enrichment-evidence-v60.yml
      - tools/capture_release_catalog_fdc_candidate_evidence_offline_v60.py
      - tools/classify_release_catalog_fdc_candidate_evidence_v60.py
      - tools/fdc_candidate_reference_data_v60.py
      - tools/prepare_post_activation_nutrition_review_targets_v60.py
      - tests/test_capture_release_catalog_fdc_candidate_evidence_offline_v60.py
      - tests/test_fdc_candidate_reference_data_v60.py
      - tests/test_prepare_post_activation_nutrition_review_targets_v60.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nutrition-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run focused evidence regressions
        run: |
          set -Eeuo pipefail
          python -m unittest \
            tests.test_capture_release_catalog_fdc_candidate_evidence_offline_v60 \
            tests.test_fdc_candidate_reference_data_v60 \
            tests.test_prepare_post_activation_nutrition_review_targets_v60 -v

      - name: Prove activated catalog baseline
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = Path('custom_components/cook4me/catalog/merged_catalog.v1.json')
          payload = json.loads(catalog.read_text(encoding='utf-8'))
          source = payload.get('source') if isinstance(payload.get('source'), dict) else {}
          facts = {
              'complete': payload.get('complete') is True,
              'runtimeCatalogCompacted': source.get('runtimeCatalogCompacted') is True,
              'recipes': len(payload.get('recipes') or []),
              'variants': sum(len(r.get('variants') or []) for r in payload.get('recipes') or [] if isinstance(r, dict)),
              'ingredients': len(payload.get('ingredients') or []),
              'reviewedNutritionResolvedCount': int(source.get('reviewedNutritionResolvedCount') or 0),
              'reviewedNutritionRequiredCount': int(source.get('reviewedNutritionRequiredCount') or 0),
              'failedDetailCount': int(source.get('failedDetailCount') or 0),
          }
          if not facts['complete'] or not facts['runtimeCatalogCompacted']:
              raise SystemExit(f'release catalog is not the activated compact v60 baseline: {facts}')
          if (facts['recipes'], facts['variants'], facts['ingredients']) != (16952, 32163, 11748):
              raise SystemExit(f'activated release counts changed: {facts}')
          if facts['failedDetailCount'] != 0:
              raise SystemExit(f"activated catalog has failed details: {facts['failedDetailCount']}")
          print(json.dumps(facts, ensure_ascii=False, indent=2))
          PY

      - name: Prepare unresolved review targets from activated compact catalog
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-nutrition-enrichment-v60"
          mkdir -p "$BUILD"
          python tools/prepare_post_activation_nutrition_review_targets_v60.py \
            --catalog custom_components/cook4me/catalog/merged_catalog.v1.json \
            --queue-output "$BUILD/nutrition-queue.v60.json" \
            --queue-summary "$BUILD/nutrition-queue-summary.v60.json" \
            --targets-output "$BUILD/nutrition-review-targets.v60.json" \
            --targets-summary "$BUILD/nutrition-review-targets-summary.v60.json"

      - name: Verify expected post-activation unresolved set
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-nutrition-enrichment-v60"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cook4me-nutrition-enrichment-v60'
          queue = json.loads((root / 'nutrition-queue-summary.v60.json').read_text(encoding='utf-8'))
          targets = json.loads((root / 'nutrition-review-targets-summary.v60.json').read_text(encoding='utf-8'))
          facts = {
              'pendingIdentityCount': int(queue.get('pendingNutritionCount') or 0),
              'reviewTargetCount': int(targets.get('reviewTargetCount') or 0),
              'usedReviewTargetCount': int(targets.get('usedReviewTargetCount') or 0),
              'runtimeSemanticReviewReceipts': int(targets.get('postActivationSemanticReviewReceiptCount') or 0),
              'runtimeSemanticReviewReceiptTargets': int(targets.get('postActivationSemanticReviewReceiptTargetCount') or 0),
          }
          if facts['pendingIdentityCount'] != 1851:
              raise SystemExit(f"unexpected pending identity count: {facts['pendingIdentityCount']}")
          if facts['reviewTargetCount'] != 1251:
              raise SystemExit(f"unexpected review target count: {facts['reviewTargetCount']}")
          print(json.dumps(facts, ensure_ascii=False, indent=2))
          PY

      - name: Download pinned public USDA reference data
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-nutrition-enrichment-v60"
          python tools/prepare_fdc_reference_data_v60.py \
            --output-dir "$BUILD/fdc-reference-v60" \
            | tee "$BUILD/fdc-reference-summary.v60.json"

      - name: Capture candidate evidence for all review targets offline
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-nutrition-enrichment-v60"
          python tools/capture_release_catalog_fdc_candidate_evidence_offline_v60.py \
            --targets "$BUILD/nutrition-review-targets.v60.json" \
            --reference-manifest "$BUILD/fdc-reference-v60/reference-manifest.v60.json" \
            --output "$BUILD/fdc-candidate-evidence.v60.json" \
            --summary-output "$BUILD/fdc-candidate-evidence-summary.v60.json" \
            --max-candidates 12

      - name: Classify evidence into deterministic review lanes
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-nutrition-enrichment-v60"
          python tools/classify_release_catalog_fdc_candidate_evidence_v60.py \
            --evidence "$BUILD/fdc-candidate-evidence.v60.json" \
            --output "$BUILD/fdc-candidate-triage.v60.json" \
            --summary-output "$BUILD/fdc-candidate-triage-summary.v60.json"

      - name: Verify evidence is complete and non-binding
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-nutrition-enrichment-v60"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cook4me-nutrition-enrichment-v60'
          evidence = json.loads((root / 'fdc-candidate-evidence-summary.v60.json').read_text(encoding='utf-8'))
          triage = json.loads((root / 'fdc-candidate-triage-summary.v60.json').read_text(encoding='utf-8'))
          facts = {
              'reviewTargetCount': int(evidence.get('reviewTargetCount') or 0),
              'candidateOnlyReferenceIndex': evidence.get('candidateOnlyReferenceIndex') is True,
              'indexedReferenceFdcIdCount': int(evidence.get('indexedReferenceFdcIdCount') or 0),
              'withCandidateCount': int(evidence.get('withCandidateCount') or 0),
              'zeroCandidateCount': int(evidence.get('zeroCandidateCount') or 0),
              'uniqueLiteralExactDescriptionMatchTargetCount': int(evidence.get('uniqueLiteralExactDescriptionMatchTargetCount') or 0),
              'multipleLiteralExactDescriptionMatchTargetCount': int(evidence.get('multipleLiteralExactDescriptionMatchTargetCount') or 0),
              'singletonCandidateCount': int(evidence.get('singletonCandidateCount') or 0),
              'aliasFallbackTargetCount': int(evidence.get('aliasFallbackTargetCount') or 0),
              'reviewTargetsByLane': triage.get('reviewTargetsByLane') or {},
              'usageByLane': triage.get('usageByLane') or {},
              'selectionCount': int(triage.get('selectionCount') or 0),
              'bindingCreatedCount': int(triage.get('bindingCreatedCount') or 0),
              'networkRequestsPerformed': bool(triage.get('networkRequestsPerformed')),
          }
          if facts['reviewTargetCount'] != 1251:
              raise SystemExit(f"candidate evidence lost review targets: {facts['reviewTargetCount']}")
          if not facts['candidateOnlyReferenceIndex'] or facts['indexedReferenceFdcIdCount'] <= 0:
              raise SystemExit(f'candidate capture did not use lightweight reference index: {facts}')
          if facts['selectionCount'] or facts['bindingCreatedCount'] or facts['networkRequestsPerformed']:
              raise SystemExit(f'candidate evidence violated non-binding/offline contract: {facts}')
          (root / 'nutrition-enrichment-facts.v60.json').write_text(
              json.dumps(facts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(facts, ensure_ascii=False, indent=2))
          PY

      - name: Upload post-activation nutrition evidence
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-enrichment-evidence-v60-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cook4me-nutrition-enrichment-v60/nutrition-queue-summary.v60.json
            ${{ runner.temp }}/cook4me-nutrition-enrichment-v60/nutrition-review-targets-summary.v60.json
            ${{ runner.temp }}/cook4me-nutrition-enrichment-v60/fdc-reference-summary.v60.json
            ${{ runner.temp }}/cook4me-nutrition-enrichment-v60/fdc-candidate-evidence.v60.json
            ${{ runner.temp }}/cook4me-nutrition-enrichment-v60/fdc-candidate-evidence-summary.v60.json
            ${{ runner.temp }}/cook4me-nutrition-enrichment-v60/fdc-candidate-triage.v60.json
            ${{ runner.temp }}/cook4me-nutrition-enrichment-v60/fdc-candidate-triage-summary.v60.json
            ${{ runner.temp }}/cook4me-nutrition-enrichment-v60/nutrition-enrichment-facts.v60.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
