name: Temporary Batch 23 Reviewed Corpus Export

on:
  push:
    branches:
      - cook4me-batch23-review-prep

permissions:
  contents: read

jobs:
  export-reviewed-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export reviewed nutrition corpus
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const names = fs.readdirSync('tools')
            .filter((name) => /^release_catalog_reviewed_nutrition_targets_\d+[a-z]*\.v1\.json$/.test(name))
            .sort();
          const rows = [];
          const ids = new Set();
          for (const name of names) {
            const value = JSON.parse(fs.readFileSync(path.join('tools', name), 'utf8'));
            for (const row of value.items || []) {
              const id = String(row.reviewTargetId);
              if (ids.has(id)) throw new Error(`Duplicate reviewed target ID: ${id}`);
              ids.add(id);
              rows.push({
                reviewTargetId: id,
                reviewTargetKind: row.reviewTargetKind,
                canonicalEnglishName: row.canonicalEnglishName,
                fdcId: Number(row.fdcId),
                fdcDescription: row.fdcDescription,
                fdcDataType: row.fdcDataType,
                candidateEvidenceRank: Number(row.candidateEvidenceRank),
                usageCountAtReview: Number(row.usageCountAtReview || 0)
              });
            }
          }
          if (rows.length !== 2431 || ids.size !== 2431) {
            throw new Error(`Expected 2431 reviewed rows after batch 22, got rows=${rows.length} ids=${ids.size}`);
          }
          rows.sort((a,b) => a.reviewTargetId.localeCompare(b.reviewTargetId));
          fs.writeFileSync('reviewed-nutrition-corpus-batch22.json', JSON.stringify({count: rows.length, rows}));
          console.log(`EXACT_REVIEWED_COUNT=${rows.length}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: batch23-reviewed-nutrition-corpus
          path: reviewed-nutrition-corpus-batch22.json
          if-no-files-found: error
