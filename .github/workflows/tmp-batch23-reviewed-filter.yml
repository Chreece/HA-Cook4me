name: Temporary Batch 23 Reviewed-ID Export

on:
  push:
    branches:
      - cook4me-batch23-review-prep

permissions:
  contents: read

jobs:
  export-reviewed-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exact reviewed target IDs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const names = fs.readdirSync('tools')
            .filter((name) => /^release_catalog_reviewed_nutrition_targets_\d+[a-z]*\.v1\.json$/.test(name))
            .sort();
          const ids = new Set();
          for (const name of names) {
            const value = JSON.parse(fs.readFileSync(path.join('tools', name), 'utf8'));
            for (const row of value.items || []) ids.add(String(row.reviewTargetId));
          }
          if (ids.size !== 2431) {
            throw new Error(`Expected 2431 reviewed target IDs after batch 22, got ${ids.size}`);
          }
          const sorted = [...ids].sort();
          fs.writeFileSync('reviewed-target-ids-batch22.json', JSON.stringify({count: sorted.length, ids: sorted}));
          console.log(`EXACT_REVIEWED_COUNT=${sorted.length}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: batch23-reviewed-target-ids
          path: reviewed-target-ids-batch22.json
          if-no-files-found: error
