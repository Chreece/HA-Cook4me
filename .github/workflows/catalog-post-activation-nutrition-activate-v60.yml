name: Activate post-activation reviewed nutrition v60

on:
  push:
    branches:
      - cook4me-nutrition-enrichment-post-activation-v60
    paths:
      - .github/workflows/catalog-post-activation-nutrition-activate-v60.yml
      - tools/activate_post_activation_reviewed_nutrition_v60.py
      - tools/release_catalog_reviewed_nutrition_targets_*.v1.json
      - tests/test_activate_post_activation_reviewed_nutrition_v60.py
  workflow_dispatch:

concurrency:
  group: catalog-post-activation-nutrition-activate-v60-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  activate-reviewed-nutrition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run activation regressions
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            tools/activate_post_activation_reviewed_nutrition_v60.py \
            tools/resolve_reviewed_release_catalog_nutrition_targets_offline_v60.py \
            tools/compact_release_catalog_runtime_v60.py
          python -m unittest tests.test_activate_post_activation_reviewed_nutrition_v60 -v

      - name: Download byte-pinned USDA reference data
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-post-activation-nutrition-v60"
          mkdir -p "$BUILD"
          python tools/prepare_fdc_reference_data_v60.py \
            --output-dir "$BUILD/fdc-reference-v60" \
            | tee "$BUILD/fdc-reference-summary.v60.json"

      - name: Build post-activation nutrition overlay completely offline
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-post-activation-nutrition-v60"
          python tools/activate_post_activation_reviewed_nutrition_v60.py \
            --catalog custom_components/cook4me/catalog/merged_catalog.v1.json \
            --reference-manifest "$BUILD/fdc-reference-v60/reference-manifest.v60.json" \
            --review-root tools \
            --output "$BUILD/activated-catalog.v60.json" \
            --summary-output "$BUILD/activation-summary.v60.json" \
            --delta-cache-output "$BUILD/activated-delta-cache.v60.json" \
            --pending-output "$BUILD/activation-pending.v60.json"

      - name: Independently validate activated catalog
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-post-activation-nutrition-v60"
          python tools/validate_release_catalog_v60.py "$BUILD/activated-catalog.v60.json" \
            | tee "$BUILD/activation-validation.v60.json"

      - name: Prove exact coverage delta and runtime invariants
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-post-activation-nutrition-v60"
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cook4me-post-activation-nutrition-v60'
          catalog_path = root / 'activated-catalog.v60.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          summary = json.loads((root / 'activation-summary.v60.json').read_text(encoding='utf-8'))
          source = catalog.get('source') if isinstance(catalog.get('source'), dict) else {}
          baseline = json.loads(Path('custom_components/cook4me/catalog/merged_catalog.v1.json').read_text(encoding='utf-8'))
          baseline_source = baseline.get('source') if isinstance(baseline.get('source'), dict) else {}
          sys.path.insert(0, str(Path.cwd() / 'custom_components' / 'cook4me'))
          import catalog_search_index as search
          prepared = search.prepare_search_index(catalog.get('searchIndex') or {})
          def q(value, language):
              return search.search_index(prepared, value, language=language, strict_language=False, page=0, size=20)

          facts = {
              'complete': catalog.get('complete') is True,
              'catalogBytes': catalog_path.stat().st_size,
              'recipes': len(catalog.get('recipes') or []),
              'variants': sum(len(r.get('variants') or []) for r in catalog.get('recipes') or [] if isinstance(r, dict)),
              'ingredients': len(catalog.get('ingredients') or []),
              'failedDetailCount': int(source.get('failedDetailCount') or 0),
              'detailNotFoundCount': int(source.get('detailNotFoundCount') or 0),
              'expectedResolvedBefore': int(baseline_source.get('reviewedNutritionResolvedCount') or 0),
              'expectedRequiredBefore': int(baseline_source.get('reviewedNutritionRequiredCount') or 0),
              'resolvedBefore': int(summary.get('reviewedNutritionResolvedCountBefore') or 0),
              'requiredBefore': int(summary.get('reviewedNutritionRequiredCountBefore') or 0),
              'newlyResolvedTargets': int(summary.get('newlyResolvedReviewTargetCount') or 0),
              'newlyResolvedIdentities': int(summary.get('newlyResolvedIdentityCount') or 0),
              'resolvedAfter': int(source.get('reviewedNutritionResolvedCount') or 0),
              'requiredAfter': int(source.get('reviewedNutritionRequiredCount') or 0),
              'pendingAfter': int(summary.get('pendingIdentityCountAfter') or 0),
              'runtimeCatalogCompacted': source.get('runtimeCatalogCompacted') is True,
              'runtimeRecipeNutritionOnDemand': source.get('runtimeRecipeNutritionOnDemand') is True,
              'prefixPostingsPersisted': bool((catalog.get('searchIndex') or {}).get('prefixPostings')),
              'networkRequestsPerformed': bool(summary.get('networkRequestsPerformed')),
              'manifestReceipts': list(summary.get('referenceManifestReceipts') or []),
              'latinRisotto': int(q('risotto', 'it').get('total') or 0),
              'greekRisotto': int(q('ριζότο', 'el').get('total') or 0),
          }
          if not facts['complete']:
              raise SystemExit(f'activated catalog lost complete=true: {facts}')
          if (facts['recipes'], facts['variants'], facts['ingredients']) != (16952, 32163, 11748):
              raise SystemExit(f'activation changed catalog identity counts: {facts}')
          if facts['failedDetailCount'] != 0 or facts['detailNotFoundCount'] != 1485:
              raise SystemExit(f'activation changed detail accounting: {facts}')
          if facts['expectedRequiredBefore'] != 10776:
              raise SystemExit(f'activation baseline changed the v60 nutrition denominator: {facts}')
          if facts['resolvedBefore'] != facts['expectedResolvedBefore'] or facts['requiredBefore'] != facts['expectedRequiredBefore']:
              raise SystemExit(f'activation did not start from the checked-out catalog nutrition baseline: {facts}')
          if facts['newlyResolvedTargets'] <= 0 or facts['newlyResolvedIdentities'] <= 0:
              raise SystemExit(f'activation resolved no new reviewed nutrition: {facts}')
          if facts['resolvedAfter'] != facts['resolvedBefore'] + facts['newlyResolvedIdentities']:
              raise SystemExit(f'activation coverage delta is not exact: {facts}')
          if facts['requiredAfter'] != facts['requiredBefore']:
              raise SystemExit(f'activation changed nutrition denominator: {facts}')
          if facts['pendingAfter'] != facts['requiredAfter'] - facts['resolvedAfter']:
              raise SystemExit(f'activation pending identity count is inconsistent: {facts}')
          if not facts['runtimeCatalogCompacted'] or not facts['runtimeRecipeNutritionOnDemand']:
              raise SystemExit(f'activation broke runtime compactness: {facts}')
          if facts['prefixPostingsPersisted']:
              raise SystemExit(f'activation persisted prefix postings: {facts}')
          if facts['networkRequestsPerformed']:
              raise SystemExit(f'activation unexpectedly used network nutrition resolution: {facts}')
          if facts['catalogBytes'] >= 95_000_000:
              raise SystemExit(f'activated catalog is too large: {facts}')
          if facts['latinRisotto'] <= 0 or facts['greekRisotto'] <= 0:
              raise SystemExit(f'activation regressed multilingual search: {facts}')
          if not facts['manifestReceipts']:
              raise SystemExit(f'activation lost USDA manifest provenance: {facts}')
          (root / 'activation-facts.v60.json').write_text(
              json.dumps(facts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(facts, ensure_ascii=False, indent=2))
          PY

      - name: Verify no persisted secret-like fields
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-post-activation-nutrition-v60"
          ! grep -Eiq 'access[_-]?token|refresh[_-]?token|authorization|bearer |password|api[_-]?key|client[_-]?secret' \
            "$BUILD/activated-catalog.v60.json" "$BUILD/activation-summary.v60.json" "$BUILD/activation-facts.v60.json"

      - name: Upload validated activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-activation-reviewed-nutrition-v60-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cook4me-post-activation-nutrition-v60/fdc-reference-summary.v60.json
            ${{ runner.temp }}/cook4me-post-activation-nutrition-v60/activation-summary.v60.json
            ${{ runner.temp }}/cook4me-post-activation-nutrition-v60/activation-pending.v60.json
            ${{ runner.temp }}/cook4me-post-activation-nutrition-v60/activation-validation.v60.json
            ${{ runner.temp }}/cook4me-post-activation-nutrition-v60/activation-facts.v60.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

      - name: Promote exact validated catalog on enrichment branch
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-post-activation-nutrition-v60"
          cp "$BUILD/activated-catalog.v60.json" custom_components/cook4me/catalog/merged_catalog.v1.json
          cp "$BUILD/activation-facts.v60.json" tools/post_activation_nutrition_activation_v60_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/cook4me/catalog/merged_catalog.v1.json tools/post_activation_nutrition_activation_v60_summary.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Activate post-activation reviewed nutrition v60"
          git push origin HEAD:cook4me-nutrition-enrichment-post-activation-v60
