name: Promote progressive catalog with offline nutrition v60

on:
  push:
    branches:
      - cook4me-progressive-catalog-activation-v60
    paths:
      - .github/workflows/catalog-progressive-promote-v60.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  SOURCE_RUN_ID: '34830320618'
  SOURCE_HEAD_SHA: '7090fa6866bb90b9bda76c45831ac6bb3fc2fe80'

jobs:
  promote-progressive-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install standalone catalog requirements
        run: python -m pip install --disable-pip-version-check 'curl-cffi==0.13.0' 'websocket-client==1.8.0'
      - name: Wait for the single provider-capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 240); do
            line="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + " " + (.conclusion // "")')"
            echo "source run: $line"
            status="${line%% *}"
            conclusion="${line#* }"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "source run failed: $conclusion" >&2; exit 1; }
              exit 0
            fi
            sleep 15
          done
          echo "source run did not complete in time" >&2
          exit 1
      - name: Download exact validated capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-promote"
          mkdir -p "$BUILD/source"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "progressive-catalog-v60-${SOURCE_HEAD_SHA}" \
            --dir "$BUILD/source"
          test -f "$BUILD/source/candidate-catalog.v60.json"
          test -f "$BUILD/source/progressive-catalog-summary.v60.json"
      - name: Recreate exact nutrition queue and compact review targets
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-promote"
          python tools/snapshot_release_catalog_nutrition_queue_v60.py \
            --catalog "$BUILD/source/candidate-catalog.v60.json" \
            --output "$BUILD/nutrition-queue.v60.json" \
            --summary "$BUILD/nutrition-queue-summary.v60.json"
          python tools/compact_release_catalog_nutrition_review_targets_v60.py \
            --queue "$BUILD/nutrition-queue.v60.json" \
            --output "$BUILD/nutrition-review-targets.v60.json" \
            --summary "$BUILD/nutrition-review-targets-summary.v60.json"
      - name: Download pinned public USDA bulk reference data
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-promote"
          python tools/prepare_fdc_reference_data_v60.py \
            --output-dir "$BUILD/fdc-reference-v60" \
            | tee "$BUILD/fdc-reference-summary.v60.json"
      - name: Resolve every already-reviewed exact FDC binding offline
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-promote"
          set +e
          python tools/resolve_reviewed_release_catalog_nutrition_targets_offline_v60.py \
            --targets "$BUILD/nutrition-review-targets.v60.json" \
            --reference-manifest "$BUILD/fdc-reference-v60/reference-manifest.v60.json" \
            --cache "$BUILD/fdc-nutrition-reviewed-v60.json" \
            --review-root tools \
            --pending-output "$BUILD/nutrition-pending.v60.json" \
            | tee "$BUILD/offline-nutrition-resolution-summary.v60.json"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 2 ]]; then
            exit "$rc"
          fi
      - name: Attach reviewed nutrition and regenerate derived indexes offline
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-promote"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'cook4me-progressive-promote'
          sys.path.insert(0, str(Path.cwd() / 'tools'))
          sys.path.insert(0, str(Path.cwd() / 'custom_components' / 'cook4me'))
          import build_release_catalog_v60_reviewed as builder

          captured = json.loads((root / 'source' / 'candidate-catalog.v60.json').read_text(encoding='utf-8'))
          cache = json.loads((root / 'fdc-nutrition-reviewed-v60.json').read_text(encoding='utf-8'))
          result = builder.apply_reviewed_nutrition(captured, cache)
          (root / 'candidate-catalog-reviewed-nutrition.v60.json').write_text(
              json.dumps(result, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Validate progressive final catalog
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-promote"
          python tools/validate_release_catalog_v60.py \
            "$BUILD/candidate-catalog-reviewed-nutrition.v60.json" \
            | tee "$BUILD/final-validation.v60.json"
      - name: Record search and nutrition coverage
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-promote"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'cook4me-progressive-promote'
          sys.path.insert(0, str(Path.cwd() / 'custom_components' / 'cook4me'))
          import catalog_search_index as search

          catalog = root / 'candidate-catalog-reviewed-nutrition.v60.json'
          payload = json.loads(catalog.read_text(encoding='utf-8'))
          prepared = search.prepare_search_index(payload.get('searchIndex') or {})

          def query(value):
              result = search.search_index(prepared, value, language='el', strict_language=False, page=0, size=20)
              return {'query': value, 'total': int(result.get('total') or 0), 'indices': list(result.get('indices') or [])}

          source = payload.get('source') if isinstance(payload.get('source'), dict) else {}
          pending = json.loads((root / 'nutrition-pending.v60.json').read_text(encoding='utf-8'))
          pending_summary = pending.get('summary') if isinstance(pending.get('summary'), dict) else {}
          summary = {
              'catalogVersion': payload.get('catalogVersion'),
              'complete': payload.get('complete') is True,
              'catalogBytes': catalog.stat().st_size,
              'recipes': len(payload.get('recipes') or []),
              'ingredients': len(payload.get('ingredients') or []),
              'auditedCatalogCount': int(source.get('auditedCatalogCount') or 0),
              'sourceCatalogCount': int(source.get('sourceCatalogCount') or 0),
              'nutritionRequiredForComplete': source.get('nutritionRequiredForComplete'),
              'reviewedNutritionResolvedCount': int(source.get('reviewedNutritionResolvedCount') or 0),
              'reviewedNutritionRequiredCount': int(source.get('reviewedNutritionRequiredCount') or 0),
              'foodIntelligenceNutritionResolvedCount': int(source.get('foodIntelligenceNutritionResolvedCount') or 0),
              'foodIntelligenceIngredientCount': int(source.get('foodIntelligenceIngredientCount') or 0),
              'recipeVariantNutritionFullyCoveredCount': int(source.get('recipeVariantNutritionFullyCoveredCount') or 0),
              'recipeVariantNutritionVectorCount': int(source.get('recipeVariantNutritionVectorCount') or 0),
              'pendingReviewTargetCount': int(pending_summary.get('pendingReviewTargetCount') or 0),
              'pendingIdentityCount': int(pending_summary.get('pendingIdentityCount') or 0),
              'networkRequestsForNutrition': False,
              'searchIndexStats': (payload.get('searchIndex') or {}).get('stats') or {},
              'greekRisotto': query('ριζότο'),
              'latinRisotto': query('risotto'),
          }
          if summary['catalogBytes'] >= 95_000_000:
              raise SystemExit(f"catalog too large for safe GitHub storage: {summary['catalogBytes']} bytes")
          if not summary['complete']:
              raise SystemExit('final progressive catalog is not capture-complete')
          if summary['nutritionRequiredForComplete'] is not False:
              raise SystemExit('nutrition is still incorrectly required for catalog activation')
          (root / 'progressive-final-summary.v60.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Verify final artifact contains no secrets
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-promote"
          ! grep -Eiq 'access[_-]?token|refresh[_-]?token|authorization|bearer |password|api[_-]?key|client[_-]?secret' \
            "$BUILD/candidate-catalog-reviewed-nutrition.v60.json" \
            "$BUILD/progressive-final-summary.v60.json"
      - name: Promote exact validated bytes onto continuation branch
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-promote"
          cp "$BUILD/candidate-catalog-reviewed-nutrition.v60.json" \
            custom_components/cook4me/catalog/merged_catalog.v1.json
          cp "$BUILD/progressive-final-summary.v60.json" \
            tools/progressive_catalog_activation_v60_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            custom_components/cook4me/catalog/merged_catalog.v1.json \
            tools/progressive_catalog_activation_v60_summary.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Activate progressive multilingual release catalog v60"
          git push origin HEAD:cook4me-progressive-catalog-activation-v60
      - name: Upload promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: progressive-catalog-promotion-v60-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cook4me-progressive-promote/nutrition-queue-summary.v60.json
            ${{ runner.temp }}/cook4me-progressive-promote/nutrition-review-targets-summary.v60.json
            ${{ runner.temp }}/cook4me-progressive-promote/offline-nutrition-resolution-summary.v60.json
            ${{ runner.temp }}/cook4me-progressive-promote/nutrition-pending.v60.json
            ${{ runner.temp }}/cook4me-progressive-promote/final-validation.v60.json
            ${{ runner.temp }}/cook4me-progressive-promote/progressive-final-summary.v60.json
          if-no-files-found: error
          retention-days: 7
