name: Catalog phase 2 manifest projection repair v59

on:
  push:
    branches:
      - cook4me-release-catalog-cache-progress-v59
    paths:
      - .github/workflows/catalog-phase2-manifest-projection-repair-v59.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply current-manifest cache projection repair
        run: python tools/patch_phase2_current_manifest_export_v59.py
      - name: Validate crawler and assembly boundary
        run: |
          python -m py_compile \
            tools/crawl_release_catalog_v2.py \
            tools/prepare_release_catalog_v2_assembly.py \
            tests/test_release_catalog_v2_crawler.py \
            tests/test_release_catalog_v2_assembly_prep.py
          python tests/test_release_catalog_v2_crawler.py
          python tests/test_release_catalog_v2_assembly_prep.py
          git diff --check
      - name: Commit tested repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/crawl_release_catalog_v2.py tests/test_release_catalog_v2_crawler.py
          git diff --cached --check
          git commit -m "Project catalog cache onto current search manifest"
          git push origin HEAD:cook4me-release-catalog-cache-progress-v59
