name: Repair and promote preserved progressive catalog v60

on:
  push:
    branches:
      - cook4me-progressive-catalog-activation-v60
    paths:
      - .github/workflows/catalog-progressive-repair-promote-v60.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  CAPTURE_RUN_ID: '34833842515'
  CAPTURE_HEAD_SHA: '11f77b687aea2055e1ef2259e622718f2ec1ffc0'
  PROBE_RUN_ID: '34836387461'
  PROBE_HEAD_SHA: '73a36270d0de9fdbbccbdadb7903dcd93aaaea5c'

jobs:
  repair-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install standalone catalog requirements
        run: python -m pip install --disable-pip-version-check 'curl-cffi==0.13.0' 'websocket-client==1.8.0'

      - name: Validate repair/compact code and focused regressions
        run: |
          set -Eeuo pipefail
          python -m compileall -q custom_components/cook4me tests tools
          python -m unittest \
            tests.test_catalog_search_query_localization_v60 \
            tests.test_probe_release_catalog_v60_failed_details \
            tests.test_release_catalog_v60_finalizer \
            -v

      - name: Download preserved capture and exact failed-detail evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          mkdir -p "$BUILD/capture" "$BUILD/probe"
          gh run download "$CAPTURE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "progressive-catalog-capture-diagnostic-v60-${CAPTURE_HEAD_SHA}" \
            --dir "$BUILD/capture"
          gh run download "$PROBE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "failed-detail-evidence-v60-${PROBE_HEAD_SHA}" \
            --dir "$BUILD/probe"
          test -f "$BUILD/capture/captured-semantic-catalog.v60.json"
          test -f "$BUILD/probe/failed-detail-evidence.v60.json"

      - name: Repair only exact stable-manifest 404 rows offline
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          python tools/repair_release_catalog_v60_failed_details_from_probe.py \
            --catalog "$BUILD/capture/captured-semantic-catalog.v60.json" \
            --evidence "$BUILD/probe/failed-detail-evidence.v60.json" \
            --output "$BUILD/repaired-catalog.v60.json" \
            --report "$BUILD/repair-summary.v60.json"

      - name: Recreate nutrition queue from repaired real catalog
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          python tools/snapshot_release_catalog_nutrition_queue_v60.py \
            --catalog "$BUILD/repaired-catalog.v60.json" \
            --output "$BUILD/nutrition-queue.v60.json" \
            --summary "$BUILD/nutrition-queue-summary.v60.json"
          python tools/compact_release_catalog_nutrition_review_targets_v60.py \
            --queue "$BUILD/nutrition-queue.v60.json" \
            --output "$BUILD/nutrition-review-targets.v60.json" \
            --summary "$BUILD/nutrition-review-targets-summary.v60.json"

      - name: Download pinned public USDA bulk reference data
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          python tools/prepare_fdc_reference_data_v60.py \
            --output-dir "$BUILD/fdc-reference-v60" \
            | tee "$BUILD/fdc-reference-summary.v60.json"

      - name: Resolve all already-reviewed exact FDC bindings offline
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          set +e
          python tools/resolve_reviewed_release_catalog_nutrition_targets_offline_v60.py \
            --targets "$BUILD/nutrition-review-targets.v60.json" \
            --reference-manifest "$BUILD/fdc-reference-v60/reference-manifest.v60.json" \
            --cache "$BUILD/fdc-nutrition-reviewed-v60.json" \
            --review-root tools \
            --pending-output "$BUILD/nutrition-pending.v60.json" \
            | tee "$BUILD/offline-nutrition-resolution-summary.v60.json"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 2 ]]; then
            exit "$rc"
          fi

      - name: Attach reviewed nutrition and rebuild derived indexes offline
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'cook4me-progressive-repair'
          sys.path.insert(0, str(Path.cwd() / 'tools'))
          sys.path.insert(0, str(Path.cwd() / 'custom_components' / 'cook4me'))
          import build_release_catalog_v60_reviewed as builder

          captured = json.loads((root / 'repaired-catalog.v60.json').read_text(encoding='utf-8'))
          cache = json.loads((root / 'fdc-nutrition-reviewed-v60.json').read_text(encoding='utf-8'))
          result = builder.apply_reviewed_nutrition(captured, cache)
          (root / 'expanded-reviewed-catalog.v60.json').write_text(
              json.dumps(result, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Compact runtime catalog without dropping recipes or nutrient profiles
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          python tools/compact_release_catalog_v60_runtime.py \
            --catalog "$BUILD/expanded-reviewed-catalog.v60.json" \
            --output "$BUILD/final-runtime-catalog.v60.json" \
            --report "$BUILD/runtime-compaction-summary.v60.json"

      - name: Independently validate repaired compact catalog
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          python tools/validate_release_catalog_v60.py \
            "$BUILD/final-runtime-catalog.v60.json" \
            | tee "$BUILD/final-validation.v60.json"

      - name: Prove Greek cross-language search and on-demand nutrition
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'cook4me-progressive-repair'
          catalog = root / 'final-runtime-catalog.v60.json'
          component = Path.cwd() / 'custom_components' / 'cook4me'
          sys.path.insert(0, str(component))
          import release_catalog_v60_core as runtime

          runtime._CATALOG_PATH = catalog
          runtime.load_release_catalog.cache_clear()
          payload = runtime.load_release_catalog()

          def query(value):
              result = runtime.search_release_recipes(
                  value,
                  language='el',
                  configured_language='de',
                  country='DE',
                  page=0,
                  size=20,
                  strict_language=False,
              )
              items = result.get('items') or []
              return {
                  'query': value,
                  'total': int((result.get('page') or {}).get('totalElements') or 0),
                  'samples': [
                      {
                          'title': row.get('title'),
                          'originalTitle': row.get('originalTitle'),
                          'originalLanguage': row.get('originalLanguage'),
                          'sendable': row.get('sendable'),
                          'nutritionCoverage': (row.get('nutrition') or {}).get('coverage'),
                          'nutritionFullyCovered': (row.get('nutrition') or {}).get('fullyCovered'),
                          'energyKcal': ((row.get('nutrition') or {}).get('totals') or {}).get('energyKcal'),
                      }
                      for row in items[:5]
                      if isinstance(row, dict)
                  ],
              }

          source = payload.get('source') if isinstance(payload.get('source'), dict) else {}
          pending = json.loads((root / 'nutrition-pending.v60.json').read_text(encoding='utf-8'))
          pending_summary = pending.get('summary') if isinstance(pending.get('summary'), dict) else {}
          greek = query('ριζότο')
          latin = query('risotto')
          summary = {
              'catalogVersion': payload.get('catalogVersion'),
              'complete': payload.get('complete') is True,
              'catalogBytes': catalog.stat().st_size,
              'recipes': len(payload.get('recipes') or []),
              'variants': int(payload.get('_runtimeRawVariantCount') or 0),
              'ingredients': len(payload.get('ingredients') or []),
              'auditedCatalogCount': int(source.get('auditedCatalogCount') or 0),
              'sourceCatalogCount': int(source.get('sourceCatalogCount') or 0),
              'detailNotFoundCount': int(source.get('detailNotFoundCount') or 0),
              'failedDetailCount': int(source.get('failedDetailCount') or 0),
              'reviewedNutritionResolvedCount': int(source.get('reviewedNutritionResolvedCount') or 0),
              'reviewedNutritionRequiredCount': int(source.get('reviewedNutritionRequiredCount') or 0),
              'foodIntelligenceNutritionResolvedCount': int(source.get('foodIntelligenceNutritionResolvedCount') or 0),
              'foodIntelligenceIngredientCount': int(source.get('foodIntelligenceIngredientCount') or 0),
              'runtimeNutritionProfileCount': len(payload.get('_runtimeNutritionIndex') or {}),
              'pendingReviewTargetCount': int(pending_summary.get('pendingReviewTargetCount') or 0),
              'pendingIdentityCount': int(pending_summary.get('pendingIdentityCount') or 0),
              'networkRequestsForNutrition': False,
              'searchIndexStats': (payload.get('searchIndex') or {}).get('stats') or {},
              'greekRisotto': greek,
              'latinRisotto': latin,
          }
          if not summary['complete']:
              raise SystemExit('repaired runtime catalog is not complete')
          if summary['failedDetailCount'] != 0 or summary['detailNotFoundCount'] != 1485:
              raise SystemExit('failed-detail repair accounting is not exact')
          if summary['auditedCatalogCount'] != 28:
              raise SystemExit('catalog no longer accounts for all 28 audited mappings')
          if greek['total'] <= 0 or latin['total'] <= 0:
              raise SystemExit('risotto cross-language search produced no results')
          if greek['total'] != latin['total']:
              raise SystemExit('Greek risotto equivalence does not match canonical risotto result set')
          if summary['catalogBytes'] >= 95_000_000:
              raise SystemExit(f"runtime catalog is still too large: {summary['catalogBytes']} bytes")
          (root / 'progressive-final-summary.v60.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Verify final persisted artifacts contain no secrets
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          ! grep -Eiq 'access[_-]?token|refresh[_-]?token|authorization|bearer |password|api[_-]?key|client[_-]?secret' \
            "$BUILD/final-runtime-catalog.v60.json" \
            "$BUILD/progressive-final-summary.v60.json" \
            "$BUILD/repair-summary.v60.json"

      - name: Upload final catalog and promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: progressive-catalog-repaired-v60-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cook4me-progressive-repair/final-runtime-catalog.v60.json
            ${{ runner.temp }}/cook4me-progressive-repair/repair-summary.v60.json
            ${{ runner.temp }}/cook4me-progressive-repair/runtime-compaction-summary.v60.json
            ${{ runner.temp }}/cook4me-progressive-repair/nutrition-queue-summary.v60.json
            ${{ runner.temp }}/cook4me-progressive-repair/nutrition-review-targets-summary.v60.json
            ${{ runner.temp }}/cook4me-progressive-repair/offline-nutrition-resolution-summary.v60.json
            ${{ runner.temp }}/cook4me-progressive-repair/nutrition-pending.v60.json
            ${{ runner.temp }}/cook4me-progressive-repair/final-validation.v60.json
            ${{ runner.temp }}/cook4me-progressive-repair/progressive-final-summary.v60.json
          if-no-files-found: error
          retention-days: 7

      - name: Promote exact validated runtime bytes onto continuation branch
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-progressive-repair"
          cp "$BUILD/final-runtime-catalog.v60.json" \
            custom_components/cook4me/catalog/merged_catalog.v1.json
          cp "$BUILD/progressive-final-summary.v60.json" \
            tools/progressive_catalog_activation_v60_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            custom_components/cook4me/catalog/merged_catalog.v1.json \
            tools/progressive_catalog_activation_v60_summary.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Activate repaired progressive multilingual catalog v60"
          git push origin HEAD:cook4me-progressive-catalog-activation-v60
