name: Apply provider-native catalog names v59

on:
  push:
    branches:
      - cook4me-release-catalog-cache-progress-v59

permissions:
  contents: write

jobs:
  apply-native-names:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reviewed native-name patch
        run: python tools/apply_native_catalog_names_v59.py

      - name: Run release-catalog regressions
        run: |
          python -m py_compile \
            tools/build_release_catalog.py \
            tools/prepare_release_catalog_v2_assembly.py \
            custom_components/cook4me/release_catalog.py
          python -m unittest discover -s tests -p 'test_release_catalog.py' -v
          python -m unittest discover -s tests -p 'test_release_catalog_v2_assembly_prep.py' -v
          python -m unittest discover -s tests -p 'test_release_catalog_native_names_v59.py' -v
          npm install --no-save --package-lock=false linkedom@0.18.12
          node --experimental-default-type=module tests/frontend_v59_regression_smoke.mjs

      - name: Commit tested production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/build_release_catalog.py \
            tools/prepare_release_catalog_v2_assembly.py \
            custom_components/cook4me/release_catalog.py \
            custom_components/cook4me/frontend/cook4me-panel-v59.js
          git diff --cached --check
          git commit -m "Preserve provider-native recipe and ingredient names"
          git push origin HEAD:cook4me-release-catalog-cache-progress-v59
