name: Compile post-activation nutrition review decisions v60

on:
  push:
    branches:
      - cook4me-nutrition-enrichment-post-activation-v60
    paths:
      - .github/workflows/catalog-nutrition-review-recompile-v60.yml
      - tools/release_catalog_nutrition_review_decisions_post_activation_*.v1.json
  workflow_dispatch:

concurrency:
  group: catalog-nutrition-review-compile-v60
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: cook4me-nutrition-enrichment-post-activation-v60
      ARCHIVE_TAG: nutrition-evidence-v60-archive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cook4me-nutrition-enrichment-post-activation-v60
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Select changed decision batches
        id: scope
        run: |
          set -Eeuo pipefail
          CHANGED="$(git diff --name-only HEAD^ HEAD || true)"
          echo "$CHANGED"
          echo "$CHANGED" | sed -nE 's#^tools/release_catalog_nutrition_review_decisions_post_activation_([0-9]+)\.v1\.json$#\1#p' | sort -nu > /tmp/compile-batches.txt
          COUNT="$(wc -l < /tmp/compile-batches.txt)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "batches to compile:"
          cat /tmp/compile-batches.txt || true

      - name: Compile exact review files
        if: steps.scope.outputs.count != '0'
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/nutrition-compile
          test "$(gh release view "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"
          while IFS= read -r BATCH; do
            test -n "$BATCH"
            DECISION="tools/release_catalog_nutrition_review_decisions_post_activation_${BATCH}.v1.json"
            REVIEW="tools/release_catalog_reviewed_nutrition_targets_${BATCH}.v1.json"
            SHA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["sourceEvidenceSha256"])' "$DECISION")"
            KIND="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["kind"])' "$DECISION")"
            ASSET="fdc-candidate-evidence-v60-${SHA}.json.gz"
            EVIDENCE="/tmp/nutrition-compile/evidence-${SHA}.json"
            if [ ! -f "$EVIDENCE" ]; then
              gh release download "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/nutrition-compile --pattern "$ASSET"
              gzip -cd "/tmp/nutrition-compile/$ASSET" > "$EVIDENCE"
              test "$(sha256sum "$EVIDENCE" | awk '{print $1}')" = "$SHA"
            fi
            OUT="/tmp/nutrition-compile/review-${BATCH}.json"
            SUMMARY="/tmp/nutrition-compile/summary-${BATCH}.json"
            rm -f "$OUT" "$SUMMARY"
            if [ "$KIND" = "cook4me-fdc-review-decisions-v60" ]; then
              COMPILER=tools/compile_release_catalog_fdc_review_decisions_v60.py
            elif [ "$KIND" = "cook4me-fdc-retained-reference-review-decisions-v60" ]; then
              COMPILER=tools/compile_release_catalog_fdc_retained_review_decisions_v60.py
            else
              echo "Unsupported decision kind: $KIND" >&2
              exit 1
            fi
            python "$COMPILER" --evidence "$EVIDENCE" --decisions "$DECISION" --output "$OUT" --summary-output "$SUMMARY"
            cp "$OUT" "$REVIEW"
            cat "$SUMMARY"
          done < /tmp/compile-batches.txt

      - name: Prove complete review corpus uniqueness
        if: steps.scope.outputs.count != '0'
        run: |
          set -Eeuo pipefail
          python -c 'from pathlib import Path; import sys; sys.path.insert(0,"tools"); import snapshot_nutrition_review_checkpoint_v60 as c; print(c.build_checkpoint(Path("tools"))["summary"])'

      - name: Commit compiler-generated review files
        if: steps.scope.outputs.count != '0'
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r BATCH; do
            test -n "$BATCH"
            git add "tools/release_catalog_reviewed_nutrition_targets_${BATCH}.v1.json"
          done < /tmp/compile-batches.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "All selected reviews already match compiler output."
          else
            git commit -m "Compile post-activation nutrition review files"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Dispatch fast review validator
        if: steps.scope.outputs.count != '0'
        run: |
          set -Eeuo pipefail
          gh workflow run catalog-nutrition-review-decisions-v60.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
