name: Recompile accelerated nutrition reviews v60

on:
  push:
    branches:
      - cook4me-nutrition-enrichment-post-activation-v60
    paths:
      - .github/workflows/catalog-nutrition-review-recompile-v60.yml
  workflow_dispatch:

concurrency:
  group: catalog-nutrition-review-recompile-v60
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  recompile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: cook4me-nutrition-enrichment-post-activation-v60
      ARCHIVE_TAG: nutrition-evidence-v60-archive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cook4me-nutrition-enrichment-post-activation-v60
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fast-forward to latest nutrition head
        run: |
          set -Eeuo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

      - name: Recompile batches 138 through 140
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/nutrition-recompile
          test "$(gh release view "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"
          for BATCH in 138 139 140; do
            DECISION="tools/release_catalog_nutrition_review_decisions_post_activation_${BATCH}.v1.json"
            REVIEW="tools/release_catalog_reviewed_nutrition_targets_${BATCH}.v1.json"
            SHA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["sourceEvidenceSha256"])' "$DECISION")"
            KIND="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["kind"])' "$DECISION")"
            ASSET="fdc-candidate-evidence-v60-${SHA}.json.gz"
            EVIDENCE="/tmp/nutrition-recompile/evidence-${SHA}.json"
            if [ ! -f "$EVIDENCE" ]; then
              gh release download "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/nutrition-recompile --pattern "$ASSET"
              gzip -cd "/tmp/nutrition-recompile/$ASSET" > "$EVIDENCE"
              test "$(sha256sum "$EVIDENCE" | awk '{print $1}')" = "$SHA"
            fi
            OUT="/tmp/nutrition-recompile/review-${BATCH}.json"
            SUMMARY="/tmp/nutrition-recompile/summary-${BATCH}.json"
            rm -f "$OUT" "$SUMMARY"
            if [ "$KIND" = "cook4me-fdc-review-decisions-v60" ]; then
              COMPILER=tools/compile_release_catalog_fdc_review_decisions_v60.py
            elif [ "$KIND" = "cook4me-fdc-retained-reference-review-decisions-v60" ]; then
              COMPILER=tools/compile_release_catalog_fdc_retained_review_decisions_v60.py
            else
              echo "Unsupported decision kind: $KIND" >&2
              exit 1
            fi
            python "$COMPILER" --evidence "$EVIDENCE" --decisions "$DECISION" --output "$OUT" --summary-output "$SUMMARY"
            cp "$OUT" "$REVIEW"
            cat "$SUMMARY"
          done

      - name: Prove corpus uniqueness
        run: |
          set -Eeuo pipefail
          python -c 'from pathlib import Path; import sys; sys.path.insert(0,"tools"); import snapshot_nutrition_review_checkpoint_v60 as c; print(c.build_checkpoint(Path("tools"))["summary"])'

      - name: Commit exact compiler outputs
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/release_catalog_reviewed_nutrition_targets_138.v1.json tools/release_catalog_reviewed_nutrition_targets_139.v1.json tools/release_catalog_reviewed_nutrition_targets_140.v1.json
          if git diff --cached --quiet; then
            echo "Review files already match compiler output."
          else
            git commit -m "Recompile accelerated nutrition batches 138-140"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Dispatch fail-closed validator
        run: |
          set -Eeuo pipefail
          gh workflow run catalog-nutrition-review-decisions-v60.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
