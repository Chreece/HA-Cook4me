name: Catalog phase 3 exact candidate semantics v59

on:
  push:
    branches:
      - cook4me-catalog-phase3-staging-v59
    paths:
      - .github/workflows/catalog-phase3-exact-candidate-v59.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact-candidate food semantics patch
        run: python tools/patch_phase3_exact_candidate_food_v59.py
      - name: Validate review overlay
        run: |
          python -m py_compile tools/apply_release_catalog_reviews_v2.py tests/test_release_catalog_review_overlay.py
          python tests/test_release_catalog_review_overlay.py
          git diff --check
      - name: Commit tested exact-candidate semantics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/apply_release_catalog_reviews_v2.py tests/test_release_catalog_review_overlay.py
          git diff --cached --check
          git commit -m "Resolve exact keyless provider food semantics"
          git push origin HEAD:cook4me-catalog-phase3-staging-v59
