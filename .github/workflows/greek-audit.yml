name: Greek audit regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: greek-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  greek-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate new Greek overlays against repository data
        run: python -m unittest discover -s tests -p 'test_greek_catalog_audit_v19*.py' -v
