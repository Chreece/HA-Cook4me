name: Build post-activation nutrition review proposals v60

on:
  push:
    branches:
      - cook4me-nutrition-enrichment-post-activation-v60
    paths:
      - custom_components/cook4me/catalog/merged_catalog.v1.json
      - .github/workflows/catalog-nutrition-review-reuse-post-activation-v60.yml
      - tools/propose_release_catalog_nutrition_review_reuse_v60.py
      - tools/propose_release_catalog_nutrition_review_similarity_v60.py
      - tests/test_release_catalog_nutrition_review_reuse_proposal_v60.py
      - tests/test_release_catalog_nutrition_review_similarity_proposal_v60.py
  workflow_dispatch:
    inputs:
      evidence_head_sha:
        description: Optional exact catalog/evidence commit SHA to review
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build-review-proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evidence_head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run review proposal regressions
        run: |
          set -Eeuo pipefail
          python -m unittest \
            tests.test_release_catalog_nutrition_review_reuse_proposal_v60 \
            tests.test_release_catalog_nutrition_review_similarity_proposal_v60 \
            -v

      - name: Resolve post-activation evidence for this catalog snapshot
        id: evidence
        env:
          REQUESTED_EVIDENCE_HEAD_SHA: ${{ inputs.evidence_head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          TARGET_SHA="${REQUESTED_EVIDENCE_HEAD_SHA:-}"

          if [ -z "$TARGET_SHA" ] && [ "$EVENT_NAME" = "push" ]; then
            CATALOG_CHANGED="$(
              python - <<'PY'
          import json
          import os

          catalog = "custom_components/cook4me/catalog/merged_catalog.v1.json"
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          changed = set()
          for commit in event.get("commits") or []:
              for key in ("added", "modified", "removed"):
                  changed.update(commit.get(key) or [])
          head = event.get("head_commit")
          if isinstance(head, dict):
              for key in ("added", "modified", "removed"):
                  changed.update(head.get(key) or [])
          print("true" if catalog in changed else "false")
          PY
            )"
            if [ "$CATALOG_CHANGED" = "true" ]; then
              TARGET_SHA="$EVENT_SHA"
              echo "Catalog promotion detected; requiring evidence for exact head $TARGET_SHA"
            fi
          fi

          if [ -n "$TARGET_SHA" ]; then
            if ! [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid evidence head SHA: $TARGET_SHA" >&2
              false
            fi
            TARGET_SHA="${TARGET_SHA,,}"
            for attempt in $(seq 1 90); do
              ROW="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow catalog-nutrition-enrichment-evidence-v60.yml \
                  --branch cook4me-nutrition-enrichment-post-activation-v60 \
                  --commit "$TARGET_SHA" \
                  --limit 20 \
                  --json databaseId,headSha,status,conclusion \
                  --jq 'if length == 0 then "" else .[0] | [.databaseId, .headSha, .status, (.conclusion // "-")] | @tsv end'
              )"
              if [ -n "$ROW" ]; then
                IFS=$'\t' read -r RUN_ID HEAD_SHA STATUS CONCLUSION <<< "$ROW"
                HEAD_SHA="${HEAD_SHA,,}"
                if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
                  echo "Evidence query returned unexpected head $HEAD_SHA for requested $TARGET_SHA" >&2
                  false
                fi
                if [ "$STATUS" = "completed" ]; then
                  if [ "$CONCLUSION" != "success" ]; then
                    echo "Exact evidence run $RUN_ID for $TARGET_SHA completed with $CONCLUSION" >&2
                    false
                  fi
                  echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                  echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
                  echo "Using exact nutrition evidence run $RUN_ID at $HEAD_SHA"
                  exit 0
                fi
                echo "Exact evidence run $RUN_ID for $TARGET_SHA is $STATUS (attempt $attempt/90)"
              else
                echo "Waiting for evidence run for exact head $TARGET_SHA (attempt $attempt/90)"
              fi
              sleep 10
            done
            echo "Timed out waiting for successful evidence at exact head $TARGET_SHA" >&2
            false
          fi

          ROW="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow catalog-nutrition-enrichment-evidence-v60.yml \
              --branch cook4me-nutrition-enrichment-post-activation-v60 \
              --status success \
              --limit 1 \
              --json databaseId,headSha \
              --jq 'if length == 0 then "" else .[0] | [.databaseId, .headSha] | @tsv end'
          )"
          IFS=$'\t' read -r RUN_ID HEAD_SHA <<< "$ROW"
          if [ -z "$RUN_ID" ] || [ -z "$HEAD_SHA" ]; then
            echo "Unable to resolve the latest successful nutrition evidence run: $ROW" >&2
            false
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "No catalog promotion SHA required; using latest successful nutrition evidence run $RUN_ID at $HEAD_SHA"

      - name: Download resolved post-activation evidence
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/nutrition-evidence /tmp/nutrition-review-proposals
          mkdir -p /tmp/nutrition-evidence /tmp/nutrition-review-proposals
          gh run download "${{ steps.evidence.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "nutrition-enrichment-evidence-v60-${{ steps.evidence.outputs.head_sha }}" \
            --dir /tmp/nutrition-evidence
          test -s /tmp/nutrition-evidence/fdc-candidate-evidence.v60.json

      - name: Build exact-canonical historical reuse proposals
        run: |
          set -Eeuo pipefail
          python tools/propose_release_catalog_nutrition_review_reuse_v60.py \
            --candidates /tmp/nutrition-evidence/fdc-candidate-evidence.v60.json \
            --review-root tools \
            --output /tmp/nutrition-review-proposals/exact-reuse-proposal.v60.json \
            --summary-output /tmp/nutrition-review-proposals/exact-reuse-summary.v60.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/nutrition-review-proposals/exact-reuse-summary.v60.json').read_text(encoding='utf-8'))
          if summary.get('selectionCount') != 0:
              raise SystemExit(f"exact reuse proposal unexpectedly selected bindings: {summary}")
          if summary.get('networkRequestsPerformed') is not False or summary.get('secretsPersisted') is not False:
              raise SystemExit(f"exact reuse proposal violated offline/privacy contract: {summary}")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Build semantic-history reviewer suggestions
        run: |
          set -Eeuo pipefail
          python tools/propose_release_catalog_nutrition_review_similarity_v60.py \
            --candidates /tmp/nutrition-evidence/fdc-candidate-evidence.v60.json \
            --review-root tools \
            --output /tmp/nutrition-review-proposals/semantic-history-suggestions.v60.json \
            --summary-output /tmp/nutrition-review-proposals/semantic-history-summary.v60.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/nutrition-review-proposals/semantic-history-summary.v60.json').read_text(encoding='utf-8'))
          if summary.get('selectionCount') != 0:
              raise SystemExit(f"semantic history helper unexpectedly selected bindings: {summary}")
          if summary.get('networkRequestsPerformed') is not False or summary.get('secretsPersisted') is not False:
              raise SystemExit(f"semantic history helper violated offline/privacy contract: {summary}")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload post-activation review proposals
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-review-proposals-v60-${{ steps.evidence.outputs.head_sha }}
          path: /tmp/nutrition-review-proposals
          if-no-files-found: error
          retention-days: 7
