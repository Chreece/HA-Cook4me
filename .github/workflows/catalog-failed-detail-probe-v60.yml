name: Probe preserved failed catalog details v60

on:
  push:
    branches:
      - cook4me-progressive-catalog-activation-v60
    paths:
      - .github/workflows/catalog-failed-detail-probe-v60.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: '34833842515'
  SOURCE_ARTIFACT: 'progressive-catalog-capture-diagnostic-v60-11f77b687aea2055e1ef2259e622718f2ec1ffc0'

jobs:
  probe-failed-details:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install standalone catalog requirements
        run: python -m pip install --disable-pip-version-check 'curl-cffi==0.13.0' 'websocket-client==1.8.0'
      - name: Download preserved capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-failed-detail-probe"
          mkdir -p "$BUILD/source"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir "$BUILD/source"
          test -f "$BUILD/source/captured-semantic-catalog.v60.json"
      - name: Probe only currently missing provider detail IDs
        run: |
          set -Eeuo pipefail
          BUILD="$RUNNER_TEMP/cook4me-failed-detail-probe"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'cook4me-failed-detail-probe'
          repo = Path.cwd()
          sys.path.insert(0, str(repo / 'tools'))
          sys.path.insert(0, str(repo / 'custom_components' / 'cook4me'))

          import probe_release_catalog_v60_failed_details as probe

          catalog = json.loads(
              (root / 'source' / 'captured-semantic-catalog.v60.json').read_text(encoding='utf-8')
          )
          cfg = probe.v59.c4m.read_apk_config(None)
          tokens = {}
          pcfg = probe.v59.catalog._platform_context(cfg, 'DE', 'de', probe.v59.APP_VERSION)
          result = probe.probe(
              catalog,
              cfg=cfg,
              tokens=tokens,
              pcfg=pcfg,
              configured_language='de',
              configured_country='DE',
              workers=4,
          )
          out = root / 'failed-detail-evidence.v60.json'
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          summary = result.get('summary') or {}
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if int(summary.get('declaredFailedDetailCount') or 0) != 1485:
              raise SystemExit('preserved capture failure count changed unexpectedly')
          PY
      - name: Upload failed-detail evidence
        uses: actions/upload-artifact@v4
        with:
          name: failed-detail-evidence-v60-${{ github.sha }}
          path: ${{ runner.temp }}/cook4me-failed-detail-probe/failed-detail-evidence.v60.json
          if-no-files-found: error
          retention-days: 7
