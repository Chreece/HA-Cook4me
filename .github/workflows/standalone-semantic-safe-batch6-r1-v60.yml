name: Merge canonical standalone semantic batch 6 r1 v60

on:
  push:
    branches:
      - cook4me-ingredient-semantic-confirmation-v60
    paths:
      - '.github/workflows/standalone-semantic-safe-batch6-r1-v60.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-safe-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile canonical baseline
        run: |
          set -Eeuo pipefail
          python tools/compile_release_catalog_semantics_v60.py \
            --reviews-dir tools \
            --output "$RUNNER_TEMP/semantic-before.json" \
            > "$RUNNER_TEMP/semantic-before-summary.json"

      - name: Remove existing source-local equivalence root from batch
        run: |
          set -Eeuo pipefail
          python tools/prepare_safe_standalone_semantic_batch6_r1_v60.py
          git diff --check

      - name: Apply evidence-pinned canonical merge batch
        run: |
          set -Eeuo pipefail
          python tools/apply_safe_standalone_semantic_batch6_v60.py
          git diff --check

      - name: Run semantic and alias regressions
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_compile_release_catalog_semantics_v60.py' -v
          python -m unittest discover -s tests -p 'test_semantic_standalone_dispositions_v60.py' -v
          python -m unittest discover -s tests -p 'test_semantic_standalone_equivalences_v60.py' -v
          python -m unittest discover -s tests -p 'test_semantic_standalone_manual_equivalences_v60.py' -v
          python -m unittest discover -s tests -p 'test_semantic_high_confidence_syntax_aliases_v60.py' -v
          python -m unittest discover -s tests -p 'test_nutrition_semantic_syntax_aliases_v60.py' -v

      - name: Prove exact canonical semantic delta
        run: |
          set -Eeuo pipefail
          python tools/compile_release_catalog_semantics_v60.py \
            --reviews-dir tools \
            --output "$RUNNER_TEMP/semantic-after.json" \
            > "$RUNNER_TEMP/semantic-after-summary.json"
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          before = json.loads(Path(os.environ['RUNNER_TEMP'], 'semantic-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path(os.environ['RUNNER_TEMP'], 'semantic-after.json').read_text(encoding='utf-8'))
          helper_path = root / 'tools/apply_safe_standalone_semantic_batch6_v60.py'
          spec = importlib.util.spec_from_file_location('cook4me_batch6_r1_proof', helper_path)
          helper = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(helper)
          decisions = helper.DECISIONS
          delta = len(decisions)
          if delta != 9:
              raise SystemExit(f'expected nine reviewed decisions, got {delta}')

          bs = before['summary']
          a = after['summary']
          if bs['needsSemanticConfirmationSourceLabels'] != 0 or a['needsSemanticConfirmationSourceLabels'] != 0:
              raise SystemExit('batch 6 r1 must preserve zero pending semantics')
          if bs['standaloneConfirmedSourceLabels'] - a['standaloneConfirmedSourceLabels'] != delta:
              raise SystemExit('standalone decrement mismatch')
          if a['semanticEquivalentConfirmedSourceLabels'] - bs['semanticEquivalentConfirmedSourceLabels'] != delta:
              raise SystemExit('manual semantic equivalence increment mismatch')
          if bs['semanticConcepts'] - a['semanticConcepts'] != delta:
              raise SystemExit('semantic concept consolidation mismatch')
          if a['reviewedAmbiguousSourceLabels'] != bs['reviewedAmbiguousSourceLabels']:
              raise SystemExit('ambiguous reviewed closure count changed')
          if a['standaloneEquivalentSourceLabels'] != bs['standaloneEquivalentSourceLabels']:
              raise SystemExit('source-local equivalence count changed')
          if a.get('highConfidenceSyntaxAliasConcepts') != bs.get('highConfidenceSyntaxAliasConcepts'):
              raise SystemExit('high-confidence alias concept count changed')
          if a.get('highConfidenceSyntaxAliasSourceLabels') != bs.get('highConfidenceSyntaxAliasSourceLabels'):
              raise SystemExit('high-confidence alias source count changed')
          if len(after['sourceIdentityToConcept']) != len(before['sourceIdentityToConcept']):
              raise SystemExit('raw source identity count changed')
          if set(after['sourceIdentityToConcept']) != set(before['sourceIdentityToConcept']):
              raise SystemExit('raw source identity set changed')

          standalone = json.loads((root / 'tools/release_catalog_semantic_standalone_dispositions.v1.json').read_text(encoding='utf-8'))
          equivalences = json.loads((root / 'tools/release_catalog_semantic_standalone_equivalences.v1.json').read_text(encoding='utf-8'))
          standalone_ids = {row['sourceIngredientId'] for row in standalone.get('items') or [] if isinstance(row, dict)}
          equivalence_target_ids = {row['targetSourceIngredientId'] for row in equivalences.get('items') or [] if isinstance(row, dict)}
          preserved_root = 'local:uk:3a54c3b6158ad1e7b926'
          if preserved_root not in standalone_ids or preserved_root not in equivalence_target_ids:
              raise SystemExit('existing parsley source-local equivalence root was not preserved')

          confirmations = json.loads((root / 'tools/release_catalog_semantic_confirmations.v1.json').read_text(encoding='utf-8'))
          confirmation_rows = {row['sourceIngredientId']: row for row in confirmations.get('items') or [] if isinstance(row, dict) and row.get('sourceIngredientId')}
          mapping = after['sourceIdentityToConcept']
          concepts = {row['conceptId']: row for row in after.get('concepts') or []}
          for decision in decisions:
              source_id = decision['sourceIngredientId']
              concept_id = decision['confirmedConceptId']
              if source_id in standalone_ids:
                  raise SystemExit(f'batch-6-r1 source still standalone: {source_id}')
              if mapping.get(source_id) != concept_id:
                  raise SystemExit(f'batch-6-r1 source mapped to wrong concept: {source_id}')
              row = confirmation_rows.get(source_id)
              if not row or row.get('manualSemanticEquivalence') is not True:
                  raise SystemExit(f'manual confirmation receipt missing: {source_id}')
              if row.get('sourceReviewedEnglish') != decision['sourceReviewedEnglish']:
                  raise SystemExit(f'source reviewed-English receipt drift: {source_id}')
              if row.get('targetCanonicalEnglish') != decision['targetCanonicalEnglish']:
                  raise SystemExit(f'target canonical-English receipt drift: {source_id}')
              concept = concepts[concept_id]
              if any(concept.get(key) is not True for key in ('nutritionEligible','dietEligible','allergenEligible')):
                  raise SystemExit(f'batch-6-r1 target lost food-intelligence eligibility: {concept_id}')

          if int(standalone['summary']['reviewedAmbiguousCount']) != 28:
              raise SystemExit('reviewed ambiguous count must remain 28')
          print(json.dumps({
              'mergedFromStandalone': delta,
              'standaloneBefore': bs['standaloneConfirmedSourceLabels'],
              'standaloneAfter': a['standaloneConfirmedSourceLabels'],
              'manualHighConfidenceEquivalenceBefore': bs['semanticEquivalentConfirmedSourceLabels'],
              'manualHighConfidenceEquivalenceAfter': a['semanticEquivalentConfirmedSourceLabels'],
              'semanticConceptsBefore': bs['semanticConcepts'],
              'semanticConceptsAfter': a['semanticConcepts'],
              'preservedEquivalenceRoot': preserved_root,
              'rawSourceIdentityCount': len(after['sourceIdentityToConcept']),
              'ambiguousAfter': a['reviewedAmbiguousSourceLabels'],
              'pendingAfter': a['needsSemanticConfirmationSourceLabels'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit validated canonical merges
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/release_catalog_semantic_confirmations.v1.json \
            tools/release_catalog_semantic_standalone_dispositions.v1.json
          git diff --cached --check
          git commit -m 'Merge canonical standalone ingredient semantics batch 6 r1 v60'
          git push origin HEAD:cook4me-ingredient-semantic-confirmation-v60
