name: Nutrition review checkpoint

on:
  pull_request:
    paths:
      - 'tools/release_catalog_reviewed_nutrition_targets*.v1.json'
      - 'tools/snapshot_nutrition_review_checkpoint_v60.py'
      - 'tests/test_nutrition_review_checkpoint_v60.py'
      - 'tools/nutrition_review_holds_v60.py'
      - 'tools/prepare_nutrition_review_worklist_v60.py'
      - 'tools/prepare_nutrition_target_context_v60.py'
      - 'tools/release_catalog_nutrition_context_findings.v1.json'
      - 'tests/fixtures/nutrition-batch36-context-subset-v60.json.gz'
      - 'tools/release_catalog_nutrition_review_blockers.v1.json'
      - 'tests/fixtures/nutrition-batch35-evidence-requirements-v60.json.gz'
      - 'tools/release_catalog_nutrition_review_holds.v1.json'
      - 'tests/test_nutrition_review_holds_v60.py'
      - 'tests/test_release_catalog_nutrition_review_batch*_v60.py'
      - 'tests/fixtures/nutrition-batch*-retained-reference-v60.json.gz'
      - 'tests/fixtures/nutrition-hold-evidence-subset-v60.json.gz'
      - '.github/workflows/nutrition-review-checkpoint-v60.yml'

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create maintenance virtual environment
        run: python -m venv "$RUNNER_TEMP/cook4me-venv"
      - name: Test checkpoint, reconciliation, and nutrition hold safeguards
        run: '"$RUNNER_TEMP/cook4me-venv/bin/python" -m unittest discover -s tests -p "test_nutrition_review_*v60.py" -v'
      - name: Test frozen historical nutrition review batches
        run: |
          set -Eeuo pipefail
          HISTORICAL_TMP="$RUNNER_TEMP/post-activation-review-files"
          mkdir -p "$HISTORICAL_TMP"
          restore_post_activation_reviews() {
            shopt -s nullglob
            for file in "$HISTORICAL_TMP"/*.json; do
              mv "$file" tools/
            done
          }
          trap restore_post_activation_reviews EXIT

          # Batch-42..50 regressions intentionally freeze the review corpus that
          # existed before post-activation enrichment. Keep later reviewed target
          # files out of that historical view, then restore them before the full
          # checkpoint snapshot below.
          for number in $(seq 46 99); do
            file=$(printf 'tools/release_catalog_reviewed_nutrition_targets_%03d.v1.json' "$number")
            if [[ -f "$file" ]]; then
              mv "$file" "$HISTORICAL_TMP/"
            fi
          done

          "$RUNNER_TEMP/cook4me-venv/bin/python" -m unittest discover \
            -s tests -p "test_release_catalog_nutrition_review_batch*_v60.py" -v
      - name: Snapshot every recorded binding at this exact source commit
        run: |
          "$RUNNER_TEMP/cook4me-venv/bin/python" tools/snapshot_nutrition_review_checkpoint_v60.py \
            --source-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/nutrition-checkpoint"
          git archive --format=tar.gz --output="$RUNNER_TEMP/nutrition-checkpoint/source.tar.gz" HEAD
      - name: Preserve reproducible review checkpoint and tracked source
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-review-checkpoint-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/nutrition-checkpoint/
          if-no-files-found: error
          retention-days: 7
