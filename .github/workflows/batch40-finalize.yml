              '99ced9d663a00b62ae8436e661a330e05faf9f92',
              'cba55aeb7450d129a2f82e19825119a99ef31b72',
              '07e535a52d9705ddc5d528f3900b4e95ac3b5c3d',
          ]
          FILES = [
              'docs/nutrition-review-batch40-bulk-families-v60.md',
              'tests/fixtures/nutrition-batch40-retained-reference-v60.json.gz',
              'tests/test_release_catalog_nutrition_review_batch39_v60.py',
              'tests/test_release_catalog_nutrition_review_batch40_v60.py',
              'tools/classify_nutrition_review_queue_v60.py',
              'tools/release_catalog_nutrition_bulk_family_rules_batch40.v1.json',
              'tools/release_catalog_reviewed_nutrition_targets_044.v1.json',
              'tools/release_catalog_reviewed_nutrition_targets_044b.v1.json',
              'tools/release_catalog_reviewed_nutrition_targets_044c.v1.json',
              'tools/release_catalog_reviewed_nutrition_targets_044d.v1.json',
              'tools/release_catalog_reviewed_nutrition_targets_044e.v1.json',
              'tools/release_catalog_reviewed_nutrition_targets_044f.v1.json',
          ]

          encoded_parts = []
          for i, sha in enumerate(BLOBS):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{REPO}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {TOKEN}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      obj = json.load(response)
              except Exception as exc:
                  raise SystemExit(f'missing/unreadable Batch 40 blob index={i} sha={sha}: {exc}')
              data = base64.b64decode(obj['content'])
              git_sha = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              if git_sha != sha:
                  raise SystemExit(f'Git blob digest mismatch index={i}: {git_sha} != {sha}')
              encoded_parts.append(data)

          encoded = b''.join(encoded_parts)
          try:
              payload = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f'invalid Batch 40 base64 transport: {exc}')
          if hashlib.sha256(payload).hexdigest() != PAYLOAD_SHA:
              raise SystemExit('Batch 40 payload sha256 mismatch')

          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as tf:
              members = tf.getmembers()
              if [m.name for m in members] != FILES:
                  raise SystemExit('Batch 40 payload path set/order mismatch')
              for member in members:
                  p = pathlib.PurePosixPath(member.name)
                  if not member.isfile() or p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe Batch 40 tar member: {member.name}')
                  want_mode = 0o755 if member.name == 'tools/classify_nutrition_review_queue_v60.py' else 0o644
                  if (member.mode & 0o777) != want_mode:
                      raise SystemExit(f'Batch 40 mode mismatch: {member.name}')
                  src = tf.extractfile(member)
                  if src is None:
                      raise SystemExit(f'missing Batch 40 member bytes: {member.name}')
                  data = src.read()
                  dest = ROOT / member.name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
                  os.chmod(dest, want_mode)
          print(f'materialized {len(FILES)} Batch 40 files; payload sha256={PAYLOAD_SHA}')
          PY
      - name: Validate exact Batch 40 source
        run: |
          export TMPDIR="$RUNNER_TEMP"
          python scripts/version.py validate
          python -m compileall -q custom_components/cook4me tests tools
          python - <<'PY'
          import json
          from pathlib import Path
          count = 0
          for p in Path('.').rglob('*.json'):
              if '.git' not in p.parts:
                  json.loads(p.read_text(encoding='utf-8'))
                  count += 1
          print(f'JSON OK: {count}')
          PY
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n
          for f in custom_components/cook4me/frontend/cook4me-panel-v*.js; do node --check "$f"; done
          python -m unittest discover -s tests -v
      - name: Push validated Batch 40 source
        run: |
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$HEAD_BRANCH)" || { echo 'Branch advanced; newer run must finalize it'; exit 78; }
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize and validate Batch 40 bulk nutrition reviews'
          git push origin "HEAD:$HEAD_BRANCH"
