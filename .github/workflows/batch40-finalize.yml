name: Finalize and validate Batch 40

on:
  pull_request:
    paths:
      - '.batch40-bootstrap/**'
      - '.github/workflows/batch40-finalize.yml'

permissions:
  contents: write

concurrency:
  group: batch40-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact Batch 40 payload
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, io, os, pathlib, tarfile
          ROOT = pathlib.Path.cwd()
          PAYLOAD_SHA = 'b37496856a690426c98e64553a5161998613d1e36aec341d42b07a9c2474bdf8'
          PARTS = [
              '.batch40-bootstrap/chunks/chunk-000', '.batch40-bootstrap/chunks/chunk-001',
              '.batch40-bootstrap/chunks/chunk-002', '.batch40-bootstrap/chunks/chunk-004',
              '.batch40-bootstrap/chunks/chunk-005', '.batch40-bootstrap/chunks/chunk-006',
              '.batch40-bootstrap/chunks/chunk-007', '.batch40-bootstrap/chunks/chunk-008',
              '.batch40-bootstrap/chunks/chunk-009', '.batch40-bootstrap/chunks/chunk-010',
              '.batch40-bootstrap/chunks/chunk-011', '.batch40-bootstrap/chunks/chunk-012',
              '.batch40-bootstrap/chunks/chunk-014', '.batch40-bootstrap/chunks/chunk-015',
              '.batch40-bootstrap/repair/part-0', '.batch40-bootstrap/repair/part-1',
              '.batch40-bootstrap/repair/part-2', '.batch40-bootstrap/repair/part-3',
              '.batch40-bootstrap/repair/part-4', '.batch40-bootstrap/repair/part-5',
              '.batch40-bootstrap/chunks/chunk-019',
          ]
          TAIL_FIX = {
              '.batch40-bootstrap/repair/part-2': 'J',
              '.batch40-bootstrap/repair/part-5': 'P',
          }
          FILES = {
              'docs/nutrition-review-batch40-bulk-families-v60.md': ('c227c69267cd8b46e6cdbba5d381ae30442ce944bf20357f1c5c3c02a6c07236', 0o644),
              'tests/fixtures/nutrition-batch40-retained-reference-v60.json.gz': ('4d62f672b126228294a07997c3b3db4bf4234f4a4ebfed24033432a8ec4f1e5a', 0o644),
              'tests/test_release_catalog_nutrition_review_batch39_v60.py': ('73ccf64d67b74a08cc38ddf8ea8b13eec53a7072773c18813898fe83de8c7d9f', 0o644),
              'tests/test_release_catalog_nutrition_review_batch40_v60.py': ('6a0d54cef8f45bacef55dd3c43887141e8ec826cceac485a2d47dc29a3713a47', 0o644),
              'tools/classify_nutrition_review_queue_v60.py': ('5a501c7f34fdcad6a3f7c3b9bc4c59f6e0724f8d0b778a152847f9647b96d78b', 0o755),
              'tools/release_catalog_nutrition_bulk_family_rules_batch40.v1.json': ('1f9cc8b052ae8e06ebe22bc26953ea16e159df739e150deb563fa2623ec76ed1', 0o644),
              'tools/release_catalog_reviewed_nutrition_targets_044.v1.json': ('c0f706fd97e750259ba369bcb387074f5e49504fce5e522588c320ddf253b83e', 0o644),
              'tools/release_catalog_reviewed_nutrition_targets_044b.v1.json': ('9f808c7429547f8c5d89cc95edb215ca814641e2f100a8672ddb4fd4e839f6ea', 0o644),
              'tools/release_catalog_reviewed_nutrition_targets_044c.v1.json': ('3878be1b8960f6bb95368996e262365afaf500479f74d7da589fa810c8ac8b0f', 0o644),
              'tools/release_catalog_reviewed_nutrition_targets_044d.v1.json': ('c1c785d35a7fe2e9ec90eb8bc25c7fb4bde242d77706e1771948d3bdfac07f1e', 0o644),
              'tools/release_catalog_reviewed_nutrition_targets_044e.v1.json': ('e7f0be03b2c003cfc236f8ed2db49e6a1a5b9827a09effa96f6382139e12863a', 0o644),
              'tools/release_catalog_reviewed_nutrition_targets_044f.v1.json': ('316595cd3ff61363db9d4cabaca7b335c4fa5a803926e1ed5e1a7e7bc8ab6654', 0o644),
          }
          encoded = ''.join((ROOT / p).read_text(encoding='ascii') + TAIL_FIX.get(p, '') for p in PARTS)
          if len(encoded) != 113756:
              raise SystemExit(f'Batch 40 encoded length mismatch: {len(encoded)}')
          try:
              payload = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f'invalid Batch 40 base64: {exc}')
          if hashlib.sha256(payload).hexdigest() != PAYLOAD_SHA:
              raise SystemExit('Batch 40 payload sha256 mismatch')
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as tf:
              members = tf.getmembers()
              if [m.name for m in members] != list(FILES):
                  raise SystemExit('Batch 40 payload path/order mismatch')
              for m in members:
                  p = pathlib.PurePosixPath(m.name)
                  if not m.isfile() or p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe member: {m.name}')
                  want_sha, want_mode = FILES[m.name]
                  src = tf.extractfile(m)
                  if src is None:
                      raise SystemExit(f'missing bytes: {m.name}')
                  data = src.read()
                  if hashlib.sha256(data).hexdigest() != want_sha:
                      raise SystemExit(f'file sha256 mismatch: {m.name}')
                  dest = ROOT / m.name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
                  os.chmod(dest, want_mode)
          print(f'materialized {len(FILES)} files; payload={PAYLOAD_SHA}')
          PY
      - name: Validate exact Batch 40 source
        run: |
          export TMPDIR="$RUNNER_TEMP"
          python scripts/version.py validate
          python -m compileall -q custom_components/cook4me tests tools
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              if '.git' not in p.parts:
                  json.loads(p.read_text(encoding='utf-8'))
          print('JSON OK')
          PY
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n
          for f in custom_components/cook4me/frontend/cook4me-panel-v*.js; do node --check "$f"; done
          python -m unittest discover -s tests -v
      - name: Push validated Batch 40 source
        run: |
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$HEAD_BRANCH)" || { echo 'Branch advanced'; exit 78; }
          rm -rf .batch40-bootstrap
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize and validate Batch 40 bulk nutrition reviews'
          git push origin "HEAD:$HEAD_BRANCH"
