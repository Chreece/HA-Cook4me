name: Finalize and validate Batch 40

on:
  pull_request:
    paths:
      - '.github/workflows/batch40-finalize.yml'

permissions:
  contents: write

concurrency:
  group: batch40-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact hash-pinned Batch 40 payload from Git objects
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.request

          ROOT = pathlib.Path.cwd()
          REPO = os.environ['GITHUB_REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          PAYLOAD_SHA = 'b37496856a690426c98e64553a5161998613d1e36aec341d42b07a9c2474bdf8'
          BLOBS = [
              '188690a5058847f84363303213464be0415ba0f5',
