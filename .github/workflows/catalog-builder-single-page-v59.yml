name: Catalog legacy builder single-page contract v59

on:
  push:
    branches:
      - cook4me-catalog-builder-single-page-v59
    paths:
      - .github/workflows/catalog-builder-single-page-v59.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply stable single-page legacy builder contract
        run: python tools/patch_legacy_release_builder_single_page_v59.py
      - name: Validate builder architecture
        run: |
          python -m py_compile tools/build_release_catalog.py tests/test_v59_architecture_contract.py
          python tests/test_v59_architecture_contract.py
          git diff --check
      - name: Commit tested builder repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_release_catalog.py tests/test_v59_architecture_contract.py
          git diff --cached --check
          git commit -m "Align legacy release builder with stable single-page crawl"
          git push origin HEAD:cook4me-catalog-builder-single-page-v59
