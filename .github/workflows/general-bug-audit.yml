name: General bug audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: general-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Transactional labels and correct barcode package size
        run: python tests/test_general_audit_v208.py
      - name: Durable Today history and smart-scale stores
        run: python tests/test_persistence_audit_v209.py
      - name: Durable weekly lifecycle and leftovers
        run: python tests/test_lifecycle_transactions_v210.py
      - name: Durable nutrition and recipe-cost cache
        run: python tests/test_nutrition_cache_transactions_v211.py
      - name: Durable Recipe Hub and currency state
        run: python tests/test_hub_currency_transactions_v212.py
      - name: Preference and product editor races
        run: node --test tests/test_general_audit_v208.mjs
      - name: Browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Delayed responses in the full current frontend
        run: python tests/browser_general_audit_v208.py
      - name: Syntax
        run: |
          python -m compileall -q custom_components/cook4me
          node --check custom_components/cook4me/frontend/product-edit-guard-v208.js
          node --check custom_components/cook4me/frontend/view-filters-v199.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v180.js
