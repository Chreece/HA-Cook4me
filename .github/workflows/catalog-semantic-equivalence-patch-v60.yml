name: Apply reviewed manual ingredient equivalences v60

on:
  push:
    branches:
      - cook4me-ingredient-semantic-confirmation-v60
    paths:
      - '.github/workflows/catalog-semantic-equivalence-patch-v60.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic manual-equivalence patch
        run: python tools/apply_semantic_equivalence_patch_v60.py
      - name: Run semantic-equivalence regression tests
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_semantic_*v60.py' -v
          python -m unittest discover -s tests -p 'test_compile_release_catalog_semantics_v60.py' -v
          python tools/compile_release_catalog_semantics_v60.py \
            --reviews-dir tools \
            --output "$RUNNER_TEMP/semantic-after-equivalence.v60.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'semantic-after-equivalence.v60.json').read_text(encoding='utf-8')
          )
          summary = payload['summary']
          if int(summary.get('semanticEquivalentConfirmedSourceLabels') or 0) != 7:
              raise SystemExit(f"unexpected equivalence count: {summary}")
          if int(summary.get('needsSemanticConfirmationSourceLabels') or 0) != 293:
              raise SystemExit(f"unexpected semantic pending count: {summary}")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Commit tested equivalence support and remove temporary patch files
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Chreece@users.noreply.github.com"
          git rm \
            .github/workflows/catalog-semantic-equivalence-patch-v60.yml \
            tools/apply_semantic_equivalence_patch_v60.py
          git add \
            tools/compile_release_catalog_semantics_v60.py \
            tools/release_catalog_semantic_confirmations.v1.json \
            tests/test_compile_release_catalog_semantics_v60.py \
            tests/test_semantic_manual_equivalence_confirmations_v60.py
          git diff --cached --check
          git commit -m 'Support reviewed manual ingredient equivalences'
          git pull --rebase origin cook4me-ingredient-semantic-confirmation-v60
          git push origin HEAD:cook4me-ingredient-semantic-confirmation-v60
