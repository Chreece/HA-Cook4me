name: Audit remaining ingredient semantics v60

on:
  push:
    branches:
      - cook4me-ingredient-semantic-confirmation-v60
    paths:
      - 'tools/audit_remaining_semantic_ingredients_v60.py'
      - 'tools/audit_standalone_semantic_merge_candidates_v60.py'
      - 'tools/audit_standalone_metadata_exact_candidates_v60.py'
      - 'tools/extract_high_similarity_semantic_candidates_v60.py'
      - 'tools/audit_syntactic_semantic_candidates_v60.py'
      - 'tools/summarize_semantic_similarity_lane_v60.py'
      - 'tools/compile_release_catalog_semantics_v60.py'
      - 'tools/release_catalog_semantic_standalone_dispositions.v1.json'
      - 'tools/release_catalog_semantic_standalone_equivalences.v1.json'
      - 'tools/release_catalog_semantic_high_confidence_syntax_aliases.v1.json'
      - 'tests/test_audit_standalone_semantic_merge_candidates_v60.py'
      - '.github/workflows/catalog-semantic-remaining-audit-v60.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build non-mutating semantic audits
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_audit_standalone_semantic_merge_candidates_v60.py' -v
          python tools/audit_remaining_semantic_ingredients_v60.py \
            --review-root tools \
            --output tools/remaining_semantic_ingredient_audit_v60.json \
            --exact-output tools/remaining_semantic_exact_loose_v60.json
          python tools/extract_high_similarity_semantic_candidates_v60.py \
            --audit tools/remaining_semantic_ingredient_audit_v60.json \
            --output tools/remaining_semantic_high_similarity_v60.json \
            --minimum-score 0.8 \
            --minimum-gap 0.15
          python tools/extract_high_similarity_semantic_candidates_v60.py \
            --audit tools/remaining_semantic_ingredient_audit_v60.json \
            --output tools/remaining_semantic_similarity_070_v60.json \
            --minimum-score 0.7 \
            --minimum-gap 0.15
          python tools/summarize_semantic_similarity_lane_v60.py \
            --input tools/remaining_semantic_similarity_070_v60.json \
            --output tools/remaining_semantic_similarity_070_compact_v60.json
          python tools/audit_syntactic_semantic_candidates_v60.py \
            --review-root tools \
            --output tools/remaining_semantic_syntactic_candidates_v60.json
          python tools/audit_standalone_semantic_merge_candidates_v60.py \
            --review-root tools \
            --output tools/standalone_semantic_merge_audit_v60.json \
            --high-output tools/standalone_semantic_high_priority_v60.json
          python tools/audit_standalone_metadata_exact_candidates_v60.py \
            --review-root tools \
            --output tools/standalone_semantic_metadata_exact_candidates_v60.json
          python - <<'PY'
          import json
          from pathlib import Path

          remaining = json.loads(
              Path('tools/remaining_semantic_ingredient_audit_v60.json').read_text(
                  encoding='utf-8'
              )
          )
          remaining_summary = remaining.get('summary') or {}
          if int(remaining_summary.get('remaining') or 0) != 0:
              raise SystemExit(
                  f"unexpected unresolved semantic count: {remaining_summary.get('remaining')}"
              )
          if remaining.get('policy', {}).get('automaticApproval') is not False:
              raise SystemExit('remaining audit must not approve semantic mappings')
          if remaining.get('policy', {}).get('providerIdentityAssigned') is not False:
              raise SystemExit('remaining audit must not assign provider identities')

          exact = json.loads(
              Path('tools/remaining_semantic_exact_loose_v60.json').read_text(
                  encoding='utf-8'
              )
          )
          if int(exact.get('summary', {}).get('candidateCount') or 0) != 0:
              raise SystemExit('exact-loose pending lane must stay empty after closure')
          syntactic = json.loads(
              Path('tools/remaining_semantic_syntactic_candidates_v60.json').read_text(
                  encoding='utf-8'
              )
          )
          if int(syntactic.get('summary', {}).get('candidateCount') or 0) != 0:
              raise SystemExit('metadata-only pending lane must stay empty after closure')

          ledger = json.loads(
              Path('tools/release_catalog_semantic_standalone_dispositions.v1.json').read_text(
                  encoding='utf-8'
              )
          )
          ledger_items = [row for row in ledger.get('items') or [] if isinstance(row, dict)]
          ambiguous_count = sum(
              row.get('disposition') == 'reviewed-ambiguous-source-fragment'
              for row in ledger_items
          )
          mergeable_count = len(ledger_items) - ambiguous_count
          ledger_summary = ledger.get('summary') or {}
          if int(ledger_summary.get('standaloneDispositionCount') or -1) != len(ledger_items):
              raise SystemExit('standalone ledger total summary is stale')
          if int(ledger_summary.get('reviewedAmbiguousCount') or -1) != ambiguous_count:
              raise SystemExit('standalone ledger ambiguous summary is stale')
          if int(ledger_summary.get('reviewedSourceLocalStandaloneCount') or -1) != mergeable_count:
              raise SystemExit('standalone ledger mergeable summary is stale')

          standalone = json.loads(
              Path('tools/standalone_semantic_merge_audit_v60.json').read_text(
                  encoding='utf-8'
              )
          )
          standalone_summary = standalone.get('summary') or {}
          expected = {
              'standaloneDispositionCount': len(ledger_items),
              'mergeableStandaloneCount': mergeable_count,
              'reviewedAmbiguousCount': ambiguous_count,
          }
          for key, value in expected.items():
              if int(standalone_summary.get(key) or -1) != value:
                  raise SystemExit(
                      f'standalone audit {key}={standalone_summary.get(key)} != {value}'
                  )
          policy = standalone.get('policy') or {}
          if policy.get('automaticApproval') is not False:
              raise SystemExit('standalone audit must remain review-only')
          if policy.get('candidateSearchIsIdentityProof') is not False:
              raise SystemExit('standalone candidate search cannot be identity proof')
          if policy.get('providerIdentityAssigned') is not False:
              raise SystemExit('standalone audit cannot assign provider identities')
          if policy.get('standaloneLedgerMutated') is not False:
              raise SystemExit('standalone audit cannot mutate the disposition ledger')
          if policy.get('ambiguousRowsExcludedFromMergeSuggestions') is not True:
              raise SystemExit('ambiguous standalone rows must be excluded from merge suggestions')
          if policy.get('highConfidenceTargetsCanonicalizedThroughCompiledSemanticGraph') is not True:
              raise SystemExit('standalone audit must use compiled canonical target concepts')
          if policy.get('collapsedHighConfidenceAliasTargetsExcluded') is not True:
              raise SystemExit('standalone audit must exclude collapsed alias target IDs')
          alias_doc = json.loads(
              Path('tools/release_catalog_semantic_high_confidence_syntax_aliases.v1.json').read_text(
                  encoding='utf-8'
              )
          )
          if int(standalone_summary.get('collapsedHighConfidenceAliasConceptCount') or -1) != int(alias_doc['summary']['aliasConceptCount']):
              raise SystemExit('standalone audit alias-exclusion count is stale')

          high = json.loads(
              Path('tools/standalone_semantic_high_priority_v60.json').read_text(
                  encoding='utf-8'
              )
          )
          if high.get('policy', {}).get('automaticApproval') is not False:
              raise SystemExit('high-priority standalone lane must remain review-only')

          metadata_exact = json.loads(
              Path('tools/standalone_semantic_metadata_exact_candidates_v60.json').read_text(
                  encoding='utf-8'
              )
          )
          metadata_policy = metadata_exact.get('policy') or {}
          if metadata_policy.get('automaticApproval') is not False:
              raise SystemExit('metadata-exact standalone lane must remain review-only')
          if metadata_policy.get('candidateSearchIsIdentityProof') is not False:
              raise SystemExit('metadata-exact candidate search cannot be identity proof')
          if metadata_policy.get('providerIdentityAssigned') is not False:
              raise SystemExit('metadata-exact audit cannot assign provider identities')
          if metadata_policy.get('standaloneLedgerMutated') is not False:
              raise SystemExit('metadata-exact audit cannot mutate standalone ledger')
          if metadata_policy.get('safetyEligibilityGranted') is not False:
              raise SystemExit('metadata-exact audit cannot grant safety eligibility')
          if metadata_policy.get('exactReviewedTargetAfterMetadataPreviewRequired') is not True:
              raise SystemExit('metadata-exact audit must require exact reviewed target after preview')
          metadata_summary = metadata_exact.get('summary') or {}
          if int(metadata_summary.get('standaloneDispositionCount') or -1) != len(ledger_items):
              raise SystemExit('metadata-exact audit standalone count is stale')

          for name in (
              'remaining_semantic_high_similarity_v60.json',
              'remaining_semantic_similarity_070_v60.json',
              'remaining_semantic_similarity_070_compact_v60.json',
              'remaining_semantic_syntactic_candidates_v60.json',
          ):
              lane = json.loads(Path('tools', name).read_text(encoding='utf-8'))
              if lane.get('policy', {}).get('automaticApproval') is not False:
                  raise SystemExit(f'{name} must remain review-only')

          print('remaining', json.dumps(remaining_summary, ensure_ascii=False))
          print('standalone', json.dumps(standalone_summary, ensure_ascii=False))
          print('standalone-high', json.dumps(high.get('summary') or {}, ensure_ascii=False))
          print('standalone-metadata-exact', json.dumps(metadata_summary, ensure_ascii=False))
          PY
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: standalone-semantic-resolution-audit-v60-${{ github.sha }}
          path: |
            tools/remaining_semantic_ingredient_audit_v60.json
            tools/remaining_semantic_exact_loose_v60.json
            tools/remaining_semantic_high_similarity_v60.json
            tools/remaining_semantic_similarity_070_v60.json
            tools/remaining_semantic_similarity_070_compact_v60.json
            tools/remaining_semantic_syntactic_candidates_v60.json
            tools/standalone_semantic_merge_audit_v60.json
            tools/standalone_semantic_high_priority_v60.json
            tools/standalone_semantic_metadata_exact_candidates_v60.json
          if-no-files-found: error
          retention-days: 7
