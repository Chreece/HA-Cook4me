          python tests/test_greek_catalog_audit_v153.py
          python tests/test_storage_scale_greek_v154.py
          python tests/test_greek_catalog_audit_v155.py
          python tests/test_greek_catalog_audit_v156.py
          python tests/test_greek_catalog_audit_v157.py
          python tests/test_greek_catalog_audit_v158.py
          python tests/test_greek_catalog_audit_v159.py
          python tests/test_greek_catalog_audit_v160.py
          python tests/test_greek_catalog_audit_v161.py
          python tests/test_greek_catalog_audit_v162.py
          python tests/test_greek_catalog_audit_v163.py
          python tests/test_greek_catalog_audit_v164.py
          python tests/test_greek_catalog_audit_v165.py
          python tests/test_greek_catalog_audit_v166.py
          python tests/test_greek_catalog_audit_v167.py
          python tests/test_greek_catalog_audit_v168.py
          python tests/test_greek_catalog_audit_v169.py
          python tests/test_greek_catalog_audit_v170.py
      - name: Build HACS release archive
        run: |
          rm -rf release
          mkdir -p release/custom_components
          cp -a custom_components/cook4me release/custom_components/
          cd release
          zip -qr ../HA-Cook4me.zip custom_components
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" HA-Cook4me.zip \
            --title "HA-Cook4me ${GITHUB_REF_NAME}" \
            --generate-notes

  beta:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[beta-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate beta source
        run: |
          python scripts/version.py validate
          python -m compileall -q custom_components/cook4me
          python tools/build_frontend_bundle_v126.py --check
          node --check custom_components/cook4me/frontend/cook4me-panel-v128.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v129.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v130.js
          python tests/test_nutrient_scopes_v128.py
          python tests/test_delivery_queue_v129.py
          python tests/test_photoreal_device_v130.py
      - name: Build HACS beta archive
        run: |
          rm -rf release
          mkdir -p release/custom_components
          cp -a custom_components/cook4me release/custom_components/
          cd release
          zip -qr ../HA-Cook4me.zip custom_components
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/cook4me/manifest.json"))["version"])')"
          TAG="beta-${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 1
          fi
          gh release create "${TAG}" HA-Cook4me.zip \
            --target "${GITHUB_SHA}" \
            --title "HA-Cook4me ${VERSION} beta" \
            --generate-notes \
            --prerelease
