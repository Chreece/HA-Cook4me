name: Release

on:
  push:
    branches:
      - main
    tags:
      - "20*.*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate tag and source
        run: |
          python scripts/version.py validate --tag "${GITHUB_REF_NAME}"
          python -m compileall -q custom_components/cook4me
          python tools/build_frontend_bundle_v126.py --check
          node --check custom_components/cook4me/frontend/cook4me-panel-v128.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v129.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v130.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v131.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v132.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v133.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v134.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v135.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v136.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v137.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v138.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v139.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v140.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v141.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v142.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v143.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v144.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v145.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v146.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v147.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v148.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v149.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v150.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v151.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v152.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v153.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v154.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v155.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v156.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v157.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v158.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v159.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v160.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v161.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v162.js
