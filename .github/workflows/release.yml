name: Release

on:
  push:
    branches:
      - main
    tags:
      - "20*.*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate tag and source
        run: |
          python scripts/version.py validate --tag "${GITHUB_REF_NAME}"
          python -m compileall -q custom_components/cook4me
          python tools/build_frontend_bundle_v126.py --check
          node --check custom_components/cook4me/frontend/cook4me-panel-v128.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v129.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v130.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v131.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v132.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v133.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v134.js
          python tests/test_nutrient_scopes_v128.py
          python tests/test_delivery_queue_v129.py
          python tests/test_photoreal_device_v130.py
          python tests/test_editable_meal_history_v131.py
          python tests/test_hard_refresh_device_v132.py
          python tests/test_device_body_offline_v133.py
          python tests/test_transparent_device_v134.py
      - name: Build HACS release archive
        run: |
          rm -rf release
          mkdir -p release/custom_components
          cp -a custom_components/cook4me release/custom_components/
          cd release
          zip -qr ../HA-Cook4me.zip custom_components
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" HA-Cook4me.zip \
            --title "HA-Cook4me ${GITHUB_REF_NAME}" \
            --generate-notes

  beta:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[beta-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate beta source
        run: |
          python scripts/version.py validate
          python -m compileall -q custom_components/cook4me
          python tools/build_frontend_bundle_v126.py --check
          node --check custom_components/cook4me/frontend/cook4me-panel-v128.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v129.js
          node --check custom_components/cook4me/frontend/cook4me-panel-v130.js
          python tests/test_nutrient_scopes_v128.py
          python tests/test_delivery_queue_v129.py
          python tests/test_photoreal_device_v130.py
      - name: Build HACS beta archive
        run: |
          rm -rf release
          mkdir -p release/custom_components
          cp -a custom_components/cook4me release/custom_components/
          cd release
          zip -qr ../HA-Cook4me.zip custom_components
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/cook4me/manifest.json"))["version"])')"
          TAG="beta-${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 1
          fi
          gh release create "${TAG}" HA-Cook4me.zip \
            --target "${GITHUB_SHA}" \
            --title "HA-Cook4me ${VERSION} beta" \
            --generate-notes \
            --prerelease
