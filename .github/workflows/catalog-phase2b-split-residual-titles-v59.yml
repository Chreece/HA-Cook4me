name: Catalog Phase 2B split residual titles v59

on:
  push:
    branches:
      - cook4me-release-catalog-cache-progress-v59
    paths:
      - .github/workflows/catalog-phase2b-split-residual-titles-v59.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Split residual title queue into deterministic batches
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          source = Path('tools/release_catalog_pending_recipe_titles_v59.json')
          payload = json.loads(source.read_text(encoding='utf-8'))
          tasks = [row for row in payload.get('tasks', []) if isinstance(row, dict)]
          by_lang = defaultdict(list)
          for row in tasks:
              by_lang[str(row.get('sourceLanguage') or '').lower()].append(row)

          for old in Path('tools').glob('release_catalog_pending_recipe_titles_v59_batch_*.json'):
              old.unlink()

          manifest = []
          for lang in sorted(by_lang):
              rows = sorted(by_lang[lang], key=lambda r: (str(r.get('sourceText') or '').casefold(), str(r.get('taskId') or '')))
              for index in range(0, len(rows), 50):
                  part = index // 50 + 1
                  chunk = rows[index:index+50]
                  path = Path('tools') / f'release_catalog_pending_recipe_titles_v59_batch_{lang}_{part:02d}.json'
                  batch = {
                      'schema': 1,
                      'kind': 'cook4me-release-catalog-pending-recipe-title-batch-v59',
                      'sourceSnapshot': source.name,
                      'language': lang,
                      'part': part,
                      'taskCount': len(chunk),
                      'tasks': chunk,
                  }
                  path.write_text(json.dumps(batch, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  manifest.append({'language': lang, 'part': part, 'taskCount': len(chunk), 'path': str(path)})

          Path('tools/release_catalog_pending_recipe_titles_v59_batches.json').write_text(
              json.dumps({'schema': 1, 'kind': 'cook4me-release-catalog-pending-recipe-title-batches-v59', 'taskCount': len(tasks), 'batches': manifest}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'taskCount': len(tasks), 'batchCount': len(manifest)}, ensure_ascii=False))
          PY
      - name: Commit split batches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/release_catalog_pending_recipe_titles_v59_batch_*.json tools/release_catalog_pending_recipe_titles_v59_batches.json
          git diff --cached --check
          git commit -m "Split Phase 2B residual catalog title reviews"
          git push origin HEAD:cook4me-release-catalog-cache-progress-v59
