name: Compile nutrition hold releases v60

on:
  push:
    branches:
      - cook4me-nutrition-enrichment-post-activation-v60
    paths:
      - .github/workflows/catalog-nutrition-hold-release-compile-v60.yml
      - tools/compile_release_catalog_nutrition_hold_release_v60.py
      - tools/release_catalog_nutrition_review_hold_release_decisions.v1.json
      - tools/release_catalog_nutrition_review_holds.v1.json
      - tools/nutrition_review_holds_v60.py
      - tests/test_compile_release_catalog_nutrition_hold_release_v60.py
      - tests/test_nutrition_review_holds_v60.py
      - tests/fixtures/nutrition-hold-evidence-subset-v60.json.gz
  workflow_dispatch:

concurrency:
  group: catalog-nutrition-hold-release-compile-v60-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  attestations: write
  id-token: write

jobs:
  compile-hold-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_TAG: nutrition-evidence-v60-archive
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile tooling and run fail-closed regressions
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            tools/compile_release_catalog_nutrition_hold_release_v60.py \
            tools/nutrition_review_holds_v60.py
          python -m unittest \
            tests.test_compile_release_catalog_nutrition_hold_release_v60 \
            tests.test_nutrition_review_holds_v60 -v

      - name: Resolve exact immutable evidence generations
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          value = json.loads(Path('tools/release_catalog_nutrition_review_hold_release_decisions.v1.json').read_text(encoding='utf-8'))
          shas = sorted({str(row.get('sourceEvidenceSha256') or '') for row in value.get('items') or []})
          pattern = re.compile(r'[0-9a-f]{64}\Z')
          if not shas or any(not pattern.fullmatch(sha) for sha in shas):
              raise SystemExit(f'invalid hold-release evidence SHA set: {shas}')
          Path('/tmp/hold-release-evidence-shas.txt').write_text(''.join(f'{sha}\n' for sha in shas), encoding='utf-8')
          print('\n'.join(shas))
          PY

      - name: Download permanent immutable evidence snapshots
        run: |
          set -Eeuo pipefail
          DEST=/tmp/hold-release-evidence
          mkdir -p "$DEST"
          FIXTURE="tests/fixtures/nutrition-hold-evidence-subset-v60.json.gz"
          FIXTURE_JSON="$DEST/nutrition-hold-evidence-subset-v60.json"
          gzip -cd "$FIXTURE" > "$FIXTURE_JSON"
          FIXTURE_SHA="$(sha256sum "$FIXTURE_JSON" | awk '{print $1}')"
          test "$(gh release view "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"
          while IFS= read -r SHA; do
            ASSET="fdc-candidate-evidence-v60-${SHA}.json.gz"
            JSON="$DEST/fdc-candidate-evidence-v60-${SHA}.json"
            if test "$SHA" = "$FIXTURE_SHA"; then
              cp "$FIXTURE_JSON" "$JSON"
            else
              gh release download "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$DEST" --pattern "$ASSET"
              gzip -cd "$DEST/$ASSET" > "$JSON"
            fi
            test "$(sha256sum "$JSON" | awk '{print $1}')" = "$SHA"
          done < /tmp/hold-release-evidence-shas.txt

      - name: Compile release twice and prove deterministic bytes
        run: |
          set -Eeuo pipefail
          DEST=/tmp/hold-release-evidence
          ARGS=()
          while IFS= read -r SHA; do
            ARGS+=(--evidence "$DEST/fdc-candidate-evidence-v60-${SHA}.json")
          done < /tmp/hold-release-evidence-shas.txt
          python tools/compile_release_catalog_nutrition_hold_release_v60.py \
            --decisions tools/release_catalog_nutrition_review_hold_release_decisions.v1.json \
            "${ARGS[@]}" \
            --output /tmp/release_catalog_nutrition_review_hold_releases.v1.json \
            --summary-output /tmp/nutrition-hold-release-summary.v1.json
          python tools/compile_release_catalog_nutrition_hold_release_v60.py \
            --decisions tools/release_catalog_nutrition_review_hold_release_decisions.v1.json \
            "${ARGS[@]}" \
            --output /tmp/release_catalog_nutrition_review_hold_releases.second.v1.json \
            --summary-output /tmp/nutrition-hold-release-summary.second.v1.json
          cmp -s /tmp/release_catalog_nutrition_review_hold_releases.v1.json /tmp/release_catalog_nutrition_review_hold_releases.second.v1.json
          cmp -s /tmp/nutrition-hold-release-summary.v1.json /tmp/nutrition-hold-release-summary.second.v1.json
          cat /tmp/nutrition-hold-release-summary.v1.json

      - name: Upload compiled hold-release evidence
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-hold-release-compiled-v60-${{ github.sha }}
          path: |
            /tmp/release_catalog_nutrition_review_hold_releases.v1.json
            /tmp/nutrition-hold-release-summary.v1.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 7


      - name: Promote exact compiled hold-release receipt
        id: promote
        run: |
          set -Eeuo pipefail
          BRANCH="cook4me-nutrition-enrichment-post-activation-v60"
          OUTPUT="tools/release_catalog_nutrition_review_hold_releases.v1.json"
          cp /tmp/release_catalog_nutrition_review_hold_releases.v1.json "$OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          git diff --cached --check
          if git diff --cached --quiet; then
            PROMOTED_SHA="$(git rev-parse HEAD)"
            echo "promoted_sha=$PROMOTED_SHA" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Compile nutrition hold releases v60"

          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "promoted_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test "$attempt" -lt 3
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              echo "Concurrent changes conflict with compiled hold-release promotion." >&2
              exit 1
            fi
          done
          echo "Unable to promote compiled hold release after bounded retries." >&2
          exit 1


      - name: Determine whether compiled release still needs activation
        id: activation
        env:
          PROMOTED_SHA: ${{ steps.promote.outputs.promoted_sha }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              Path("tools/release_catalog_nutrition_review_hold_releases.v1.json").read_text(
                  encoding="utf-8"
              )
          )
          catalog = json.loads(
              Path("custom_components/cook4me/catalog/merged_catalog.v1.json").read_text(
                  encoding="utf-8"
              )
          )
          ingredients = {
              str(row.get("id") or row.get("ingredientId") or row.get("key") or ""): row
              for row in catalog.get("ingredients") or []
              if isinstance(row, dict)
          }
          members = sorted(
              {
                  str(member)
                  for item in release.get("items") or []
                  if isinstance(item, dict) and item.get("approved") is True
                  for member in item.get("memberIngredientIds") or []
                  if str(member)
              }
          )
          missing = [
              member
              for member in members
              if not isinstance(ingredients.get(member, {}).get("nutrition"), dict)
          ]
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"needs_activation={'true' if missing else 'false'}\n")
              handle.write(f"source_sha={os.environ.get('PROMOTED_SHA', '').strip()}\n")
          print(json.dumps({
              "releasedMemberCount": len(members),
              "missingReleasedNutritionCount": len(missing),
              "missingMembers": missing,
              "sourceSha": os.environ.get("PROMOTED_SHA", "").strip(),
          }, ensure_ascii=False))
          PY

      - name: Activate newly released held nutrition
        if: steps.activation.outputs.needs_activation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.activation.outputs.source_sha }}
          BRANCH: cook4me-nutrition-enrichment-post-activation-v60
        run: |
          set -Eeuo pipefail
          test -n "$SOURCE_SHA"
          gh workflow run catalog-post-activation-nutrition-activate-v60.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH" \
            -f source_sha="$SOURCE_SHA"
