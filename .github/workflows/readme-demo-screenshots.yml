name: Capture README demo screenshots
on:
  push:
    branches: [docs/readme-feature-gallery]
    paths:
      - tools/capture_readme_screenshots.py
      - .github/workflows/readme-demo-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: docs/readme-feature-gallery
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Chromium and image encoder
        run: |
          python -m pip install playwright==1.57.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Capture production frontend against bundled demo data
        run: python tools/capture_readme_screenshots.py
      - name: Store demo screenshots in this documentation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/assets/screenshots/
          if git diff --cached --quiet; then
            echo 'Screenshots unchanged'
            exit 0
          fi
          git commit -m 'docs: capture Cook4Me demo interface images [skip ci]'
          git push origin HEAD:refs/heads/docs/readme-feature-gallery
